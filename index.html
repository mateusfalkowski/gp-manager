<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GP Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#12141a;
  --bg-alt:#181b22;
  --surface:#1e222b;
  --surface-hover:#262b36;
  --border:#2b303c;
  --text:#eef0f3;
  --text-dim:#8f97a3;
  --accent:#ff7a29;
  --accent-2:#ffd23f;
  --danger:#e6435a;
  --good:#3ddc84;
}
*{box-sizing:border-box;}
#gpm .card,#gpm .btn,#gpm .tab,#gpm .season-btn,#gpm .speed-btn{touch-action:manipulation;}
#gpm{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:0;
  margin:0;
  -webkit-font-smoothing:antialiased;
}
#gpm .wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px;}
#gpm h1,#gpm h2,#gpm h3,#gpm .num{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.02em;}
#gpm .flagstrip{
  height:8px;width:100%;
  background-image:repeating-conic-gradient(#20232b 0% 25%, #383e4a 0% 50%);
  background-size:16px 16px;
  opacity:.6;
}
#gpm .header{padding:20px 0 14px;}
#gpm .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:700;}
#gpm h1{font-size:30px;margin:4px 0 2px;line-height:1.05;}
#gpm .subtitle{color:var(--text-dim);font-size:13.5px;margin-bottom:14px;}
#gpm input.teamname{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-family:'Rajdhani',sans-serif;font-weight:600;font-size:17px;
  padding:9px 12px;border-radius:8px;width:100%;max-width:340px;outline:none;
}
#gpm input.teamname:focus{border-color:var(--accent);}

/* budget gauge */
#gpm .gauge-box{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin:16px 0 18px;
}
#gpm .gauge-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
#gpm .gauge-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-dim);}
#gpm .gauge-value{font-size:22px;}
#gpm .gauge-value .rem{color:var(--accent-2);}
#gpm .gauge-value .over{color:var(--danger);}
#gpm .gauge-track{
  height:10px;border-radius:6px;background:var(--bg-alt);overflow:hidden;position:relative;border:1px solid var(--border);
}
#gpm .gauge-fill{
  height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width .35s ease;
}
#gpm .gauge-fill.over{background:linear-gradient(90deg,var(--danger),#ff8a9c);}

/* tabs */
#gpm .tabs{display:flex;gap:6px;margin-bottom:14px;}
#gpm .tab{
  flex:1;text-align:center;padding:10px 6px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);cursor:pointer;
  font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14.5px;color:var(--text-dim);
  transition:all .15s ease;user-select:none;
}
#gpm .tab .count{display:block;font-size:11px;font-weight:500;margin-top:2px;color:var(--text-dim);}
#gpm .tab.active{background:var(--accent);border-color:var(--accent);color:#1a1200;}
#gpm .tab.active .count{color:#1a1200cc;}
#gpm .tab.done:not(.active){border-color:var(--good);color:var(--good);}
#gpm .tab.locked{opacity:.35;cursor:not-allowed;}

/* cards */
#gpm .cardgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px;}
#gpm .card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:13px 14px;cursor:pointer;transition:all .15s ease;position:relative;
}
#gpm .card:hover:not(.disabled){border-color:var(--accent);background:var(--surface-hover);}
#gpm .card.selected{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,122,41,.12),var(--surface));box-shadow:0 0 0 1px var(--accent) inset;}
#gpm .card.disabled{opacity:.4;cursor:not-allowed;}
#gpm .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
#gpm .card-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;line-height:1.15;}
#gpm .card-role{font-size:12px;color:var(--accent-2);font-weight:600;}
#gpm .card-price{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;color:var(--accent-2);white-space:nowrap;}
#gpm .card-desc{font-size:12px;color:var(--text-dim);margin-bottom:8px;line-height:1.4;}
#gpm .stats{display:flex;gap:12px;flex-wrap:wrap;}
#gpm .stat{flex:1;min-width:60px;}
#gpm .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:3px;}
#gpm .stat-num{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;line-height:1;}
#gpm .stat-num.stat-elite{color:#1fa863;}
#gpm .stat-num.stat-hi{color:var(--good);}
#gpm .stat-num.stat-mid{color:var(--accent-2);}
#gpm .stat-num.stat-lo{color:var(--danger);}
#gpm .check{
  position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:#1a1200;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;
}
#gpm .trait-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
#gpm .trait-tag{
  font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:20px;white-space:nowrap;
}
#gpm .trait-pos{background:rgba(61,220,132,.14);color:var(--good);}
#gpm .trait-neg{background:rgba(230,67,90,.14);color:var(--danger);}

/* season selector */
#gpm .season-box{margin-bottom:14px;}
#gpm .season-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-dim);margin-bottom:6px;}
#gpm .season-btns{display:flex;gap:8px;}
#gpm .season-btn{
  flex:1;text-align:center;padding:9px 6px;border-radius:8px;background:var(--surface);
  border:1px solid var(--border);cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;
  font-size:15px;color:var(--text-dim);transition:all .15s ease;
}
#gpm .season-btn.active{background:var(--accent-2);border-color:var(--accent-2);color:#241a00;}

/* footer bar */
#gpm .footerbar{
  position:sticky;bottom:0;background:var(--bg-alt);border-top:1px solid var(--border);
  padding:12px 16px;margin:0 -16px;display:flex;justify-content:space-between;align-items:center;gap:10px;
}
#gpm .footer-info{font-size:12px;color:var(--text-dim);line-height:1.4;}
#gpm .footer-info b{color:var(--text);}
#gpm .btn{
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:.03em;
  padding:11px 20px;border-radius:8px;border:none;cursor:pointer;text-transform:uppercase;
  background:var(--accent);color:#1a1200;transition:all .15s ease;white-space:nowrap;
}
#gpm .btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px);}
#gpm .btn:disabled{background:var(--border);color:var(--text-dim);cursor:not-allowed;}
#gpm .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
#gpm .btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
#gpm .back-btn{padding:7px 12px;font-size:12.5px;text-transform:none;letter-spacing:0;margin-top:14px;}

/* pre-race / results */
#gpm .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;}
#gpm .lineup-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
#gpm .lineup-row:last-child{border-bottom:none;}
#gpm .lineup-role{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.1em;}
#gpm .lineup-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;}
#gpm .center-cta{display:flex;justify-content:center;margin-top:10px;}

#gpm .board{display:flex;flex-direction:column-reverse;gap:6px;}
#gpm .row{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;opacity:0;transform:translateX(-14px);
  animation:slideIn .45s ease forwards;
}
@keyframes slideIn{to{opacity:1;transform:translateX(0);}}
#gpm .row.mine{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,122,41,.14),var(--surface));}
#gpm .row.dnf{opacity:.55!important;animation:none;}
#gpm .pos{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;width:30px;color:var(--text-dim);}
#gpm .row.mine .pos{color:var(--accent-2);}
#gpm .row .p1{color:#ffd23f;}
#gpm .row .p2{color:#cfd4dc;}
#gpm .row .p3{color:#d68a4c;}
#gpm .row-main{flex:1;min-width:0;}
#gpm .row-driver{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14.5px;}
#gpm .row-team{font-size:11px;color:var(--text-dim);}
#gpm .row-gap{font-family:'Rajdhani',sans-serif;font-size:12.5px;color:var(--text-dim);white-space:nowrap;}
#gpm .row-pts{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;color:var(--good);width:26px;text-align:right;}

#gpm .hero-result{text-align:center;padding:10px 0 4px;}
#gpm .hero-result .num{font-size:44px;color:var(--accent-2);}
#gpm .hero-result .lbl{color:var(--text-dim);font-size:13px;}

#gpm .skipbar{display:flex;justify-content:center;margin-top:14px;}
#gpm .toast{
  font-size:12px;color:var(--text-dim);text-align:center;margin-top:8px;min-height:16px;
}

/* race track */
#gpm .track-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:0 0 12px 12px;
  padding:10px;margin-bottom:8px;
}
#gpm .track-wrap svg{width:100%;height:auto;display:block;}
@media (max-width:600px){
  #gpm .track-wrap svg{max-height:34vh;width:auto;margin:0 auto;}
}
#gpm .legend{display:flex;gap:16px;justify-content:center;align-items:center;font-size:11.5px;color:var(--text-dim);margin:10px 0 4px;flex-wrap:wrap;}
#gpm .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}

/* starting lights */
#gpm .lights-gantry{
  display:flex;gap:8px;justify-content:center;align-items:center;
  background:#1a1d24;border:1px solid var(--border);border-bottom:none;
  border-radius:12px 12px 0 0;padding:12px 10px;
}
#gpm .light{
  width:24px;height:24px;border-radius:50%;background:#3a1216;border:2px solid #4a1a20;
  transition:background .12s ease, box-shadow .12s ease;
}
#gpm .light.on{background:#ff2d3a;border-color:#ff5c66;box-shadow:0 0 16px 5px rgba(255,45,58,.75);}
#gpm .grid-status{
  text-align:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;
  color:var(--accent-2);padding:2px 0 8px;min-height:20px;
}

/* layout: track + timing tower side by side */
#gpm .race-layout{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
#gpm .race-track-col{flex:1 1 300px;min-width:260px;}
#gpm .race-timing-col{flex:1 1 200px;min-width:190px;max-width:100%;}
#gpm .timing-tower{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:8px;display:flex;flex-direction:column;gap:4px;
}
#gpm .timing-title{
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-dim);padding:4px 6px 6px;
}
#gpm .timing-row{
  display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;
  background:var(--bg-alt);font-size:11.5px;
}
#gpm .timing-row.mine{border:1px solid var(--accent);background:linear-gradient(135deg,rgba(255,122,41,.18),var(--bg-alt));}
#gpm .timing-row.dnf{opacity:.4;}
#gpm .timing-pos{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;width:16px;color:var(--text-dim);flex-shrink:0;}
#gpm .timing-row.mine .timing-pos{color:var(--accent-2);}
#gpm .timing-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
#gpm .timing-name{flex:1;font-family:'Rajdhani',sans-serif;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#gpm .timing-pit-badge{margin-left:5px;font-size:10px;}
#gpm .timing-gap{font-family:'Rajdhani',sans-serif;font-size:10.5px;color:var(--text-dim);white-space:nowrap;flex-shrink:0;}
#gpm .timing-tire{display:flex;align-items:center;gap:3px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:10.5px;color:var(--text-dim);white-space:nowrap;flex-shrink:0;}
#gpm .timing-tire-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.3);}

/* highlights (temporada) */
#gpm .hl-board{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
#gpm .hl-card{
  display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;opacity:0;transform:translateY(8px);animation:hlIn .4s ease forwards;
}
@keyframes hlIn{to{opacity:1;transform:translateY(0);}}
#gpm .hl-icon{font-size:20px;line-height:1.2;flex-shrink:0;}
#gpm .hl-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;color:var(--accent-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
#gpm .hl-text{font-size:13px;color:var(--text);line-height:1.4;}
#gpm details.panel summary{
  cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;
  color:var(--accent-2);list-style:revert;user-select:none;
}
#gpm details.panel summary:hover{color:var(--accent);}
#gpm details.panel[open] summary{margin-bottom:4px;}

/* classificação do campeonato */
#gpm .stand-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
#gpm .stand-row:last-child{border-bottom:none;}
#gpm .stand-row.mine{color:var(--accent-2);}
#gpm .stand-row.mine .stand-label{font-weight:700;}
#gpm .stand-pos{width:22px;color:var(--text-dim);font-family:'Rajdhani',sans-serif;font-weight:700;flex-shrink:0;}
#gpm .stand-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#gpm .stand-pts{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--good);white-space:nowrap;}

/* corrida longa */
#gpm .wx-timeline{display:flex;gap:6px;flex-wrap:wrap;}
#gpm .wx-seg{flex:1;min-width:54px;text-align:center;background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;padding:8px 4px;}
#gpm .wx-seg-now{border-color:var(--accent-2);background:linear-gradient(135deg,rgba(255,210,63,.14),var(--bg-alt));}
#gpm .lr-sc-banner{
  text-align:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.03em;
  color:#1a1200;background:linear-gradient(90deg,var(--accent-2),#ffe27a);border-radius:8px;
  padding:9px 10px;margin-bottom:10px;
}
#gpm .wx-seg-lap{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:4px;}
#gpm .wx-seg-icon{font-size:18px;}
#gpm .wx-seg-pct{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;color:var(--text-dim);margin-top:2px;}
#gpm .lr-status{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;}
#gpm .lr-stat{flex:1;min-width:90px;}
#gpm .lr-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:3px;}
#gpm .lr-stat-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;color:var(--text);}
#gpm .lr-standing{font-size:12.5px;color:var(--text-dim);background:var(--bg-alt);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.6;}
#gpm .lr-decision{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,122,41,.12),var(--surface));}
#gpm .lr-decision-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;color:var(--accent-2);}
#gpm .lr-decision-msg{font-size:13px;color:var(--text-dim);margin-top:4px;}
#gpm .lr-decision .cardgrid{margin-bottom:0;}
#gpm .lr-decision .card{cursor:pointer;}
#gpm .lr-pit{text-align:center;border-color:var(--accent-2);background:linear-gradient(135deg,rgba(255,210,63,.10),var(--surface));}
#gpm .lr-pit-timer{margin:12px 0 10px;}
#gpm .lr-pit-time{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:40px;color:var(--accent-2);line-height:1;}
#gpm .lr-pit-req{font-size:12px;color:var(--text-dim);margin-top:4px;}
#gpm .lr-pit-track{height:10px;border-radius:6px;background:var(--bg-alt);overflow:hidden;border:1px solid var(--border);}
#gpm .lr-pit-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
#gpm .lr-pit-problem{margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(239,122,133,.14);border:1px solid rgba(239,122,133,.4);color:var(--bad,#ef7a85);font-size:12.5px;text-align:left;}
#gpm .lr-pit-approach{color:var(--text-dim);font-size:12.5px;margin-top:4px;}

/* controle de velocidade da simulação */
#gpm .speed-ctrl{display:flex;gap:6px;}
#gpm .speed-btn{
  padding:6px 12px;border-radius:7px;background:var(--surface);border:1px solid var(--border);
  cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;color:var(--text-dim);
  transition:all .15s ease;user-select:none;
}
#gpm .speed-btn:hover{border-color:var(--accent);color:var(--text);}
#gpm .speed-btn.active{background:var(--accent);border-color:var(--accent);color:#1a1200;}

/* faixa de controles agrupados da corrida longa (velocidade + previsão + pit) — tudo junto no
   topo, principalmente pra não espalhar botões pela tela toda no celular */
#gpm .lr-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;}
#gpm .lr-ctrl-btn{
  padding:6px 12px;font-size:13px;text-transform:none;letter-spacing:0;white-space:nowrap;
}
</style>

<div id="gpm">
  <div class="flagstrip"></div>
  <div class="wrap" id="gpm-root"></div>
</div>

function flagFor(nat){

  return map[(nat||'').toUpperCase()] || '🏁';
}

// achata "personagem + cada temporada dele" em cartas individuais, prontas pro sorteio do draft
function buildAllCards(){
  ALL_CARDS.chefes = [];
  (RAW_DATA.chefes||[]).forEach(function(c){
    (c.seasons||[]).forEach(function(s){
      var devBase = (s.overall*0.6 + (s.development!=null?s.development:s.overall)*0.4);
      var scoreMult = 0.90 + (devBase/100)*0.20;
      var consBase = ((s.leadership!=null?s.leadership:s.overall) + (s.strategy!=null?s.strategy:s.overall))/2;
      var varMult = 1.30 - (consBase/100)*0.60;
      var traits = (s.positive_traits||[]).concat(s.negative_traits||[]);
      ALL_CARDS.chefes.push({
        id:c.id+'_'+s.year, personId:c.id, nome:c.name, pais:flagFor(c.nationality),
        apelido:(s.team||'—')+' • '+s.year,
        scoreMult:scoreMult, varMult:varMult,
        lideranca:s.leadership!=null?s.leadership:s.overall,
        estrategia:s.strategy!=null?s.strategy:s.overall,
        desenvolvimento:s.development!=null?s.development:s.overall,
        desc: traits.join(' · '),
        traitsPos:s.positive_traits||[], traitsNeg:s.negative_traits||[]
      });
    });
  });

  ALL_CARDS.pilotos = [];
  (RAW_DATA.pilotos||[]).forEach(function(p){
    (p.seasons||[]).forEach(function(s){
      ALL_CARDS.pilotos.push({
        id:p.id+'_'+s.year, personId:p.id, nome:p.name, pais:flagFor(p.nationality),
        apelido:(s.team||'—')+' • '+s.year, team:s.team||'—', year:s.year,
        vel:s.pace!=null?s.pace:s.overall, cons:s.consistency!=null?s.consistency:s.overall, agr:s.aggression!=null?s.aggression:s.overall,
        traitsPos:s.positive_traits||[], traitsNeg:s.negative_traits||[]
      });
    });
  });

  ALL_CARDS.motores = [];
  if(RAW_DATA.motores && RAW_DATA.motores.length){
    RAW_DATA.motores.forEach(function(m){
      (m.seasons||[]).forEach(function(s){
        ALL_CARDS.motores.push({
          id:m.id+'_'+s.year, personId:m.id, nome:m.name, fabricante:'Era '+s.year,
          pot:s.power, confiab:s.reliability,
          desc: (s.positive_traits||[]).concat(s.negative_traits||[]).join(' · '),
          traitsPos:s.positive_traits||[], traitsNeg:s.negative_traits||[]
        });
      });
    });
  } else {
    ALL_CARDS.motores = MOTORES.slice(); // fallback: fabricantes reais de 2026
  }
}

function traitTags(pos, neg){
  var html = '';
  (pos||[]).forEach(function(t){ html += '<span class="trait-tag trait-pos">▲ '+t+'</span>'; });
  (neg||[]).forEach(function(t){ html += '<span class="trait-tag trait-neg">▼ '+t+'</span>'; });
  return html ? '<div class="trait-row">'+html+'</div>' : '';
}

function loadExternalData(){
  fetch('./data.json', {cache:'no-store'}).then(function(res){
    if(!res.ok) throw new Error('sem data.json');
    return res.json();
  }).then(function(json){
    if(json && Array.isArray(json.chefes) && Array.isArray(json.pilotos)){
      RAW_DATA = json;
      buildAllCards();
      // só reaplica automaticamente se o jogador ainda não começou a escolher nada
      if(state.screen==='draft' && !state.chefe && state.pilotos.length===0 && !state.motor){
        state.pools = generatePools();
        render();
      }
    }
  }).catch(function(){
    // sem data.json (ou erro de CORS ao abrir como arquivo local) — mantém o roster padrão embutido
  });
}

// diferença de ritmo puro entre os compostos: macio > médio > duro (o resto do desempenho vem do encaixe com a pista/desgaste)
function compoundGrip(compoundId){
  var t = tireById(compoundId);
  return t && t.grip!=null ? t.grip : 1.0;
}

// desempenho de cada composto conforme o % de umidade da pista (0-100)
function tireWetnessFit(compoundId, wetPct){
  if(compoundId==='inter'){
    if(wetPct<15) return 1 - (15-wetPct)/15*0.55;
    if(wetPct<=60) return 1;
    return 1 - (wetPct-60)/40*0.55;
  }
  if(compoundId==='chuva'){
    if(wetPct>60) return 1;
    return 1 - (60-wetPct)/60*0.65;
  }
  // slicks (macio/médio/duro)
  if(wetPct<15) return 1;
  return Math.max(0.12, 1 - (wetPct-15)/85*1.15);
}

function wetnessZone(pct){
  return pct<15 ? 'seca' : (pct<=60 ? 'umida' : 'molhada');
}

var WEATHER_COND_ICON = {seco:'☀️', nublado:'🌥️', chuva:'🌧️'};
var WEATHER_COND_LABEL = {seco:'Seco', nublado:'Nublado', chuva:'Chuva'};

function weatherStatusLabel(cond, wetPct){
  return WEATHER_COND_ICON[cond]+' '+WEATHER_COND_LABEL[cond]+' — pista '+Math.round(wetPct)+'% molhada';
}

function tireById(id){
  return TIRE_COMPOUNDS.filter(function(t){ return t.id===id; })[0];
}

function tireLifeLaps(t){
  return Math.max(2, Math.round(8/t.wear));
}

function tireWearPct(compoundId, tireLaps){
  var t = tireById(compoundId);
  return Math.min(100, Math.round((tireLaps*t.wear/8)*100));
}

function pickCompoundForConditions(wetPct){

  if(wetPct>=15) return 'inter';
  var r = Math.random();
  return r<0.4 ? 'macio' : (r<0.8 ? 'medio' : 'duro');
}

function wetnessAtSegment(lr, lap){

}

function buildTireCard(t, lapsToCompare, onClick){

    : (life===1 ? '▼ Dura ~1 volta — provável pit stop antes do fim' : '▼ Dura ~'+life+' voltas — provável pit stop antes do fim');

    '<div class="card">'+

    '</div>'
  );
  card.addEventListener('click', onClick);
  return card;
}

function rollInitialCondition(){
  var r = Math.random();
  return r<0.5 ? 'seco' : (r<0.8 ? 'nublado' : 'chuva');
}

function initialWetnessFor(cond){
  if(cond==='chuva') return rand(25,55);
  if(cond==='nublado') return rand(5,25);
  return rand(0,12);
}

function nextWeatherCondition(c){
  if(c==='seco') return Math.random()<0.65 ? 'seco' : (Math.random()<0.5 ? 'nublado' : 'chuva');
  if(c==='chuva') return Math.random()<0.55 ? 'chuva' : (Math.random()<0.5 ? 'nublado' : 'seco');
  return Math.random()<0.4 ? 'nublado' : (Math.random()<0.5 ? 'seco' : 'chuva');
}

// a umidade da pista é consequência da condição: chuva molha, sol seca, nublado seca devagar
function wetnessDelta(cond){
  if(cond==='chuva') return rand(10,26);
  if(cond==='seco') return -rand(8,20);
  return -rand(1,8);
}

function clampWet(w){ return Math.max(0, Math.min(100, w)); }

// previsão em blocos de 2 voltas: a condição do tempo evolui aos poucos e a umidade decorre dela.
// o clima real segue a previsão na maioria das corridas — só uma parte delas tem uma "virada"
// de verdade, pra previsão não surpreender toda hora
function buildWeatherScript(laps){
  var segCount = Math.max(1, Math.ceil(laps/2));

  var forecastCond = [], forecastWet = [];
  var fc = rollInitialCondition();
  var fw = initialWetnessFor(fc);
  for(var i=0;i<segCount;i++){
    if(i>0){ fc = nextWeatherCondition(fc); fw = clampWet(fw + wetnessDelta(fc)); }
    forecastCond.push(fc);
    forecastWet.push(Math.round(fw));
  }

  // uma única rolagem por corrida decide se vai ter surpresa — e se tiver, acontece uma vez só,
  // num ponto do meio da corrida (não faz sentido "surpreender" faltando 1 volta)
  var willSurprise = segCount>2 && Math.random()<0.1;
  var surpriseSeg = willSurprise ? Math.floor(rand(1, Math.max(2,segCount-1))) : -1;

  var actualCond = [], actualWet = [];
  var ac = forecastCond[0], aw = forecastWet[0];
  var diverged = false;
  for(var j=0;j<segCount;j++){
    if(j>0){
      if(j===surpriseSeg) diverged = true;
      ac = diverged ? nextWeatherCondition(ac) : forecastCond[j];
      aw = clampWet(aw + wetnessDelta(ac));
    }
    actualCond.push(ac);
    actualWet.push(Math.round(aw));
  }

  return { segCount:segCount, forecastCond:forecastCond, forecastWet:forecastWet, actualCond:actualCond, actualWet:actualWet };
}

function trackConditionLabel(wetPct){
  return wetPct<15 ? 'seca' : 'molhada';
}

function segmentLapLabel(i, laps){
  var start = i*2+1, end = Math.min(laps, i*2+2);
  return start===end ? ('V'+start) : ('V'+start+'-'+end);
}

// mesma previsão mostrada antes da largada, reaproveitada nos momentos de decisão (SC/VSC/clima/pit)
// pra dar ao jogador a mesma informação que ele tinha ao escolher o pneu inicial
// a previsão "atualiza em tempo real" conforme a corrida acontece: voltas já rodadas e o
// segmento logo à frente mostram o clima real (já é praticamente certo), só o resto do
// horizonte ainda usa a previsão original — quanto menos volta falta, menos incerteza sobra
function liveForecast(lr){
  var w = lr.weather;
  if(!lr.started) return {cond:w.forecastCond, wet:w.forecastWet};
  var curSeg = Math.floor((lr.lap>0?lr.lap-1:0)/2);
  var reliableUntil = curSeg+1; // segmento atual + o próximo já são tratados como praticamente certos
  var cond = [], wet = [];
  for(var i=0;i<w.segCount;i++){
    if(i<=reliableUntil){ cond.push(w.actualCond[i]); wet.push(w.actualWet[i]); }
    else { cond.push(w.forecastCond[i]); wet.push(w.forecastWet[i]); }
  }
  return {cond:cond, wet:wet};
}

function weatherTimelineHtml(lr){
  var laps = lr.totalLaps;
  var live = liveForecast(lr);
  var segHtml = live.cond.map(function(c,i){
    return '<div class="wx-seg'+(i===Math.floor((lr.lap>0?lr.lap-1:0)/2)?' wx-seg-now':'')+'"><div class="wx-seg-lap">'+segmentLapLabel(i,laps)+'</div><div class="wx-seg-icon">'+WEATHER_COND_ICON[c]+'</div><div class="wx-seg-pct">'+live.wet[i]+'%</div></div>';
  }).join('');
  return '<div class="timing-title" style="padding:0 0 8px;">Previsão a cada 2 voltas</div><div class="wx-timeline">'+segHtml+'</div>';
}

// mostra onde os carros do jogador estão na hora de uma decisão (posição e gap) — sem isso, o
// jogador escolhia pneu/pit sem noção nenhuma de contexto (líder? brigando por posição? já bem atrás?)
function myStandingHtml(lr){
  var all = lr.rivalField.concat(lr.mineField);
  var ordered = all.slice().sort(function(a,b){
    var pa = a._liveProgress!=null?a._liveProgress:(a._progress||0);
    var pb = b._liveProgress!=null?b._liveProgress:(b._progress||0);
    return pb-pa;
  });
  var leaderLive = ordered.length ? (ordered[0]._liveProgress!=null?ordered[0]._liveProgress:(ordered[0]._progress||0)) : 0;
  var parts = lr.mineField.map(function(d){
    var idx = ordered.indexOf(d);
    var myLive = d._liveProgress!=null?d._liveProgress:(d._progress||0);
    var isDnf = d.dnf && myLive >= d._dnfLap-1e-6;
    var gapText = isDnf ? 'ABANDONOU' : (idx===0 ? 'líder' : '+'+((leaderLive-myLive)*LR_LAP_SECONDS).toFixed(1)+'s');
    return '<b style="color:var(--accent-2);">'+shortName(d.driverName)+'</b> P'+(idx+1)+' ('+gapText+')';
  });
  return '<div class="lr-standing">📍 '+parts.join(' &nbsp;·&nbsp; ')+'</div>';
}

function getActiveTrack(){

}

function catmullRom(p0,p1,p2,p3,t){
  var t2=t*t, t3=t2*t;
  return {
    x: 0.5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    y: 0.5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  };
}

function buildClosedSpline(anchors, samplesPerSeg){
  var n = anchors.length, pts = [];
  for(var i=0;i<n;i++){
    var p0 = anchors[(i-1+n)%n], p1 = anchors[i], p2 = anchors[(i+1)%n], p3 = anchors[(i+2)%n];
    for(var s=0;s<samplesPerSeg;s++){
      pts.push(catmullRom(p0,p1,p2,p3, s/samplesPerSeg));
    }
  }
  return pts;
}

function buildTrackData(anchors){
  var pts = buildClosedSpline(anchors, 14);
  var ptsExt = pts.concat([pts[0]]);
  var cum = [0];
  for(var i=1;i<ptsExt.length;i++){
    var a=ptsExt[i-1], b=ptsExt[i];
    var dx=b.x-a.x, dy=b.y-a.y;
    cum.push(cum[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  var total = cum[cum.length-1];
  var d = 'M'+pts.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' L')+' Z';
  return { pts:pts, ptsExt:ptsExt, cum:cum, total:total, d:d };
}

function trackPointAt(trackData, dist){
  var d = ((dist % trackData.total)+trackData.total) % trackData.total;
  var lo=0, hi=trackData.cum.length-1;
  while(lo<hi-1){
    var mid=(lo+hi)>>1;
    if(trackData.cum[mid]<=d) lo=mid; else hi=mid;
  }
  var segLen = (trackData.cum[hi]-trackData.cum[lo]) || 1;
  var frac = (d-trackData.cum[lo])/segLen;
  var a=trackData.ptsExt[lo], b=trackData.ptsExt[hi];
  return { x: a.x+(b.x-a.x)*frac, y: a.y+(b.y-a.y)*frac };
}

function startLineMarkup(trackData){
  var pt = trackData.pt0 || trackPointAt(trackData, 0);
  var pt2 = trackPointAt(trackData, 2);
  var dx=pt2.x-pt.x, dy=pt2.y-pt.y;
  var mag=Math.sqrt(dx*dx+dy*dy)||1;
  var nx=-dy/mag, ny=dx/mag;
  var half=11;
  var x1=pt.x+nx*half, y1=pt.y+ny*half;
  var x2=pt.x-nx*half, y2=pt.y-ny*half;
  return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="url(#gpm-chk)" stroke-width="7"/>';
}

/* ---------- pools aleatórias (opções mudam a cada rodada) ---------- */
function pickRandom(arr, n){
  var copy = arr.slice();
  for(var i=copy.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = copy[i]; copy[i]=copy[j]; copy[j]=tmp;
  }
  return copy.slice(0, Math.min(n, copy.length));
}

// sorteia cartas garantindo no máximo 1 carta por pessoa/fabricante (evita a mesma pessoa aparecer 2x no mesmo pool)
function pickRandomDistinctPersons(cards, n){
  var byPerson = {};
  cards.forEach(function(c){
    var key = c.personId || c.id;
    (byPerson[key] = byPerson[key] || []).push(c);
  });
  var groups = pickRandom(Object.keys(byPerson).map(function(k){ return byPerson[k]; }), n);
  return groups.map(function(g){ return g[Math.floor(Math.random()*g.length)]; });
}

function generatePools(){
  return {
    chefe: pickRandomDistinctPersons(ALL_CARDS.chefes, Math.min(3, ALL_CARDS.chefes.length)),
    pilotos: pickRandomDistinctPersons(ALL_CARDS.pilotos, Math.min(5, ALL_CARDS.pilotos.length)),
    motor: pickRandomDistinctPersons(ALL_CARDS.motores, Math.min(3, ALL_CARDS.motores.length))
  };
}

  // evita pular direto de uma tela pra duas telas à frente com um único toque
  var now = Date.now();
  if(now - _lastRenderAt < 150) return;

  else if(state.screen==='results') root.appendChild(renderResults());

function initSeason(){
  var myPersonIds = state.pilotos.map(function(p){ return p.personId; });
  var rivals = buildRivalPool(10, myPersonIds);
  // a equipe do jogador tem 2 pilotos com pontos somados — pra ser justo, os 10 rivais também
  // formam 5 equipes de 2, senão a equipe do jogador sempre pontua em dobro contra pilotos sozinhos
  var standings = [{key:'mine', label:state.teamName, mine:true, points:0}];
  for(var i=0;i<rivals.length;i+=2){
    var teamKey = 'rt_'+(i/2);
    var partner = rivals[i+1];
    var teamLabel = (partner && partner.team && partner.team!==rivals[i].team) ? rivals[i].team+' / '+partner.team : rivals[i].team;
    rivals[i].teamKey = teamKey;
    if(partner) partner.teamKey = teamKey;
    standings.push({key:teamKey, label:teamLabel, mine:false, points:0});
  }
  state.season = { trackIndex:0, rivals:rivals, standings:standings, history:[] };
}

    '<div class="lineup-row"><div><div class="lineup-role">Motor</div><div class="lineup-name">'+state.motor.nome+' ('+state.motor.fabricante+')</div></div></div>';
  wrap.appendChild(panel);

  if(seasonActive && state.season.trackIndex>0){
    var standWrap = el('<div class="panel"></div>');
    standWrap.innerHTML = '<div class="timing-title" style="padding:0 0 8px;">Classificação atual do campeonato</div>'+standingsHtml(state.season.standings);
    wrap.appendChild(standWrap);
  }

  var actions = el('<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"></div>');
  if(state.raceStyle==='longa'){
    var goBtn = el('<button class="btn">🌦️ Ver previsão e escolher pneus</button>');
    goBtn.addEventListener('click', function(){ enterStrategy(); });
    actions.appendChild(goBtn);
  } else if(seasonActive){
    var watchBtn = el('<button class="btn">🎬 Assistir corrida</button>');
    watchBtn.addEventListener('click', function(){ startSeasonRace(true); });
    var hlBtn = el('<button class="btn ghost">⚡ Ver melhores momentos</button>');
    hlBtn.addEventListener('click', function(){ startSeasonRace(false); });
    actions.appendChild(watchBtn);
    actions.appendChild(hlBtn);
  } else {
    var startBtn = el('<button class="btn">Largar para a corrida</button>');
    startBtn.addEventListener('click', function(){ startRace(); });
    actions.appendChild(startBtn);
  }
  wrap.appendChild(actions);

  return wrap;
}

function rand(min,max){ return min + Math.random()*(max-min); }

function buildRival(name, team){
  var vel = rand(68,96), cons = rand(60,92), agr = rand(50,92);
  var pot = rand(68,97), confiab = rand(65,92);
  return {personId:'filler_'+name, nome:name, pais:null, team:team, vel:vel, cons:cons, agr:agr, pot:pot, confiab:confiab};
}

// procura cartas que foram companheiros de equipe de verdade (mesmo time E mesmo ano na base de
// dados) — usado pra escalar rivais que correram juntos de verdade, quando essa informação existir
function findRealTeammatePairs(candidates){
  var byKey = {};
  candidates.forEach(function(c){
    var key = c.team+'|'+c.year;
    (byKey[key] = byKey[key] || []).push(c);
  });
  var pairs = [];
  Object.keys(byKey).forEach(function(k){
    var group = byKey[k].slice();
    while(group.length>=2){
      var a = group.pop(), b = group.pop();
      if(a.personId!==b.personId) pairs.push([a,b]);
    }
  });
  return pairs;
}

// sorteia os rivais da corrida a partir do MESMO pool de pilotos que o jogador pode escolher no draft
// (excluindo quem já está na sua equipe), com atributos de motor aleatórios já que eles não têm um motor escolhido.
// prioriza formar duplas de rivais que foram companheiros de equipe reais (mesmo time+ano na base de
// dados); o resto do grid é preenchido com pilotos avulsos como antes.
function buildRivalPool(n, excludePersonIds){
  var candidates = ALL_CARDS.pilotos.filter(function(c){ return excludePersonIds.indexOf(c.personId)===-1; });
  var realPairs = findRealTeammatePairs(candidates).sort(function(){ return Math.random()-0.5; });
  var rivals = [];
  var usedPersonIds = {};
  realPairs.forEach(function(pair){
    if(rivals.length+2>n) return;
    if(usedPersonIds[pair[0].personId] || usedPersonIds[pair[1].personId]) return;
    pair.forEach(function(p){
      rivals.push({
        personId:p.personId, nome:p.nome, pais:p.pais, team:p.team, year:p.year,
        vel:p.vel, cons:p.cons, agr:p.agr,
        pot:rand(68,97), confiab:rand(65,92), realTeammate:true
      });
      usedPersonIds[p.personId] = true;
    });
  });
  var remainingCandidates = candidates.filter(function(c){ return !usedPersonIds[c.personId]; });
  var picks = pickRandomDistinctPersons(remainingCandidates, n-rivals.length);
  picks.forEach(function(p){
    rivals.push({
      personId:p.personId, nome:p.nome, pais:p.pais, team:p.team, year:p.year,
      vel:p.vel, cons:p.cons, agr:p.agr,
      pot:rand(68,97), confiab:rand(65,92)
    });
  });
  if(rivals.length < n){
    var usedIds = rivals.map(function(r){ return r.personId; });
    var usedNames = rivals.map(function(r){ return r.nome; });
    FILLER_NOMES.slice().sort(function(){ return Math.random()-0.5; }).forEach(function(f){
      if(rivals.length>=n) return;
      if(usedNames.indexOf(f[0])>=0 || usedIds.indexOf('filler_'+f[0])>=0) return;
      rivals.push(buildRival(f[0], f[1]));
    });
  }
  return rivals;
}

function computeScore(driver){
  var base = driver.vel*0.35 + driver.agr*0.15 + driver.cons*0.15 + driver.pot*0.25 + driver.confiab*0.10;
  base = base * (driver.scoreMult||1);
  var varianceRange = (100-driver.cons)*0.4 * (driver.varMult||1);
  var noisy = base + (Math.random()*2-1)*varianceRange*0.3;
  return noisy;
}

function buildFieldBase(rivals){
  var field = [];
  state.pilotos.forEach(function(p){
    field.push({
      nome:p.pais+' '+p.nome+' '+p.apelido, driverName:p.nome, year:p.year, team:state.teamName, mine:true,
      vel:p.vel, cons:p.cons, agr:p.agr,
      pot:state.motor.pot, confiab:state.motor.confiab,
      scoreMult:state.chefe.scoreMult, varMult:state.chefe.varMult
    });
  });
  rivals.forEach(function(r){
    field.push({
      nome:(r.pais?r.pais+' ':'')+r.nome, driverName:r.nome, year:r.year, team:r.team, personId:r.personId, teamKey:r.teamKey, mine:false,
      vel:r.vel, cons:r.cons, agr:r.agr, pot:r.pot, confiab:r.confiab,
      scoreMult:1, varMult:1
    });
  });
  return field;
}

function rollDriverOutcome(d, laps, varBoost){
  var dnfChance = (100-d.confiab)*0.004;
  d.dnf = Math.random() < dnfChance;
  if(varBoost) d.varMult = (d.varMult||1) * varBoost;
  d.score = d.dnf ? -9999 - Math.random()*10 : computeScore(d);
  if(d.dnf) d._dnfLap = Math.max(1, Math.round(rand(1, Math.max(1,laps-2))));
}

function resolveRivalsOnly(field, laps, varBoost){
  field.forEach(function(d){ rollDriverOutcome(d, laps, varBoost); });
  return field;
}

function finalizeField(field){
  field.sort(function(a,b){ return b.score - a.score; });

  var pointsTable = [25,18,15,12,10,8,6,4,2,1];
  field.forEach(function(d,i){
    d.pos = i+1;
    d.pts = d.dnf ? 0 : (pointsTable[i]||0);
  });

  var leaderScore = field[0].score;
  field.forEach(function(d){
    d.gap = d.dnf ? 'ABANDONOU' : (d.pos===1? 'LÍDER' : '+'+((leaderScore-d.score)*0.31).toFixed(3)+'s');
  });

  return field;
}

function resolveRace(field, laps){
  field.forEach(function(d){ rollDriverOutcome(d, laps); });
  return finalizeField(field);
}

function startRace(){
  clearRaceTimers();
  clearTimeout(state.revealTimer);
  TOTAL_LAPS = 7;
  state.highlights = [];
  state.raceTrack = TRACKS[Math.floor(Math.random()*TRACKS.length)];
  var myPersonIds = state.pilotos.map(function(p){ return p.personId; });
  var rivals = buildRivalPool(10, myPersonIds);
  var field = resolveRace(buildFieldBase(rivals), TOTAL_LAPS);

  state.results = field;
  state.revealIndex = field.length; // will count down
  state.raceTimers = [];
  state.screen='race';
  render();
}

function fastestLapTime(d){
  var base = 96 - (d.vel*0.28 + d.pot*0.16);
  var t = Math.max(56, base + rand(-1.2,1.2));
  var mins = Math.floor(t/60);
  var secs = t - mins*60;
  return mins+':'+(secs<10?'0':'')+secs.toFixed(3);
}

function buildHighlights(field, track){
  var events = [];
  var finishers = field.filter(function(d){ return !d.dnf; });
  var dnfs = field.filter(function(d){ return d.dnf; });

  if(finishers.length>1){
    var starter = finishers[Math.floor(Math.random()*Math.min(6,finishers.length))];
    events.push({icon:'🏁', title:'Largada', text: shortName(starter.driverName)+' ('+starter.team+') teve uma saída forte e já ganhou posições nas primeiras curvas.'});
  }

  var stratDriver = field[Math.floor(Math.random()*field.length)];
  events.push({icon:'🔧', title:'Estratégia', text: 'Em '+track.name+', a '+stratDriver.team+' apostou numa janela de pit stop diferente da maioria — pista conhecida por '+track.flavor+'.'});

  dnfs.forEach(function(d){
    events.push({icon:'💥', title:'Abandono', text: shortName(d.driverName)+' ('+d.team+') parou na volta '+d._dnfLap+' e não viu a bandeira quadriculada.'});
  });

  if(finishers.length){
    var candidates = finishers.slice().sort(function(a,b){ return (b.vel+b.pot) - (a.vel+a.pot); }).slice(0,4);
    var flDriver = candidates[Math.floor(Math.random()*candidates.length)];
    events.push({icon:'⏱️', title:'Volta mais rápida', text: shortName(flDriver.driverName)+' ('+flDriver.team+') cravou a volta mais rápida da corrida: '+fastestLapTime(flDriver)+'.'});
  }

  var podium = field.slice(0,3);
  events.push({icon:'🏆', title:'Pódio', text: podium.map(function(d,i){ return (i+1)+'º '+shortName(d.driverName)+' ('+d.team+')'; }).join(' · ')});

  return events;
}

function applyStandings(field){
  var mineEntry = state.season.standings.filter(function(s){ return s.key==='mine'; })[0];
  var minePts = field.filter(function(d){ return d.mine; }).reduce(function(s,d){ return s+d.pts; },0);
  mineEntry.points += minePts;
  field.filter(function(d){ return !d.mine; }).forEach(function(d){
    var entry = state.season.standings.filter(function(s){ return s.key===d.teamKey; })[0];
    if(entry) entry.points += d.pts;
  });
  state.season.standings.sort(function(a,b){ return b.points - a.points; });
}

function startSeasonRace(watchLive){
  var track = TRACKS[state.season.trackIndex];
  TOTAL_LAPS = track.laps;
  state.raceTrack = track;
  var field = resolveRace(buildFieldBase(state.season.rivals), track.laps);
  applyStandings(field);
  var highlights = buildHighlights(field, track);
  state.season.history.push({track:track, results:field.slice(), highlights:highlights});

  state.results = field;
  state.highlights = highlights;
  state.highlightIndex = 0;

  if(watchLive){
    clearRaceTimers();
    clearTimeout(state.revealTimer);
    state.revealIndex = field.length;
    state.raceTimers = [];
    state.screen = 'race';
  } else {
    state.screen = 'highlights';
  }
  render();
}

var TOTAL_LAPS = 7;
var LAP_SECONDS = 15; // segundos "de universo" por volta em 1x — 2x/4x aceleram a reprodução, não o resultado

function clearRaceTimers(){

function tireName(id){ var t = tireById(id); return t ? t.nome : id; }

// modelo de desgaste inspirado na F1 real: o pneu perde ritmo aos poucos ao longo do stint
// (degradação normal) e, se não for trocado a tempo, sofre uma queda de desempenho ("cliff")
// bem mais acentuada — é o que torna o momento de parar realmente estratégico
function tireCondition(compoundId, wetPct, tireLaps){
  var t = tireById(compoundId);
  var fit = tireWetnessFit(compoundId, wetPct); // encaixe do composto com a pista no momento (0.12..1)
  var rawWear = (tireLaps*t.wear)/8; // 1.0 = 100% da vida útil nominal do composto
  var wear;
  if(rawWear<=1){
    // degradação bem mais agressiva desde cedo no stint — na F1 real, um pneu já rodado (mesmo
    // longe dos 100%) perde ritmo rápido o bastante pra um pneu novo de composto mais duro já
    // alcançar bem antes do fim da vida útil (é a lógica por trás do "undercut" nas paradas)
    wear = 1 - rawWear*0.42;
  } else {
    wear = Math.max(0.10, 0.58 - (rawWear-1)*0.9); // pneu "estourado" além da vida útil: despenca rápido
  }
  return fit*wear; // 0..1 — combina o encaixe com a pista e o estado físico do pneu
}

// ritmo do carro dado o composto/desgaste atual — usado tanto pro jogador quanto pros rivais,
// multiplicado pelo fator de habilidade/skill de cada piloto (_paceFactor / _driverMult)
function tirePaceFactor(compoundId, wetPct, tireLaps){
  var cond = tireCondition(compoundId, wetPct, tireLaps);
  return compoundGrip(compoundId) * (0.5 + cond*0.65); // 0.5 (pneu morto) .. 1.15 (novo, ótimo encaixe)
}

function tireStintQuality(compoundId, wetPct, tireLaps){
  return tireCondition(compoundId, wetPct, tireLaps);
}

// ritmo efetivo de um rival considerando o pneu que ele está usando — sem isso, os rivais
// corriam sempre no mesmo ritmo mesmo com o pneu 100% gasto (ou além disso)
function rivalTirePace(d, wetPct){
  return d._paceFactor * tirePaceFactor(d._tireCompound, wetPct, d._tireLaps);
}

var LR_LAP_SECONDS = 15; // segundos "de universo" por volta em 1x — 2x/4x aceleram a reprodução, não o resultado

function cautionLogEntry(type){
  return {icon: type==='sc'?'🚨':'🟡', title: type==='sc'?'Safety Car':'Virtual Safety Car', text: type==='sc' ? 'Safety Car na pista — janela boa e barata pra fazer o pit stop.' : 'VSC acionado — parada mais barata que o normal.'};
}

// monta a lista de eventos da corrida inteira (clima, abandonos, incidentes) já na hora de largar,
// pra dar pra tocar a animação contínua entre um evento e outro, só pausando quando importa.
// o número de vezes que a corrida realmente para pra pedir uma decisão é limitado de propósito
// (média de ~3 por corrida, variando entre 2 e 4) — o resto das mudanças acontece em silêncio,
// senão a corrida longa vira uma sequência cansativa de interrupções
function precomputeLongRaceEvents(lr){
  var weatherEvents = [];
  var prevZone = null;
  for(var lap=1; lap<=lr.totalLaps; lap++){
    if((lap-1)%2===0){
      var seg = Math.min(lr.weather.segCount-1, Math.floor((lap-1)/2));
      var wet = lr.weather.actualWet[seg];
      var cond = lr.weather.actualCond[seg];
      var zone = wetnessZone(wet);
      weatherEvents.push({lap:lap, type:'wetness', wetPct:wet, cond:cond, pause: prevZone!==null && zone!==prevZone});
      prevZone = zone;
    }
  }

  var cautionEvents = [];
  lr.rivalField.forEach(function(d){
    if(d.dnf){
      var roll = Math.random();
      // a maioria dos abandonos não exige neutralização — só quando o carro fica parado num lugar perigoso
      var caution = roll<0.15 ? 'sc' : (roll<0.32 ? 'vsc' : null);
      cautionEvents.push({lap:d._dnfLap, type:'dnf', driver:d, caution:caution});
    }
  });
  for(var l=1;l<=lr.totalLaps;l++){
    // raro: a maioria das corridas passa sem nenhum incidente aleatório, mas pode acontecer mais de um em casos isolados
    if(Math.random()<0.012){
      var r2 = Math.random();
      cautionEvents.push({lap:l, type:'incident', caution: r2<0.4?'sc':'vsc'});
    }
  }

  // junta tudo que PODERIA parar a corrida (mudança de zona de clima + cautions) e só deixa
  // as primeiras "targetDecisions" (em ordem de volta) realmente pausarem — o resto se aplica
  // sem interromper (clima muda silenciosamente, abandono/incidente não gera safety car)
  var targetDecisions = Math.max(1, Math.round(rand(2,4)));
  var candidates = weatherEvents.filter(function(e){ return e.pause; })
    .concat(cautionEvents.filter(function(e){ return e.caution; }))
    .sort(function(a,b){ return a.lap-b.lap; });
  var allowed = new Set(candidates.slice(0, targetDecisions));
  weatherEvents.forEach(function(e){ if(e.pause && !allowed.has(e)) e.pause = false; });
  cautionEvents.forEach(function(e){ if(e.caution && !allowed.has(e)) e.caution = null; });

  var events = weatherEvents.concat(cautionEvents);
  events.sort(function(a,b){ return a.lap-b.lap; });
  lr.events = events;
  lr.eventIndex = 0;
}

function initLongRace(compoundId){
  var lr = state.longRace;
  lr.compound = compoundId;

  var myPersonIds = state.pilotos.map(function(p){ return p.personId; });
  var rivalsRoster = state.season ? state.season.rivals : buildRivalPool(10, myPersonIds);
  lr.rivalsRoster = rivalsRoster;

  var fullField = buildFieldBase(rivalsRoster);
  var wetSum = 0;
  for(var i=0;i<lr.weather.segCount;i++){ wetSum += lr.weather.actualWet[i]; }
  var avgWet = (wetSum/lr.weather.segCount)/100;
  var varBoost = 1 + avgWet*0.5;
  lr.rivalField = resolveRivalsOnly(fullField.filter(function(d){ return !d.mine; }), lr.totalLaps, varBoost);
  lr.mineField = fullField.filter(function(d){ return d.mine; });

  var finisherScores = lr.rivalField.filter(function(d){ return !d.dnf; }).map(function(d){ return d.score; });
  var minS = finisherScores.length ? Math.min.apply(null, finisherScores) : 0;
  var maxS = finisherScores.length ? Math.max.apply(null, finisherScores) : 1;
  var palette = ['#5aa9e6','#c792ea','#67d8b0','#f2a65a','#ef7a85','#8a94a6','#d4b483','#7fb3ff','#e8a0bf','#8fd694'];
  var laneOffsets = [-8,-5,-2,2,5,8];
  lr.rivalField.forEach(function(d,i){
    var norm = (d.score-minS)/((maxS-minS)||1);
    d._paceFactor = 0.85 + Math.max(0,Math.min(1,norm))*0.30;
    d._lane = laneOffsets[i%laneOffsets.length];
    d._color = palette[i%palette.length];
    d._progress = 0;
    d._tireCompound = pickCompoundForConditions(lr.wetnessNow);
    d._tireLaps = 0;
    d._pitLap = Math.random()<0.7 ? Math.round(rand(3, Math.max(4,lr.totalLaps-2))) : null;
    if(d._pitLap){
      var rivalTeamSkill = rand(45,92); // competência genérica da equipe rival nos boxes
      var pitRoll = rollPitStop(rivalTeamSkill);
      d._pitStopMs = pitRoll.ms;
      d._pitStopProblem = pitRoll.problem;
    }
  });
  var startPace = tirePaceFactor(compoundId, lr.wetnessNow, 0);
  // pequena diferença de ritmo entre os 2 pilotos da própria equipe (mesmo pneu/estratégia),
  // senão os dois carros correm sempre exatamente colados um no outro
  var mineSkills = lr.mineField.map(function(d){ return d.vel*0.5+d.cons*0.3+d.agr*0.2; });
  var skMin = Math.min.apply(null, mineSkills), skMax = Math.max.apply(null, mineSkills);
  lr.mineField.forEach(function(d,i){
    d._lane = [-3,3][i%2];
    d._color = i===0 ? '#ff7a29' : '#ffb15c';
    d._progress = 0;
    var skill = d.vel*0.5+d.cons*0.3+d.agr*0.2;
    var norm = skMax>skMin ? (skill-skMin)/(skMax-skMin) : 0.5;
    d._driverMult = 0.965 + norm*0.05; // ~0.965..1.015
    d._paceFactor = startPace * d._driverMult;
  });

  // id estável por carro (não muda quando a ordem da tabela de tempos muda), usado pra mover
  // as linhas da tabela em vez de recriá-las toda hora
  lr.rivalField.concat(lr.mineField).forEach(function(d,i){ d._stableIdx = i; });

  precomputeLongRaceEvents(lr);

  lr.history.push({icon:WEATHER_COND_ICON[lr.weatherCondNow], title:'Largada', text:'Pista '+trackConditionLabel(lr.wetnessNow)+' ('+WEATHER_COND_LABEL[lr.weatherCondNow].toLowerCase()+', '+Math.round(lr.wetnessNow)+'% de umidade). Você larga com pneus '+tireName(compoundId)+'.'});

  state.screen = 'longrace';
  render();
}

function logLongRaceEvent(entry, silent){
  var lr = state.longRace;
  lr.history.push(entry);
  if(silent) appendHistoryCard(entry);
}

function appendHistoryCard(entry){
  var board = document.getElementById('gpm-lr-feed');
  if(!board) return;
  var card = el('<div class="hl-card" style="opacity:1;transform:none;animation:none;"><div class="hl-icon">'+entry.icon+'</div><div class="hl-body"><div class="hl-title">'+entry.title+'</div><div class="hl-text">'+entry.text+'</div></div></div>');
  board.insertBefore(card, board.firstChild);
}

// desgasta o pneu de cada rival em 1 volta; quando cruza a volta do pit stop dele, troca o composto
// E aplica o custo real de tempo da parada (mesmo sorteio de sorte+competência usado pro jogador)
function advanceRivalTiresOneLap(lr, lap){
  lr.rivalField.forEach(function(d){
    if(d.dnf && lap>=d._dnfLap) return;
    if(d._pitLap===lap){
      d._tireCompound = pickCompoundForConditions(wetnessAtSegment(lr, lap));
      d._tireLaps = 0;
      if(d._pitStopMs){
        d._progress -= (d._pitStopMs/1000)/LR_LAP_SECONDS;
        if(d._liveProgress!=null) d._liveProgress = d._progress;
      }
    } else {
      d._tireLaps++;
    }
  });
}

function refreshLongRaceTireBadges(){
  var lr = state.longRace;
  if(!lr.timingOrder) return;
  lr.timingOrder.forEach(function(d){
    var elx = document.getElementById(d._tireElId);
    if(!elx) return;
    elx.innerHTML = d.mine ? tireBadgeHtml(lr.compound, lr.tireLaps) : tireBadgeHtml(d._tireCompound, d._tireLaps);
  });
}

function refreshLongRaceStatus(){
  var lr = state.longRace;
  var w = document.getElementById('gpm-lr-weather'); if(w) w.textContent = weatherStatusLabel(lr.weatherCondNow, lr.wetnessNow);
  var t = document.getElementById('gpm-lr-tire'); if(t) t.textContent = tireName(lr.compound);
  var tl = document.getElementById('gpm-lr-tirelaps'); if(tl) tl.textContent = lr.tireLaps;
  var ps = document.getElementById('gpm-lr-pitstops'); if(ps) ps.textContent = lr.pitStops;
  // o popup de previsão fica aberto entre voltas — se não atualizar aqui, ele trava mostrando
  // o clima da volta em que foi aberto mesmo enquanto o resto da tela já avançou
  var wp = document.getElementById('gpm-lr-weather-popup');
  if(wp) wp.innerHTML = weatherTimelineHtml(lr);
}

// aplica um evento já vencido; devolve true se ele pausa a corrida (decisão do jogador)
function applyLongRaceEvent(ev){
  var lr = state.longRace;
  if(ev.type==='wetness'){
    lr.wetnessNow = ev.wetPct;
    lr.weatherCondNow = ev.cond;
    if(ev.pause){
      logLongRaceEvent({icon:WEATHER_COND_ICON[ev.cond], title:'Mudança de clima', text:'Agora está '+WEATHER_COND_LABEL[ev.cond].toLowerCase()+' — pista com '+Math.round(ev.wetPct)+'% de umidade.'});
      lr.pendingDecision = {type:'weather'};
      return true;
    }
    refreshLongRaceStatus();
    return false;
  }
  if(ev.type==='dnf'){
    logLongRaceEvent({icon:'💥', title:'Abandono', text:shortName(ev.driver.driverName)+' ('+ev.driver.team+') parou na pista.'}, true);
    if(ev.caution){
      logLongRaceEvent(cautionLogEntry(ev.caution));
      enterSafetyCar(ev.caution, ev.lap);
    }
    return false;
  }
  if(ev.type==='incident'){
    if(ev.caution){
      logLongRaceEvent({icon:'⚠️', title:'Incidente na pista', text:'Detritos na pista provocam neutralização.'});
      logLongRaceEvent(cautionLogEntry(ev.caution));
      enterSafetyCar(ev.caution, ev.lap);
    }
    return false;
  }
  if(ev.type==='sc_end'){
    // safety car de verdade agrupa o pelotão atrás do carro de segurança; VSC só reduz o ritmo
    // geral e mantém as distâncias — ninguém pode fechar ou abrir gap livremente, mas não cola
    if(ev.caution==='sc') bunchField(lr);
    lr.safetyCar = null;
    lr.pendingDecision = {type:ev.caution};
    return true;
  }
  return false;
}

// o safety car/VSC fica na pista por pelo menos 1 volta antes de oferecer a janela de pit stop —
// insere um evento sintético que fecha essa volta, e enquanto isso mostra o aviso na tela
function enterSafetyCar(caution, atLap){
  var lr = state.longRace;
  lr.safetyCar = {type:caution};
  var banner = document.getElementById('gpm-lr-sc-banner');
  if(banner){
    banner.style.display = 'block';
    banner.textContent = caution==='sc' ? '🚨 SAFETY CAR NA PISTA — o pelotão está se agrupando' : '🟡 VIRTUAL SAFETY CAR NA PISTA — ritmo reduzido, sem ultrapassagens';
  }
  var endLap = Math.min(lr.totalLaps, atLap+1);
  lr.events.push({lap:endLap, type:'sc_end', caution:caution});
  lr.events.sort(function(a,b){ return a.lap-b.lap; });
}

// o safety car neutraliza a corrida: todo mundo se agrupa numa fila com distância mínima,
// mantendo a ordem mas zerando os gaps que tinham se formado até ali
function bunchField(lr){
  var cars = lr.rivalField.concat(lr.mineField).filter(function(d){ return !(d.dnf && d._progress>=d._dnfLap-1e-9); });
  cars.sort(function(a,b){ return b._progress - a._progress; });
  var leadProgress = cars.length ? cars[0]._progress : 0;
  var gap = 0.02; // fração mínima de volta entre um carro e o próximo, todos colados atrás do safety car
  cars.forEach(function(d,i){
    d._progress = leadProgress - i*gap;
    d._liveProgress = d._progress;
  });
}

function processLongRaceEvents(){
  var lr = state.longRace;
  while(lr.eventIndex < lr.events.length && lr.events[lr.eventIndex].lap<=lr.lap){
    var ev = lr.events[lr.eventIndex];
    lr.eventIndex++;
    if(applyLongRaceEvent(ev)){ render(); return; }
  }
  if(lr.lap>=lr.totalLaps){ finalizeLongRace(); }
  else { runLongRaceSegment(); }
}

function lrCarPosition(trackData, distance, lane){
  var pt = trackPointAt(trackData, distance);
  var pt2 = trackPointAt(trackData, distance+1.2);
  var dx = pt2.x-pt.x, dy = pt2.y-pt.y;
  var mag = Math.sqrt(dx*dx+dy*dy) || 1;
  var nx = -dy/mag, ny = dx/mag;
  return { x: pt.x+nx*lane, y: pt.y+ny*lane };
}

// os boxes ficam na reta principal (o trecho onde a volta começa, distância 0), afastados da pista
function pitBoxPosition(track){
  var pt = trackPointAt(track.trackData, 0);
  var pt2 = trackPointAt(track.trackData, 4);
  var dx = pt2.x-pt.x, dy = pt2.y-pt.y;
  var mag = Math.sqrt(dx*dx+dy*dy) || 1;
  var nx = -dy/mag, ny = dx/mag;
  return { x: pt.x+nx*20, y: pt.y+ny*20 };
}

function pitLaneMarkup(track){
  var pit = pitBoxPosition(track);
  return '<rect x="'+(pit.x-14).toFixed(1)+'" y="'+(pit.y-6).toFixed(1)+'" width="28" height="12" rx="2" fill="#2b303c" stroke="#ffd23f" stroke-width="1" opacity="0.9"/>'+
    '<text x="'+pit.x.toFixed(1)+'" y="'+(pit.y+3.2).toFixed(1)+'" font-size="6" fill="#ffd23f" text-anchor="middle" font-family="Rajdhani,sans-serif" font-weight="700">PIT</text>';
}

// anima suavemente (requestAnimationFrame) do fim da última volta processada até a volta do próximo evento
function runLongRaceSegment(){
  var lr = state.longRace;
  if(!lr || state.screen!=='longrace') return;
  if(lr.lap>=lr.totalLaps){ finalizeLongRace(); return; }

  var nextEv = lr.events[lr.eventIndex];
  var targetLap = nextEv ? Math.min(nextEv.lap, lr.totalLaps) : lr.totalLaps;
  if(targetLap<=lr.lap) targetLap = Math.min(lr.lap+1, lr.totalLaps);

  var track = getActiveTrack();
  var fromLap = lr.lap;
  var lapsToRun = targetLap - fromLap;

  var myQuality = tireStintQuality(lr.compound, lr.wetnessNow, lr.tireLaps);
  var myPaceFactor = tirePaceFactor(lr.compound, lr.wetnessNow, lr.tireLaps);
  // sob safety car/VSC todo mundo reduz o ritmo igual — mantém as distâncias relativas (VSC) ou
  // deixa o pelotão se aproximar naturalmente antes do agrupamento no fim da volta (SC)
  var cautionMult = lr.safetyCar ? 0.55 : 1;
  lr.mineField.forEach(function(d){ d._segPace = myPaceFactor * (d._driverMult||1) * cautionMult; });
  lr.rivalField.forEach(function(d){ d._segPace = rivalTirePace(d, lr.wetnessNow) * cautionMult; });

  var basePaceLapsPerMs = 1/(LR_LAP_SECONDS*1000);
  var segDuration = lapsToRun/basePaceLapsPerMs; // ms "de universo" (não de relógio real)
  var elapsed = 0, lastTs = null;
  var cars = lr.rivalField.concat(lr.mineField);

  function frame(ts){
    if(lastTs===null) lastTs = ts;
    var dtReal = ts-lastTs;
    lastTs = ts;
    var speed = state.raceSpeed||1;
    elapsed = Math.min(elapsed + dtReal*speed, segDuration);
    var fracLaps = elapsed*basePaceLapsPerMs;

    cars.forEach(function(d){
      // usa o progresso já confirmado (não a volta do segmento) pra detectar o abandono na hora certa, mesmo em segmentos longos
      if(d.dnf && d._progress >= d._dnfLap-1e-9){ d._liveProgress = d._progress; return; }
      var live = d._progress + fracLaps*d._segPace;
      if(d.dnf && live >= d._dnfLap) live = d._dnfLap;
      d._liveProgress = live;
      var dist = live * track.trackData.total;
      var pos = lrCarPosition(track.trackData, dist, d._lane||0);
      if(!d.mine && d._pitLap){
        var curLapFloat = fromLap + fracLaps;
        var pitDelta = Math.abs(curLapFloat - d._pitLap);
        if(pitDelta < 0.35){
          var blend = 1 - (pitDelta/0.35);
          var pitPos = pitBoxPosition(track);
          pos = { x: pos.x+(pitPos.x-pos.x)*blend, y: pos.y+(pitPos.y-pos.y)*blend };
        }
      }
      var elc = document.getElementById(d._elId);
      if(elc) elc.setAttribute('transform', 'translate('+pos.x.toFixed(2)+','+pos.y.toFixed(2)+')');
    });

    updateTimingTower(lr);

    var lapBadge = document.getElementById('gpm-lr-lapbadge');
    if(lapBadge){
      var curLap = Math.min(targetLap, fromLap+Math.floor(fracLaps)+1);
      lapBadge.textContent = 'Volta '+curLap+'/'+lr.totalLaps;
    }

    if(elapsed<segDuration){
      lr.raceAnimFrame = requestAnimationFrame(frame);
    } else {
      cars.forEach(function(d){
        if(d.dnf && d._progress >= d._dnfLap-1e-9) return;
        var newProgress = d._progress + lapsToRun*d._segPace;
        if(d.dnf && newProgress > d._dnfLap) newProgress = d._dnfLap;
        d._progress = newProgress;
      });
      for(var l=fromLap+1; l<=targetLap; l++){
        lr.qualitySamples.push(tireStintQuality(lr.compound, lr.wetnessNow, lr.tireLaps));
        lr.tireLaps++;
        advanceRivalTiresOneLap(lr, l);
      }
      lr.lap = targetLap;
      refreshLongRaceStatus();
      refreshLongRaceTireBadges();
      processLongRaceEvents();
    }
  }
  lr.raceAnimFrame = requestAnimationFrame(frame);
}

function mountLongRaceFrame(){
  var lr = state.longRace;
  if(!lr || state.screen!=='longrace') return;
  var carsGroup = document.getElementById('gpm-lr-cars');
  if(!carsGroup) return;
  var track = getActiveTrack();
  var cars = lr.rivalField.concat(lr.mineField);
  cars.forEach(function(d,i){
    var id = 'gpm-lr-car-'+i;
    d._elId = id;
    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('id', id);
    var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r', d.mine ? 5.5 : 4.2);
    c.setAttribute('fill', d._color);
    c.setAttribute('stroke', d.mine ? '#fff' : 'rgba(0,0,0,.4)');
    c.setAttribute('stroke-width', d.mine ? 1.4 : 0.8);
    g.appendChild(c);
    carsGroup.appendChild(g);
    var dist = (d._progress||0) * track.trackData.total;
    var pos = lrCarPosition(track.trackData, dist, d._lane||0);
    g.setAttribute('transform', 'translate('+pos.x.toFixed(2)+','+pos.y.toFixed(2)+')');
  });

  mountLongRaceTiming();

  if(lr.pitApproach){
    runPitApproachFrame();
    return;
  }

  if(lr.pitTimer){
    var pit = pitBoxPosition(track);
    lr.mineField.forEach(function(d){
      var elx = document.getElementById(d._elId);
      if(elx) elx.setAttribute('transform', 'translate('+pit.x.toFixed(2)+','+pit.y.toFixed(2)+')');
    });
    runPitTimerFrame();
    return;
  }

  if(lr.pendingDecision || lr.finished) return;
  if(!lr.started){
    runLongRaceLights();
  } else {
    runLongRaceSegment();
  }
}

function mountLongRaceTiming(){
  var lr = state.longRace;
  var rows = document.getElementById('gpm-lr-timing-rows');
  if(!rows) return;
  rows.innerHTML = '';
  var all = lr.rivalField.concat(lr.mineField);
  all.forEach(function(d){
    var idx = d._stableIdx;
    var rowId = 'gpm-lr-tr-'+idx, gapId = 'gpm-lr-tg-'+idx, tireId = 'gpm-lr-tt-'+idx, posId = 'gpm-lr-tp-'+idx, pitId = 'gpm-lr-tpit-'+idx;
    d._rowElId = rowId; d._gapElId = gapId; d._tireElId = tireId; d._posElId = posId; d._pitBadgeElId = pitId;
    var tireHtml = d.mine ? tireBadgeHtml(lr.compound, lr.tireLaps) : tireBadgeHtml(d._tireCompound, d._tireLaps);
    var row = el(
      '<div class="timing-row'+(d.mine?' mine':'')+'" id="'+rowId+'">'+
        '<div class="timing-pos" id="'+posId+'">·</div>'+
        '<div class="timing-dot" style="background:'+d._color+';"></div>'+
        '<div class="timing-name">'+timingLabel(d)+'<span class="timing-pit-badge" id="'+pitId+'" style="display:none;">🔧</span></div>'+
        '<div class="timing-tire" id="'+tireId+'">'+tireHtml+'</div>'+
        '<div class="timing-gap" id="'+gapId+'">GRID</div>'+
      '</div>'
    );
    rows.appendChild(row);
  });
  updateTimingTower(lr);
}

// recalcula a ordem por progresso atual, reordena as linhas na tela (não só o texto do gap) e
// atualiza o gap — sem isso a posição ficava travada na ordem do último mount enquanto o gap
// exibido já refletia o progresso ao vivo, e as duas coisas se descolavam (bug reportado)
function updateTimingTower(lr){
  var rows = document.getElementById('gpm-lr-timing-rows');
  if(!rows) return;
  var all = lr.rivalField.concat(lr.mineField);
  var ordered = all.slice().sort(function(a,b){
    var pa = a._liveProgress!=null?a._liveProgress:(a._progress||0);
    var pb = b._liveProgress!=null?b._liveProgress:(b._progress||0);
    if(Math.abs(pa-pb)>1e-6) return pb-pa;
    return (b._paceFactor||1) - (a._paceFactor||1);
  });
  lr.timingOrder = ordered;
  var leaderLive = ordered.length ? (ordered[0]._liveProgress!=null ? ordered[0]._liveProgress : (ordered[0]._progress||0)) : 0;
  ordered.forEach(function(d,i){
    var rowEl = document.getElementById(d._rowElId);
    if(rowEl) rows.appendChild(rowEl);
    var posEl = document.getElementById(d._posElId);
    if(posEl) posEl.textContent = (i+1);
    var gapEl = document.getElementById(d._gapElId);
    if(!gapEl) return;
    var myLive = d._liveProgress!=null ? d._liveProgress : (d._progress||0);
    var pitBadgeEl = document.getElementById(d._pitBadgeElId);
    if(pitBadgeEl){
      var inPit = false, pitTitle = '';
      if(d.mine){
        inPit = !!(lr.pitApproach || lr.pitTimer);
        pitTitle = lr.pitTimer ? 'Trocando pneus' : 'Entrando nos boxes';
      } else if(d._pitLap!=null){
        inPit = Math.abs(myLive - d._pitLap) < 0.35;
        if(inPit) pitTitle = d._pitStopMs ? 'Nos boxes (~'+(d._pitStopMs/1000).toFixed(1)+'s)' : 'Nos boxes';
      }
      pitBadgeEl.style.display = inPit ? 'inline' : 'none';
      if(inPit) pitBadgeEl.title = pitTitle;
    }
    var isDnfFrozen = d.dnf && myLive >= d._dnfLap-1e-6;
    if(rowEl) rowEl.classList.toggle('dnf', !!isDnfFrozen);
    if(isDnfFrozen){ gapEl.textContent = 'ABANDONOU'; return; }
    if(i===0){ gapEl.textContent = 'LÍDER'; return; }
    if(!lr.started){ gapEl.textContent = 'GRID'; return; }
    var gapSecs = (leaderLive-myLive)*LR_LAP_SECONDS;
    gapEl.textContent = gapSecs<0.05 ? 'LÍDER' : '+'+gapSecs.toFixed(1)+'s';
  });
}

function runLongRaceLights(){
  var lr = state.longRace;
  var lights = [0,1,2,3,4].map(function(i){ return document.getElementById('gpm-lr-light-'+i); });
  var status = document.getElementById('gpm-lr-gridstatus');
  if(status) status.textContent = 'Formando o grid...';
  var i = 0;
  function step(){
    if(i<5){
      if(lights[i]) lights[i].classList.add('on');
      i++;
      state.raceTimers.push(setTimeout(step, 500));
    } else {
      if(status) status.textContent = 'LUZES ACESAS...';
      var holdMs = 500 + Math.random()*700;
      state.raceTimers.push(setTimeout(function(){
        lr.started = true;
        render();
      }, holdMs));
    }
  }
  step();
}

var PIT_PROBLEM_MESSAGES = [
  'a porca de uma das rodas cruzou na hora de fechar',
  'a chave de impacto engasgou num dos pneus',
  'o macaco demorou pra descer',
  'confusão na troca — um mecânico pegou o pneu errado primeiro',
  'sinal verde atrasado, a equipe segurou o carro por precaução extra',
  'o pneu novo não encaixou de primeira'
];

// sorteia a duração real da parada (a troca de pneu em si): sorte + competência da equipe influenciam
// a chance de algo dar errado — acima de 3s conta como "problema" e ganha uma mensagem explicando o motivo
function rollPitStop(teamSkill){
  var skill = teamSkill!=null ? teamSkill : 70;
  var problemChance = Math.max(0.06, 0.28 - skill*0.002);
  if(Math.random() < problemChance){
    return { ms: Math.round(rand(3100,7000)), problem:true, message: PIT_PROBLEM_MESSAGES[Math.floor(Math.random()*PIT_PROBLEM_MESSAGES.length)] };
  }
  return { ms: Math.round(rand(1800,2900)), problem:false, message:null };
}

function resolveDecision(pit, compoundId){
  var lr = state.longRace;
  lr.pendingDecision = null;
  if(pit){
    // o carro primeiro termina a volta seguindo a pista normalmente até chegar na entrada dos boxes
    // (não corta caminho) — só depois de "chegar" lá é que a troca de pneu começa de verdade
    lr.pitApproach = { compound:compoundId, elapsedMs:0, requiredMs:0, lastTs:null, ready:false };
    render();
  } else {
    lr.history.push({icon:'🚦', title:'Sem parada', text:'Você decidiu seguir na pista com os pneus '+tireName(lr.compound)+'.'});
    render();
  }
}

// anima os carros da equipe do jogador terminando a volta atual normalmente pela pista (sem
// atalho) até chegar na entrada dos boxes; só nos últimos metros ele sai da linha de corrida em
// direção à vaga do pit. Os rivais continuam correndo normalmente nesse meio tempo (custa tempo de verdade)
function runPitApproachFrame(){
  var lr = state.longRace;
  if(!lr || !lr.pitApproach) return;
  var track = getActiveTrack();
  var pa = lr.pitApproach;
  var basePaceLapsPerMs = 1/(LR_LAP_SECONDS*1000);

  if(!pa.ready){
    var myPaceFactor = tirePaceFactor(lr.compound, lr.wetnessNow, lr.tireLaps);
    var cautionMult0 = lr.safetyCar ? 0.55 : 1;
    var maxNeeded = 0;
    lr.mineField.forEach(function(d){
      d._approachSegPace = myPaceFactor * (d._driverMult||1) * cautionMult0;
      d._approachStart = d._progress||0;
      d._approachTarget = Math.ceil(d._approachStart - 1e-6);
      var distLaps = Math.max(0, d._approachTarget - d._approachStart);
      var neededMs = distLaps/(d._approachSegPace*basePaceLapsPerMs);
      if(neededMs>maxNeeded) maxNeeded = neededMs;
    });
    pa.requiredMs = Math.max(300, maxNeeded);
    pa.ready = true;
  }

  var pit = pitBoxPosition(track);
  function frame(ts){
    if(!lr.pitApproach) return;
    if(pa.lastTs==null) pa.lastTs = ts;
    var dtReal = ts - pa.lastTs;
    pa.lastTs = ts;
    var speed = state.raceSpeed||1;
    var dtUniverse = dtReal*speed;
    pa.elapsedMs = Math.min(pa.elapsedMs + dtUniverse, pa.requiredMs);

    lr.mineField.forEach(function(d){
      var liveProgress = Math.min(d._approachTarget, d._approachStart + pa.elapsedMs*basePaceLapsPerMs*d._approachSegPace);
      d._liveProgress = liveProgress;
      var remainLaps = d._approachTarget - liveProgress;
      var dist = remainLaps<1e-9 ? 0 : (liveProgress%1)*track.trackData.total;
      var pos = lrCarPosition(track.trackData, dist, d._lane||0);
      if(remainLaps < 0.06){
        var blend = 1 - Math.max(0,remainLaps)/0.06;
        pos = { x: pos.x+(pit.x-pos.x)*blend, y: pos.y+(pit.y-pos.y)*blend };
      }
      var elx = document.getElementById(d._elId);
      if(elx) elx.setAttribute('transform', 'translate('+pos.x.toFixed(2)+','+pos.y.toFixed(2)+')');
    });

    var lapsGained = dtUniverse*basePaceLapsPerMs;
    var cautionMult = lr.safetyCar ? 0.55 : 1;
    lr.rivalField.forEach(function(d){
      if(d.dnf && d._progress >= d._dnfLap-1e-9){ d._liveProgress = d._progress; return; }
      var next = d._progress + lapsGained*rivalTirePace(d, lr.wetnessNow)*cautionMult;
      if(d.dnf && next >= d._dnfLap) next = d._dnfLap;
      d._progress = next;
      d._liveProgress = next;
      var dist = next * track.trackData.total;
      var pos = lrCarPosition(track.trackData, dist, d._lane||0);
      var elc = document.getElementById(d._elId);
      if(elc) elc.setAttribute('transform', 'translate('+pos.x.toFixed(2)+','+pos.y.toFixed(2)+')');
    });
    updateTimingTower(lr);
    if(pa.elapsedMs < pa.requiredMs){
      lr.raceAnimFrame = requestAnimationFrame(frame);
    } else {
      lr.mineField.forEach(function(d){ d._progress = d._approachTarget; d._liveProgress = d._approachTarget; });
      lr.pitApproach = null;
      var chefeSkill = (state.chefe && state.chefe.estrategia!=null) ? state.chefe.estrategia : 70;
      var roll = rollPitStop(chefeSkill);
      lr.pitTimer = { compound:pa.compound, requiredMs:roll.ms, elapsedMs:0, startTs:null, problem:roll.problem, message:roll.message };
      render();
    }
  }
  lr.raceAnimFrame = requestAnimationFrame(frame);
}

// permite pedir uma parada nos boxes a qualquer momento, mesmo sem safety car/VSC/mudança de clima
function requestVoluntaryPit(){
  var lr = state.longRace;
  if(!lr || lr.pendingDecision || lr.pitTimer || lr.pitApproach || lr.finished || !lr.started || lr.lap>=lr.totalLaps) return;
  if(lr.raceAnimFrame){ cancelAnimationFrame(lr.raceAnimFrame); lr.raceAnimFrame=null; }
  var cars = lr.rivalField.concat(lr.mineField);
  cars.forEach(function(d){ if(d._liveProgress!=null){ d._progress = d._liveProgress; } });
  lr.pendingDecision = {type:'voluntary'};
  render();
}

// enquanto o cronômetro do pit stop roda, a corrida continua pros rivais — só os carros do jogador ficam
// parados nos boxes, então ao sair ele já perdeu tempo de verdade em relação ao pelotão
function runPitTimerFrame(){
  var lr = state.longRace;
  if(!lr || !lr.pitTimer) return;
  var track = getActiveTrack();
  var basePaceLapsPerMs = 1/(LR_LAP_SECONDS*1000);
  function frame(ts){
    if(!lr.pitTimer) return;
    if(lr.pitTimer.lastTs==null) lr.pitTimer.lastTs = ts;
    var dtReal = ts - lr.pitTimer.lastTs;
    lr.pitTimer.lastTs = ts;
    var speed = state.raceSpeed||1;
    var dtUniverse = dtReal*speed;
    lr.pitTimer.elapsedMs = Math.min(lr.pitTimer.elapsedMs + dtUniverse, lr.pitTimer.requiredMs);

    var lapsGained = dtUniverse*basePaceLapsPerMs;
    var cautionMult = lr.safetyCar ? 0.55 : 1;
    lr.rivalField.forEach(function(d){
      if(d.dnf && d._progress >= d._dnfLap-1e-9){ d._liveProgress = d._progress; return; }
      var next = d._progress + lapsGained*rivalTirePace(d, lr.wetnessNow)*cautionMult;
      if(d.dnf && next >= d._dnfLap) next = d._dnfLap;
      d._progress = next;
      d._liveProgress = next;
      var dist = next * track.trackData.total;
      var pos = lrCarPosition(track.trackData, dist, d._lane||0);
      var elc = document.getElementById(d._elId);
      if(elc) elc.setAttribute('transform', 'translate('+pos.x.toFixed(2)+','+pos.y.toFixed(2)+')');
    });

    updateTimingTower(lr);

    var elapsedEl = document.getElementById('gpm-lr-pit-elapsed');
    if(elapsedEl) elapsedEl.textContent = (lr.pitTimer.elapsedMs/1000).toFixed(1)+'s';
    var fillEl = document.getElementById('gpm-lr-pit-fill');
    if(fillEl) fillEl.style.width = Math.min(100, (lr.pitTimer.elapsedMs/lr.pitTimer.requiredMs)*100)+'%';
    if(lr.pitTimer.elapsedMs < lr.pitTimer.requiredMs){
      lr.raceAnimFrame = requestAnimationFrame(frame);
    } else {
      finishPitTimer();
    }
  }
  lr.raceAnimFrame = requestAnimationFrame(frame);
}

function finishPitTimer(){
  var lr = state.longRace;
  var pt = lr.pitTimer;
  lr.compound = pt.compound;
  lr.tireLaps = 0;
  lr.pitStops++;
  lr.qualitySamples.push(pt.problem ? 0.55 : 0.92);
  var secs = (pt.requiredMs/1000).toFixed(1);
  var text = 'Parada de '+secs+'s concluída. Você trocou para pneus '+tireName(pt.compound)+'.';
  text += pt.problem ? ' ⚠️ Problema na parada: '+pt.message+' — tempo extra perdido.' : ' Troca rápida e limpa.';
  lr.history.push({icon: pt.problem ? '⚠️' : '🔧', title:'Pit stop', text:text});
  lr.pitTimer = null;
  render();
}

// o resultado final tem que refletir o que a simulação ao vivo mostrou — por isso a posição de
// cada carro vem do progresso (_progress) realmente acumulado na corrida, não de um sorteio à parte
function finalizeLongRace(){
  var lr = state.longRace;
  if(lr.raceAnimFrame){ cancelAnimationFrame(lr.raceAnimFrame); lr.raceAnimFrame=null; }
  lr.pitTimer = null;
  lr.pitApproach = null;
  lr.safetyCar = null;

  var field = lr.mineField.concat(lr.rivalField);
  field.forEach(function(d){ d._finalProgress = d._progress||0; });
  field.sort(function(a,b){
    if(!!a.dnf !== !!b.dnf) return a.dnf ? 1 : -1;
    if(a.dnf && b.dnf) return (b._dnfLap||0) - (a._dnfLap||0);
    return b._finalProgress - a._finalProgress;
  });

  var pointsTable = [25,18,15,12,10,8,6,4,2,1];
  var leaderProgress = field[0]._finalProgress;
  field.forEach(function(d,i){
    d.pos = i+1;
    d.pts = d.dnf ? 0 : (pointsTable[i]||0);
    d.gap = d.dnf ? 'ABANDONOU' : (d.pos===1 ? 'LÍDER' : '+'+((leaderProgress-d._finalProgress)*LR_LAP_SECONDS).toFixed(3)+'s');
  });

  state.results = field;
  state.highlights = lr.history.slice();
  lr.finished = true;

  if(state.season){
    applyStandings(field);
    state.season.history.push({track:getActiveTrack(), results:field.slice(), highlights:lr.history.slice()});
  }
  state.screen = 'results';
  render();
}

function skipLongRace(){
  var lr = state.longRace;
  if(lr.raceAnimFrame){ cancelAnimationFrame(lr.raceAnimFrame); lr.raceAnimFrame=null; }
  lr.pendingDecision = null;
  lr.pitTimer = null;
  lr.pitApproach = null;
  for(var l=lr.lap+1; l<=lr.totalLaps; l++){
    while(lr.eventIndex<lr.events.length && lr.events[lr.eventIndex].lap<=l){
      var ev = lr.events[lr.eventIndex]; lr.eventIndex++;
      if(ev.type==='wetness'){ lr.wetnessNow = ev.wetPct; lr.weatherCondNow = ev.cond; }
    }
    var myQuality = tireStintQuality(lr.compound, lr.wetnessNow, lr.tireLaps);
    var myPaceFactor = tirePaceFactor(lr.compound, lr.wetnessNow, lr.tireLaps);
    lr.mineField.forEach(function(d){ d._progress += myPaceFactor * (d._driverMult||1); });
    lr.rivalField.forEach(function(d){
      if(d.dnf && d._progress >= d._dnfLap-1e-9) return;
      var next = d._progress + rivalTirePace(d, lr.wetnessNow);
      if(d.dnf && next > d._dnfLap) next = d._dnfLap;
      d._progress = next;
    });
    lr.qualitySamples.push(myQuality);
    lr.tireLaps++;
    advanceRivalTiresOneLap(lr, l);
  }
  lr.lap = lr.totalLaps;
  finalizeLongRace();
}
