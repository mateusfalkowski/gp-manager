function tireName(id){ var t = tireById(id); return t ? t.nome : id; }

// modelo de desgaste inspirado na F1 real: o pneu perde ritmo aos poucos ao longo do stint
// (degradação normal) e, se não for trocado a tempo, sofre uma queda de desempenho ("cliff")
// bem mais acentuada — é o que torna o momento de parar realmente estratégico
function tireCondition(compoundId, wetPct, tireLaps){
  var t = tireById(compoundId);
  var fit = tireWetnessFit(compoundId, wetPct); // encaixe do composto com a pista no momento (0.12..1)
  var rawWear = (tireLaps*t.wear)/8; // 1.0 = 100% da vida útil nominal do composto
  var wear;
  if(rawWear<=1){
    // degradação bem mais agressiva desde cedo no stint — na F1 real, um pneu já rodado (mesmo
    // longe dos 100%) perde ritmo rápido o bastante pra um pneu novo de composto mais duro já
    // alcançar bem antes do fim da vida útil (é a lógica por trás do "undercut" nas paradas)
    wear = 1 - rawWear*0.42;
  } else {
    wear = Math.max(0.10, 0.58 - (rawWear-1)*0.9); // pneu "estourado" além da vida útil: despenca rápido
  }
  return fit*wear; // 0..1 — combina o encaixe com a pista e o estado físico do pneu
}

// ritmo do carro dado o composto/desgaste atual — usado tanto pro jogador quanto pros rivais,
// multiplicado pelo fator de habilidade/skill de cada piloto (_paceFactor / _driverMult)
function tirePaceFactor(compoundId, wetPct, tireLaps){
  var cond = tireCondition(compoundId, wetPct, tireLaps);
  return compoundGrip(compoundId) * (0.5 + cond*0.65); // 0.5 (pneu morto) .. 1.15 (novo, ótimo encaixe)
}

function tireStintQuality(compoundId, wetPct, tireLaps){
  return tireCondition(compoundId, wetPct, tireLaps);
}

// ritmo efetivo de um rival considerando o pneu que ele está usando — sem isso, os rivais
// corriam sempre no mesmo ritmo mesmo com o pneu 100% gasto (ou além disso)
function rivalTirePace(d, wetPct){
  return d._paceFactor * tirePaceFactor(d._tireCompound, wetPct, d._tireLaps);
}

var LR_LAP_SECONDS = 15; // segundos "de universo" por volta em 1x — 2x/4x aceleram a reprodução, não o resultado

function cautionLogEntry(type){
  return {icon: type==='sc'?'🚨':'🟡', title: type==='sc'?'Safety Car':'Virtual Safety Car', text: type==='sc' ? 'Safety Car na pista — janela boa e barata pra fazer o pit stop.' : 'VSC acionado — parada mais barata que o normal.'};
}

// monta a lista de eventos da corrida inteira (clima, abandonos, incidentes) já na hora de largar,
// pra dar pra tocar a animação contínua entre um evento e outro, só pausando quando importa.
// o número de vezes que a corrida realmente para pra pedir uma decisão é limitado de propósito
// (média de ~3 por corrida, variando entre 2 e 4) — o resto das mudanças acontece em silêncio,
// senão a corrida longa vira uma sequência cansativa de interrupções
function precomputeLongRaceEvents(lr){
  var weatherEvents = [];
  var prevZone = null;
  for(var lap=1; lap<=lr.totalLaps; lap++){
    if((lap-1)%2===0){
      var seg = Math.min(lr.weather.segCount-1, Math.floor((lap-1)/2));
      var wet = lr.weather.actualWet[seg];
      var cond = lr.weather.actualCond[seg];
      var zone = wetnessZone(wet);
      weatherEvents.push({lap:lap, type:'wetness', wetPct:wet, cond:cond, pause: prevZone!==null && zone!==prevZone});
      prevZone = zone;
    }
  }

  var cautionEvents = [];
  lr.rivalField.forEach(function(d){
    if(d.dnf){
      var roll = Math.random();
      // a maioria dos abandonos não exige neutralização — só quando o carro fica parado num lugar perigoso
      var caution = roll<0.15 ? 'sc' : (roll<0.32 ? 'vsc' : null);
      cautionEvents.push({lap:d._dnfLap, type:'dnf', driver:d, caution:caution});
    }
  });
  for(var l=1;l<=lr.totalLaps;l++){
    // raro: a maioria das corridas passa sem nenhum incidente aleatório, mas pode acontecer mais de um em casos isolados
    if(Math.random()<0.012){
      var r2 = Math.random();
      cautionEvents.push({lap:l, type:'incident', caution: r2<0.4?'sc':'vsc'});
    }
  }

  // junta tudo que PODERIA parar a corrida (mudança de zona de clima + cautions) e só deixa
  // as primeiras "targetDecisions" (em ordem de volta) realmente pausarem — o resto se aplica
  // sem interromper (clima muda silenciosamente, abandono/incidente não gera safety car)
  var targetDecisions = Math.max(1, Math.round(rand(2,4)));
  var candidates = weatherEvents.filter(function(e){ return e.pause; })
    .concat(cautionEvents.filter(function(e){ return e.caution; }))
    .sort(function(a,b){ return a.lap-b.lap; });
  var allowed = new Set(candidates.slice(0, targetDecisions));
  weatherEvents.forEach(function(e){ if(e.pause && !allowed.has(e)) e.pause = false; });
  cautionEvents.forEach(function(e){ if(e.caution && !allowed.has(e)) e.caution = null; });

  var events = weatherEvents.concat(cautionEvents);
  events.sort(function(a,b){ return a.lap-b.lap; });
  lr.events = events;
  lr.eventIndex = 0;
}

function initLongRace(compoundId){
  var lr = state.longRace;

  var myPersonIds = state.pilotos.map(function(p){ return p.personId; });
  var rivalsRoster = state.season ? state.season.rivals : buildRivalPool(10, myPersonIds);
  lr.rivalsRoster = rivalsRoster;

  var fullField = buildFieldBase(rivalsRoster);
  var wetSum = 0;
  for(var i=0;i<lr.weather.segCount;i++){ wetSum += lr.weather.actualWet[i]; }
  var avgWet = (wetSum/lr.weather.segCount)/100;
  var varBoost = 1 + avgWet*0.5;
  lr.rivalField = resolveRivalsOnly(fullField.filter(function(d){ return !d.mine; }), lr.totalLaps, varBoost);
  lr.mineField = fullField.filter(function(d){ return d.mine; });

  // pontua os pilotos do jogador com a MESMA fórmula usada pros rivais (computeScore, que já
  // pesa velocidade/consistência/agressividade do piloto + potência/confiabilidade do motor +
  // scoreMult do chefe) — sem isso, a qualidade do que você contratou no draft não influenciava
  // quase nada o ritmo na corrida longa, só o pneu, o que deixava a IA parecer imbatível mesmo
  // com uma equipe muito melhor contratada
  lr.mineField.forEach(function(d){ d.score = computeScore(d); });
  var finisherScores = lr.rivalField.filter(function(d){ return !d.dnf; }).map(function(d){ return d.score; });
  var allScores = finisherScores.concat(lr.mineField.map(function(d){ return d.score; }));
  var minS = allScores.length ? Math.min.apply(null, allScores) : 0;
  var maxS = allScores.length ? Math.max.apply(null, allScores) : 1;
  var palette = ['#5aa9e6','#c792ea','#67d8b0','#f2a65a','#ef7a85','#8a94a6','#d4b483','#7fb3ff','#e8a0bf','#8fd694'];
  var laneOffsets = [-8,-5,-2,2,5,8];
  // companheiros de equipe reais (mesmo pairKey) compartilham a cor da bolinha, pra ficar visível
  // na pista/tempo ao vivo que os dois correm pela mesma equipe
  var pairColors = {}, pairColorIdx = 0;
  lr.rivalField.forEach(function(d,i){
    var norm = (d.score-minS)/((maxS-minS)||1);
    d._paceFactor = 0.85 + Math.max(0,Math.min(1,norm))*0.30;
    d._lane = laneOffsets[i%laneOffsets.length];
    var key = d.pairKey || ('solo_'+i);
    if(!pairColors[key]){ pairColors[key] = palette[pairColorIdx%palette.length]; pairColorIdx++; }
    d._color = pairColors[key];
    d._progress = 0;
    d._tireCompound = pickCompoundForConditions(lr.wetnessNow);
    d._tireLaps = 0;
    // a parada tem que fazer sentido com o pneu escolhido — perto do fim da vida útil do
    // composto (com uma variação de estratégia), não um número solto sem relação com o pneu
    var tireLife = tireLifeLaps(tireById(d._tireCompound));
    var idealPitLap = Math.round(tireLife * rand(0.8, 1.15));
    var pitChance = idealPitLap < lr.totalLaps-1 ? 0.85 : 0.25; // pneu que aguenta a prova toda: raramente para
    d._pitLap = Math.random()<pitChance ? Math.min(lr.totalLaps-1, Math.max(2, idealPitLap)) : null;
    if(d._pitLap){
      var rivalTeamSkill = rand(45,92); // competência genérica da equipe rival nos boxes
      var pitRoll = rollPitStop(rivalTeamSkill);
      d._pitStopMs = pitRoll.ms;
      d._pitStopProblem = pitRoll.problem;
    }
  });
  var startPace = tirePaceFactor(compoundId, lr.wetnessNow, 0);
  lr.mineField.forEach(function(d,i){
    d._mineIdx = i;
    d._lane = [-3,3][i%2];
    d._color = i===0 ? '#ff7a29' : '#ffb15c';
    d._progress = 0;
    // mesma escala 0.85x..1.15x dos rivais, comparando o score do piloto contra o campo inteiro
    // (rivais + os 2 seus) — uma equipe bem contratada agora realmente compensa
    var norm = (d.score-minS)/((maxS-minS)||1);
    d._driverMult = 0.85 + Math.max(0,Math.min(1,norm))*0.30;
    d._paceFactor = startPace * d._driverMult;
    // cada piloto tem seu próprio pneu e sua própria janela de pit — um não precisa esperar o
    // outro chegar nos boxes pra trocar (independente de verdade, não só visual)
    d._tireCompound = compoundId;
    d._tireLaps = 0;
    d._tireWarnStage = 0;
    d._pitStops = 0;
    d._pitPhase = null;
    // mesmo risco de abandono mecânico que os rivais têm, baseado na confiabilidade do motor —
    // sem isso, uma equipe bem contratada nunca corria risco nenhum e ganhava quase sempre
    d.dnf = Math.random() < (100-d.confiab)*0.004;
    if(d.dnf) d._dnfLap = Math.max(1, Math.round(rand(1, Math.max(1,lr.totalLaps-2))));
  });

  // id estável por carro (não muda quando a ordem da tabela de tempos muda), usado pra mover
  // as linhas da tabela em vez de recriá-las toda hora
  lr.rivalField.concat(lr.mineField).forEach(function(d,i){ d._stableIdx = i; });

  precomputeLongRaceEvents(lr);

  lr.history.push({icon:WEATHER_COND_ICON[lr.weatherCondNow], title:'Largada', text:'Pista '+trackConditionLabel(lr.wetnessNow)+' ('+WEATHER_COND_LABEL[lr.weatherCondNow].toLowerCase()+', '+Math.round(lr.wetnessNow)+'% de umidade). Você larga com pneus '+tireName(compoundId)+'.'});

  state.screen = 'longrace';
  render();
}

function logLongRaceEvent(entry, silent){
  var lr = state.longRace;
  lr.history.push(entry);
  if(silent) appendHistoryCard(entry);
}

function appendHistoryCard(entry){
  var board = document.getElementById('gpm-lr-feed');
  if(!board) return;
  var card = el('<div class="hl-card" style="opacity:1;transform:none;animation:none;"><div class="hl-icon">'+entry.icon+'</div><div class="hl-body"><div class="hl-title">'+entry.title+'</div><div class="hl-text">'+entry.text+'</div></div></div>');
  board.insertBefore(card, board.firstChild);
}

// desgasta o pneu de cada rival em 1 volta; quando cruza a volta do pit stop dele, troca o composto
// E aplica o custo real de tempo da parada (mesmo sorteio de sorte+competência usado pro jogador)
function advanceRivalTiresOneLap(lr, lap){
  lr.rivalField.forEach(function(d){
    if(d.dnf && lap>=d._dnfLap) return;
    if(d._pitLap===lap){
      d._tireCompound = pickCompoundForConditions(wetnessAtSegment(lr, lap));
      d._tireLaps = 0;
      if(d._pitStopMs){
        d._progress -= (d._pitStopMs/1000)/LR_LAP_SECONDS;
        if(d._liveProgress!=null) d._liveProgress = d._progress;
      }
    } else {
      d._tireLaps++;
    }
  });
}

function refreshLongRaceStatus(){
  var lr = state.longRace;
  var w = document.getElementById('gpm-lr-weather'); if(w) w.textContent = weatherStatusLabel(lr.weatherCondNow, lr.wetnessNow);
  lr.mineField.forEach(function(d,i){
    var t = document.getElementById('gpm-lr-tire-'+i); if(t) t.textContent = tireName(d._tireCompound);
    var tl = document.getElementById('gpm-lr-tirelaps-'+i); if(tl) tl.textContent = Math.floor(d._tireLaps);
    var ps = document.getElementById('gpm-lr-pitstops-'+i); if(ps) ps.textContent = d._pitStops||0;
  });
  // o popup de previsão fica aberto entre voltas — se não atualizar aqui, ele trava mostrando
  // o clima da volta em que foi aberto mesmo enquanto o resto da tela já avançou
  var wp = document.getElementById('gpm-lr-weather-popup');
  if(wp) wp.innerHTML = weatherTimelineHtml(lr);
  var histCount = document.getElementById('gpm-lr-hist-count');
  if(histCount) histCount.textContent = lr.history.length;
  refreshPitButtonVisibility();
}

// mantém o botão de pit voluntário em sincronia sem precisar de um render() completo — como cada
// piloto pode terminar o pit em momentos diferentes, o botão pode voltar a ficar disponível no
// meio de uma volta, não só nos pontos em que a tela inteira é reconstruída
function refreshPitButtonVisibility(){
  var lr = state.longRace;
  if(!lr) return;
  var btn = document.getElementById('gpm-lr-pitbtn-top');
  if(!btn) return;
  var canPit = lr.started && !lr.finished && !lr.pendingDecision && !lr.mineField.some(function(d){ return d._pitPhase; });
  btn.style.display = canPit ? 'inline-flex' : 'none';
}

// aplica um evento já vencido; devolve true se ele pausa a corrida (decisão do jogador)
function applyLongRaceEvent(ev){
  var lr = state.longRace;
  if(ev.type==='wetness'){
    lr.wetnessNow = ev.wetPct;
    lr.weatherCondNow = ev.cond;
    if(ev.pause){
      logLongRaceEvent({icon:WEATHER_COND_ICON[ev.cond], title:'Mudança de clima', text:'Agora está '+WEATHER_COND_LABEL[ev.cond].toLowerCase()+' — pista com '+Math.round(ev.wetPct)+'% de umidade.'});
      lr.pendingDecision = {type:'weather'};
      return true;
    }
    refreshLongRaceStatus();
    return false;
  }
  if(ev.type==='dnf'){
    logLongRaceEvent({icon:'💥', title:'Abandono', text:shortName(ev.driver.driverName)+' ('+ev.driver.team+') parou na pista.'}, true);
    if(ev.caution){
      logLongRaceEvent(cautionLogEntry(ev.caution));
      enterSafetyCar(ev.caution, ev.lap);
    }
    return false;
  }
  if(ev.type==='incident'){
    if(ev.caution){
      logLongRaceEvent({icon:'⚠️', title:'Incidente na pista', text:'Detritos na pista provocam neutralização.'});
      logLongRaceEvent(cautionLogEntry(ev.caution));
      enterSafetyCar(ev.caution, ev.lap);
    }
    return false;
  }
  if(ev.type==='sc_end'){
    // safety car de verdade agrupa o pelotão atrás do carro de segurança; VSC só reduz o ritmo
    // geral e mantém as distâncias — ninguém pode fechar ou abrir gap livremente, mas não cola
    if(ev.caution==='sc') bunchField(lr);
    lr.safetyCar = null;
    lr.pendingDecision = {type:ev.caution};
    return true;
  }
  return false;
}

// o safety car/VSC fica na pista por pelo menos 1 volta antes de oferecer a janela de pit stop —
// insere um evento sintético que fecha essa volta, e enquanto isso mostra o aviso na tela
function enterSafetyCar(caution, atLap){
  var lr = state.longRace;
  lr.safetyCar = {type:caution};
  var banner = document.getElementById('gpm-lr-sc-banner');
  if(banner){
    banner.style.display = 'block';
    banner.textContent = caution==='sc' ? '🚨 SAFETY CAR NA PISTA — o pelotão está se agrupando' : '🟡 VIRTUAL SAFETY CAR NA PISTA — ritmo reduzido, sem ultrapassagens';
  }
  var endLap = Math.min(lr.totalLaps, atLap+1);
  lr.events.push({lap:endLap, type:'sc_end', caution:caution});
  lr.events.sort(function(a,b){ return a.lap-b.lap; });
}

// o safety car neutraliza a corrida: todo mundo se agrupa numa fila com distância mínima,
// mantendo a ordem mas zerando os gaps que tinham se formado até ali
function bunchField(lr){
  var cars = lr.rivalField.concat(lr.mineField).filter(function(d){ return !(d.dnf && d._progress>=d._dnfLap-1e-9); });
  cars.sort(function(a,b){ return b._progress - a._progress; });
  var leadProgress = cars.length ? cars[0]._progress : 0;
  var gap = 0.02; // fração mínima de volta entre um carro e o próximo, todos colados atrás do safety car
  cars.forEach(function(d,i){
    d._progress = leadProgress - i*gap;
    d._liveProgress = d._progress;
  });
}

function processLongRaceEvents(){
  var lr = state.longRace;
  while(lr.eventIndex < lr.events.length && lr.events[lr.eventIndex].lap<=lr.lap){
    var ev = lr.events[lr.eventIndex];
    lr.eventIndex++;
    if(applyLongRaceEvent(ev)){ render(); return; }
  }
  if(lr.lap>=lr.totalLaps){ finalizeLongRace(); }
  else { runLongRaceSegment(); }
}

function lrCarPosition(trackData, distance, lane){
  var pt = trackPointAt(trackData, distance);
  var pt2 = trackPointAt(trackData, distance+1.2);
  var dx = pt2.x-pt.x, dy = pt2.y-pt.y;
  var mag = Math.sqrt(dx*dx+dy*dy) || 1;
  var nx = -dy/mag, ny = dx/mag;
  return { x: pt.x+nx*lane, y: pt.y+ny*lane };
}

// os boxes ficam na reta principal (o trecho onde a volta começa, distância 0), afastados da pista
function pitBoxPosition(track){
  var pt = trackPointAt(track.trackData, 0);
  var pt2 = trackPointAt(track.trackData, 4);
  var dx = pt2.x-pt.x, dy = pt2.y-pt.y;
  var mag = Math.sqrt(dx*dx+dy*dy) || 1;
  var nx = -dy/mag, ny = dx/mag;
  return { x: pt.x+nx*20, y: pt.y+ny*20 };
}

function pitLaneMarkup(track){
  var pit = pitBoxPosition(track);
  return '<rect x="'+(pit.x-14).toFixed(1)+'" y="'+(pit.y-6).toFixed(1)+'" width="28" height="12" rx="2" fill="#2b303c" stroke="#ffd23f" stroke-width="1" opacity="0.9"/>'+
    '<text x="'+pit.x.toFixed(1)+'" y="'+(pit.y+3.2).toFixed(1)+'" font-size="6" fill="#ffd23f" text-anchor="middle" font-family="Rajdhani,sans-serif" font-weight="700">PIT</text>';
}

// sorteia a duração da parada e entra na fase "aproximando dos boxes" (o carro termina a volta
// atual normalmente pela pista até chegar na entrada do pit) — cada piloto chama isso
// independentemente do outro, então um não fica esperando o outro chegar pra trocar de pneu
function startMinePitApproach(d, compoundId){
  var lr = state.longRace;
  var myPaceFactor = tirePaceFactor(d._tireCompound, lr.wetnessNow, d._tireLaps);
  var cautionMult = lr.safetyCar ? 0.55 : 1;
  var segPace = myPaceFactor * (d._driverMult||1) * cautionMult;
  var basePaceLapsPerMs = 1/(LR_LAP_SECONDS*1000);
  var start = d._progress||0;
  var target = Math.ceil(start - 1e-6);
  var distLaps = Math.max(0, target-start);
  d._pitPhase = 'approach';
  d._pitApproach = { compound:compoundId, start:start, target:target, segPace:segPace, elapsedMs:0, requiredMs:Math.max(300, distLaps/(segPace*basePaceLapsPerMs)) };
}

// avança um carro do jogador em dtUniverse ms: corrida normal, ou uma das duas fases do pit stop
// (aproximação até a entrada do box, depois parado trocando pneu) — sempre no próprio ritmo,
// nunca esperando o outro piloto da equipe
function advanceMineCar(d, dtUniverse, track, cautionMult){
  var lr = state.longRace;
  var basePaceLapsPerMs = 1/(LR_LAP_SECONDS*1000);
  var elx = document.getElementById(d._elId);

  if(d.dnf && d._progress >= d._dnfLap-1e-9){
    if(!d._dnfLogged){
      d._dnfLogged = true;
      logLongRaceEvent({icon:'💥', title:'Abandono', text:shortName(d.driverName)+': problema mecânico tirou o carro da corrida.'}, true);
      refreshPitButtonVisibility();
    }
    d._liveProgress = d._progress;
    return;
  }

  if(d._pitPhase==='approach'){
    var pa = d._pitApproach;
    pa.elapsedMs = Math.min(pa.elapsedMs + dtUniverse, pa.requiredMs);
    var liveProgress = Math.min(pa.target, pa.start + pa.elapsedMs*basePaceLapsPerMs*pa.segPace);
    d._progress = liveProgress; d._liveProgress = liveProgress;
    var remainLaps = pa.target - liveProgress;
    var dist = remainLaps<1e-9 ? 0 : (liveProgress%1)*track.trackData.total;
    var pos = lrCarPosition(track.trackData, dist, d._lane||0);
    if(remainLaps < 0.06){
      var blend = 1 - Math.max(0,remainLaps)/0.06;
      var pit = pitBoxPosition(track);
      pos = { x: pos.x+(pit.x-pos.x)*blend, y: pos.y+(pit.y-pos.y)*blend };
    }
    if(elx) elx.setAttribute('transform', 'translate('+pos.x.toFixed(2)+','+pos.y.toFixed(2)+')');
    if(pa.elapsedMs >= pa.requiredMs){
      d._progress = pa.target; d._liveProgress = pa.target;
      var chefeSkill = (state.chefe && state.chefe.estrategia!=null) ? state.chefe.estrategia : 70;
      var roll = rollPitStop(chefeSkill);
      d._pitPhase = 'timer';
      d._pitTimer = { compound:pa.compound, elapsedMs:0, requiredMs:roll.ms, problem:roll.problem, message:roll.message };
      d._pitApproach = null;

      // troca a fase mostrada no card sem precisar de um render() completo (que poderia derrubar
      // o loop de animação em andamento)
      var titleEl = document.getElementById('gpm-lr-pit-title-'+d._mineIdx);
      if(titleEl) titleEl.textContent = '🔧 '+shortName(d.driverName)+': troca de pneus em andamento';
      var approachEl = document.getElementById('gpm-lr-pit-approach-'+d._mineIdx);
      if(approachEl) approachEl.style.display = 'none';
      var timerWrapEl = document.getElementById('gpm-lr-pit-timerwrap-'+d._mineIdx);
      if(timerWrapEl) timerWrapEl.style.display = 'block';
      var trackWrapEl = document.getElementById('gpm-lr-pit-trackwrap-'+d._mineIdx);
      if(trackWrapEl) trackWrapEl.style.display = 'block';
      var reqEl = document.getElementById('gpm-lr-pit-req-'+d._mineIdx);
      if(reqEl) reqEl.textContent = 'de '+(d._pitTimer.requiredMs/1000).toFixed(1)+'s necessários';
      if(d._pitTimer.problem){
        var probEl = document.getElementById('gpm-lr-pit-problem-'+d._mineIdx);
        if(probEl){ probEl.style.display = 'block'; probEl.textContent = '⚠️ '+d._pitTimer.message+' — a equipe está perdendo tempo extra nesta parada.'; }
      }
    }
    return;
  }

  if(d._pitPhase==='timer'){
    var pt = d._pitTimer;
    pt.elapsedMs = Math.min(pt.elapsedMs + dtUniverse, pt.requiredMs);
    var pit2 = pitBoxPosition(track);
    if(elx) elx.setAttribute('transform', 'translate('+pit2.x.toFixed(2)+','+pit2.y.toFixed(2)+')');
    var elapsedEl = document.getElementById('gpm-lr-pit-elapsed-'+d._mineIdx);
    if(elapsedEl) elapsedEl.textContent = (pt.elapsedMs/1000).toFixed(1)+'s';
    var fillEl = document.getElementById('gpm-lr-pit-fill-'+d._mineIdx);
    if(fillEl) fillEl.style.width = Math.min(100, (pt.elapsedMs/pt.requiredMs)*100)+'%';
    if(pt.elapsedMs >= pt.requiredMs){
      d._tireCompound = pt.compound;
      d._tireLaps = 0;
      d._tireWarnStage = 0;
      d._pitStops = (d._pitStops||0)+1;
      var secs = (pt.requiredMs/1000).toFixed(1);
      var text = shortName(d.driverName)+': parada de '+secs+'s concluída. Trocou para pneus '+tireName(pt.compound)+'.';
      text += pt.problem ? ' ⚠️ Problema na parada: '+pt.message+' — tempo extra perdido.' : ' Troca rápida e limpa.';
      logLongRaceEvent({icon: pt.problem ? '⚠️' : '🔧', title:'Pit stop', text:text}, true);
      d._pitPhase = null;
      d._pitTimer = null;
      var panelEl = document.getElementById('gpm-lr-pitpanel-'+d._mineIdx);
      if(panelEl) panelEl.style.display = 'none';
      // esconde o card de posição/previsão que acompanha o pit quando NENHUM piloto está mais parando
      if(!lr.mineField.some(function(x){ return x._pitPhase; })){
        var pitFcEl = document.getElementById('gpm-lr-pitfc');
        if(pitFcEl) pitFcEl.style.display = 'none';
      }
      refreshLongRaceStatus();
      refreshPitButtonVisibility();
    }
    return;
  }

  var myPaceFactor = tirePaceFactor(d._tireCompound, lr.wetnessNow, d._tireLaps);
  d._segPace = myPaceFactor * (d._driverMult||1) * cautionMult;
  var lapsGained = dtUniverse*basePaceLapsPerMs;
  var next = d._progress + lapsGained*d._segPace;
  d._progress = next; d._liveProgress = next;
  d._tireLaps += lapsGained;
  checkTireWearWarning(d);
  var dist2 = next * track.trackData.total;
  var pos2 = lrCarPosition(track.trackData, dist2, d._lane||0);
  if(elx) elx.setAttribute('transform', 'translate('+pos2.x.toFixed(2)+','+pos2.y.toFixed(2)+')');
}

// avisa o jogador quando o pneu de um piloto começa a cair de rendimento, e de novo quando já
// está bem prejudicado — cada aviso dispara só uma vez por jogo de pneu (reseta ao trocar).
// além de ficar no histórico, entra numa fila de popup que o jogador precisa confirmar (OK),
// senão passava despercebido dentro do histórico recolhido
function checkTireWearWarning(d){
  var wearPct = tireWearPct(d._tireCompound, d._tireLaps);
  if((d._tireWarnStage||0) < 1 && wearPct >= 55){
    d._tireWarnStage = 1;
    var text1 = shortName(d.driverName)+': o pneu '+tireName(d._tireCompound)+' já está com '+wearPct+'% de desgaste e começando a perder ritmo.';
    logLongRaceEvent({icon:'📉', title:'Pneu perdendo desempenho', text:text1}, true);
    queueTireAlert(text1);
  }
  if((d._tireWarnStage||0) < 2 && wearPct >= 88){
    d._tireWarnStage = 2;
    var text2 = shortName(d.driverName)+': o pneu '+tireName(d._tireCompound)+' está com '+wearPct+'% de desgaste — o desempenho já caiu bastante, considere parar nos boxes.';
    logLongRaceEvent({icon:'🚨', title:'Pneu bem prejudicado', text:text2}, true);
    queueTireAlert(text2);
  }
}

function queueTireAlert(text){
  var lr = state.longRace;
  lr.tireAlertQueue.push(text);
  showNextTireAlert();
}

function showNextTireAlert(){
  var lr = state.longRace;
  var banner = document.getElementById('gpm-lr-tire-alert');
  if(!banner || lr.activeTireAlert || !lr.tireAlertQueue.length) return;
  lr.activeTireAlert = lr.tireAlertQueue.shift();
  var textEl = document.getElementById('gpm-lr-tire-alert-text');
  if(textEl) textEl.textContent = '⚠️ '+lr.activeTireAlert;
  banner.style.display = 'flex';
}

function dismissTireAlert(){
  var lr = state.longRace;
  var banner = document.getElementById('gpm-lr-tire-alert');
  if(banner) banner.style.display = 'none';
  lr.activeTireAlert = null;
  showNextTireAlert();
}

// anima suavemente (requestAnimationFrame) do fim da última volta processada até a volta do próximo evento.
// os carros do jogador avançam à parte (advanceMineCar), continuamente, mesmo durante um pit stop —
// a corrida (rivais, clima, eventos) nunca fica pausada esperando o pit terminar
function runLongRaceSegment(){
  var lr = state.longRace;
  if(!lr || state.screen!=='longrace') return;
  if(lr.lap>=lr.totalLaps){ finalizeLongRace(); return; }

  var nextEv = lr.events[lr.eventIndex];
  var targetLap = nextEv ? Math.min(nextEv.lap, lr.totalLaps) : lr.totalLaps;
  if(targetLap<=lr.lap) targetLap = Math.min(lr.lap+1, lr.totalLaps);

  var track = getActiveTrack();
  var fromLap = lr.lap;
  var lapsToRun = targetLap - fromLap;

  // sob safety car/VSC todo mundo reduz o ritmo igual — mantém as distâncias relativas (VSC) ou
  // deixa o pelotão se aproximar naturalmente antes do agrupamento no fim da volta (SC)
  var cautionMult = lr.safetyCar ? 0.55 : 1;
  lr.rivalField.forEach(function(d){ d._segPace = rivalTirePace(d, lr.wetnessNow) * cautionMult; });

  var basePaceLapsPerMs = 1/(LR_LAP_SECONDS*1000);
  var segDuration = lapsToRun/basePaceLapsPerMs; // ms "de universo" (não de relógio real)
  var elapsed = 0, lastTs = null;

  function frame(ts){
    if(lastTs===null) lastTs = ts;
    // se a aba ficou em segundo plano (ou travou um instante), o navegador pode pular vários
    // segundos entre um frame e outro — sem esse limite, os carros do jogador (que avançam sem
    // o teto do "elapsed" do segmento) disparavam muito à frente dos rivais nesse salto
    var dtReal = Math.min(ts-lastTs, 250);
    lastTs = ts;
    var speed = state.raceSpeed||1;
    var dtUniverse = dtReal*speed;
    elapsed = Math.min(elapsed + dtUniverse, segDuration);
    var fracLaps = elapsed*basePaceLapsPerMs;

    lr.rivalField.forEach(function(d){
      // usa o progresso já confirmado (não a volta do segmento) pra detectar o abandono na hora certa, mesmo em segmentos longos
      if(d.dnf && d._progress >= d._dnfLap-1e-9){ d._liveProgress = d._progress; return; }
      var live = d._progress + fracLaps*d._segPace;
      if(d.dnf && live >= d._dnfLap) live = d._dnfLap;
      d._liveProgress = live;
      var dist = live * track.trackData.total;
      var pos = lrCarPosition(track.trackData, dist, d._lane||0);
      if(d._pitLap){
        var curLapFloat = fromLap + fracLaps;
        var pitDelta = Math.abs(curLapFloat - d._pitLap);
        if(pitDelta < 0.35){
          var blend = 1 - (pitDelta/0.35);
          var pitPos = pitBoxPosition(track);
          pos = { x: pos.x+(pitPos.x-pos.x)*blend, y: pos.y+(pitPos.y-pos.y)*blend };
        }
      }
      var elc = document.getElementById(d._elId);
      if(elc) elc.setAttribute('transform', 'translate('+pos.x.toFixed(2)+','+pos.y.toFixed(2)+')');
    });

    lr.mineField.forEach(function(d){ advanceMineCar(d, dtUniverse, track, cautionMult); });

    updateTimingTower(lr);

    var curLap = Math.min(targetLap, fromLap+Math.floor(fracLaps)+1);
    lr.liveLap = curLap; // volta realmente exibida agora — pode estar à frente do lr.lap (que só
    // avança quando o segmento atual termina de verdade), usado pra manter a previsão do tempo e
    // uma parada voluntária no meio do segmento em sincronia com o que o jogador está vendo
    lr.liveLapFloat = Math.min(targetLap, fromLap+fracLaps+1);
    // o clima de verdade muda aos poucos ao longo da corrida, não pula de repente a cada 2 voltas
    var lw = liveWetnessNow(lr);
    lr.wetnessNow = lw.wetPct;
    lr.weatherCondNow = lw.cond;
    var lapBadge = document.getElementById('gpm-lr-lapbadge');
    if(lapBadge) lapBadge.textContent = 'Volta '+curLap+'/'+lr.totalLaps;
    refreshLongRaceStatus();

    if(elapsed<segDuration){
      lr.raceAnimFrame = requestAnimationFrame(frame);
    } else {
      lr.rivalField.forEach(function(d){
        if(d.dnf && d._progress >= d._dnfLap-1e-9) return;
        var newProgress = d._progress + lapsToRun*d._segPace;
        if(d.dnf && newProgress > d._dnfLap) newProgress = d._dnfLap;
        d._progress = newProgress;
      });
      for(var l=fromLap+1; l<=targetLap; l++){
        advanceRivalTiresOneLap(lr, l);
      }
      lr.lap = targetLap;
      refreshLongRaceStatus();
      processLongRaceEvents();
    }
  }
  lr.raceAnimFrame = requestAnimationFrame(frame);
}

function mountLongRaceFrame(){
  var lr = state.longRace;
  if(!lr || state.screen!=='longrace') return;
  var carsGroup = document.getElementById('gpm-lr-cars');
  if(!carsGroup) return;
  var track = getActiveTrack();
  var cars = lr.rivalField.concat(lr.mineField);
  cars.forEach(function(d,i){
    var id = 'gpm-lr-car-'+i;
    d._elId = id;
    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('id', id);
    var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r', d.mine ? 5.5 : 4.2);
    c.setAttribute('fill', d._color);
    c.setAttribute('stroke', d.mine ? '#fff' : 'rgba(0,0,0,.4)');
    c.setAttribute('stroke-width', d.mine ? 1.4 : 0.8);
    g.appendChild(c);
    carsGroup.appendChild(g);
    var dist = (d._progress||0) * track.trackData.total;
    var pos = lrCarPosition(track.trackData, dist, d._lane||0);
    g.setAttribute('transform', 'translate('+pos.x.toFixed(2)+','+pos.y.toFixed(2)+')');
  });

  mountLongRaceTiming();

  if(lr.pendingDecision || lr.finished) return;
  if(!lr.started){
    runLongRaceLights();
  } else {
    runLongRaceSegment();
  }
}

function mountLongRaceTiming(){
  var lr = state.longRace;
  var rows = document.getElementById('gpm-lr-timing-rows');
  if(!rows) return;
  rows.innerHTML = '';
  var all = lr.rivalField.concat(lr.mineField);
  all.forEach(function(d){
    var idx = d._stableIdx;
    var rowId = 'gpm-lr-tr-'+idx, gapId = 'gpm-lr-tg-'+idx, tireId = 'gpm-lr-tt-'+idx, posId = 'gpm-lr-tp-'+idx, pitId = 'gpm-lr-tpit-'+idx;
    d._rowElId = rowId; d._gapElId = gapId; d._tireElId = tireId; d._posElId = posId; d._pitBadgeElId = pitId;
    var tireHtml = tireBadgeHtml(d._tireCompound, Math.floor(d._tireLaps));
    var row = el(
      '<div class="timing-row'+(d.mine?' mine':'')+'" id="'+rowId+'">'+
        '<div class="timing-pos" id="'+posId+'">·</div>'+
        '<div class="timing-dot" style="background:'+d._color+';"></div>'+
        '<div class="timing-name">'+timingLabel(d)+'<span class="timing-pit-badge" id="'+pitId+'" style="display:none;">🔧</span></div>'+
        '<div class="timing-tire" id="'+tireId+'">'+tireHtml+'</div>'+
        '<div class="timing-gap" id="'+gapId+'">GRID</div>'+
      '</div>'
    );
    rows.appendChild(row);
  });
  updateTimingTower(lr);
}

// recalcula a ordem por progresso atual, reordena as linhas na tela (não só o texto do gap) e
// atualiza o gap — sem isso a posição ficava travada na ordem do último mount enquanto o gap
// exibido já refletia o progresso ao vivo, e as duas coisas se descolavam (bug reportado)
function updateTimingTower(lr){
  var rows = document.getElementById('gpm-lr-timing-rows');
  if(!rows) return;
  var all = lr.rivalField.concat(lr.mineField);
  var ordered = all.slice().sort(function(a,b){
    var pa = a._liveProgress!=null?a._liveProgress:(a._progress||0);
    var pb = b._liveProgress!=null?b._liveProgress:(b._progress||0);
    if(Math.abs(pa-pb)>1e-6) return pb-pa;
    return (b._paceFactor||1) - (a._paceFactor||1);
  });
  lr.timingOrder = ordered;
  var leaderLive = ordered.length ? (ordered[0]._liveProgress!=null ? ordered[0]._liveProgress : (ordered[0]._progress||0)) : 0;
  ordered.forEach(function(d,i){
    var rowEl = document.getElementById(d._rowElId);
    if(rowEl) rows.appendChild(rowEl);
    var posEl = document.getElementById(d._posElId);
    if(posEl) posEl.textContent = (i+1);
    var gapEl = document.getElementById(d._gapElId);
    if(!gapEl) return;
    var myLive = d._liveProgress!=null ? d._liveProgress : (d._progress||0);
    var pitBadgeEl = document.getElementById(d._pitBadgeElId);
    if(pitBadgeEl){
      var inPit = false, pitTitle = '';
      if(d.mine){
        inPit = !!d._pitPhase;
        pitTitle = d._pitPhase==='timer' ? 'Trocando pneus' : 'Entrando nos boxes';
      } else if(d._pitLap!=null){
        inPit = Math.abs(myLive - d._pitLap) < 0.35;
        if(inPit) pitTitle = d._pitStopMs ? 'Nos boxes (~'+(d._pitStopMs/1000).toFixed(1)+'s)' : 'Nos boxes';
      }
      pitBadgeEl.style.display = inPit ? 'inline' : 'none';
      if(inPit) pitBadgeEl.title = pitTitle;
    }
    var tireEl = document.getElementById(d._tireElId);
    if(tireEl) tireEl.innerHTML = tireBadgeHtml(d._tireCompound, Math.floor(d._tireLaps));
    var isDnfFrozen = d.dnf && myLive >= d._dnfLap-1e-6;
    if(rowEl) rowEl.classList.toggle('dnf', !!isDnfFrozen);
    if(isDnfFrozen){ gapEl.textContent = 'ABANDONOU'; return; }
    if(i===0){ gapEl.textContent = 'LÍDER'; return; }
    if(!lr.started){ gapEl.textContent = 'GRID'; return; }
    var gapSecs = (leaderLive-myLive)*LR_LAP_SECONDS;
    gapEl.textContent = gapSecs<0.05 ? 'LÍDER' : '+'+gapSecs.toFixed(1)+'s';
  });
}

function runLongRaceLights(){
  var lr = state.longRace;
  var lights = [0,1,2,3,4].map(function(i){ return document.getElementById('gpm-lr-light-'+i); });
  var status = document.getElementById('gpm-lr-gridstatus');
  if(status) status.textContent = 'Formando o grid...';
  var i = 0;
  function step(){
    if(i<5){
      if(lights[i]) lights[i].classList.add('on');
      i++;
      state.raceTimers.push(setTimeout(step, 500));
    } else {
      if(status) status.textContent = 'LUZES ACESAS...';
      var holdMs = 500 + Math.random()*700;
      state.raceTimers.push(setTimeout(function(){
        lr.started = true;
        render();
      }, holdMs));
    }
  }
  step();
}

var PIT_PROBLEM_MESSAGES = [
  'a porca de uma das rodas cruzou na hora de fechar',
  'a chave de impacto engasgou num dos pneus',
  'o macaco demorou pra descer',
  'confusão na troca — um mecânico pegou o pneu errado primeiro',
  'sinal verde atrasado, a equipe segurou o carro por precaução extra',
  'o pneu novo não encaixou de primeira'
];

// sorteia a duração real da parada (a troca de pneu em si): sorte + competência da equipe influenciam
// a chance de algo dar errado — acima de 3s conta como "problema" e ganha uma mensagem explicando o motivo
function rollPitStop(teamSkill){
  var skill = teamSkill!=null ? teamSkill : 70;
  var problemChance = Math.max(0.06, 0.28 - skill*0.002);
  if(Math.random() < problemChance){
    return { ms: Math.round(rand(3100,7000)), problem:true, message: PIT_PROBLEM_MESSAGES[Math.floor(Math.random()*PIT_PROBLEM_MESSAGES.length)] };
  }
  return { ms: Math.round(rand(1800,2900)), problem:false, message:null };
}

// aplica a decisão de parar (ou não) — quando decide parar, cada carro do jogador entra na fase
// de aproximação de forma independente, e a corrida (rivais/clima/eventos) continua rolando
// normalmente por trás, sem pausar esperando o pit terminar
function resolveDecision(pit, compoundId){
  var lr = state.longRace;
  lr.pendingDecision = null;
  if(pit){
    // se um piloto já estiver no meio de outro pit (raro: uma decisão forçada caiu bem na hora
    // de um pit voluntário), não reinicia a aproximação dele — deixa terminar o que já começou
    lr.mineField.forEach(function(d){ if(!d._pitPhase && !d.dnf) startMinePitApproach(d, compoundId); });
    render();
  } else {
    lr.history.push({icon:'🚦', title:'Sem parada', text:'Você decidiu seguir na pista sem parar.'});
    render();
  }
}

// permite pedir uma parada nos boxes a qualquer momento, mesmo sem safety car/VSC/mudança de clima
function requestVoluntaryPit(){
  var lr = state.longRace;
  if(!lr || lr.pendingDecision || lr.finished || !lr.started || lr.lap>=lr.totalLaps) return;
  if(lr.mineField.some(function(d){ return d._pitPhase; })) return;
  if(lr.raceAnimFrame){ cancelAnimationFrame(lr.raceAnimFrame); lr.raceAnimFrame=null; }
  var cars = lr.rivalField.concat(lr.mineField);
  cars.forEach(function(d){ if(d._liveProgress!=null){ d._progress = d._liveProgress; } });
  // lr.lap só avança quando o segmento atual termina de verdade — como a corrida foi
  // interrompida no meio de um (até 2 voltas de antecedência), sem isso a volta "recuava" pro
  // início do segmento quando a corrida retomasse depois da decisão. Alcança a volta que já
  // estava sendo exibida, aplicando o desgaste/pit dos rivais das voltas puladas no caminho
  if(lr.liveLap!=null){
    var caughtUpLap = Math.min(lr.liveLap-1, lr.totalLaps);
    if(caughtUpLap > lr.lap){
      for(var l=lr.lap+1; l<=caughtUpLap; l++){ advanceRivalTiresOneLap(lr, l); }
      lr.lap = caughtUpLap;
    }
  }
  lr.pendingDecision = {type:'voluntary'};
  render();
}

// o resultado final tem que refletir o que a simulação ao vivo mostrou — por isso a posição de
// cada carro vem do progresso (_progress) realmente acumulado na corrida, não de um sorteio à parte
function finalizeLongRace(){
  var lr = state.longRace;
  if(lr.raceAnimFrame){ cancelAnimationFrame(lr.raceAnimFrame); lr.raceAnimFrame=null; }
  lr.safetyCar = null;

  var field = lr.mineField.concat(lr.rivalField);
  field.forEach(function(d){ d._finalProgress = d._progress||0; });
  field.sort(function(a,b){
    if(!!a.dnf !== !!b.dnf) return a.dnf ? 1 : -1;
    if(a.dnf && b.dnf) return (b._dnfLap||0) - (a._dnfLap||0);
    return b._finalProgress - a._finalProgress;
  });

  var pointsTable = [25,18,15,12,10,8,6,4,2,1];
  var leaderProgress = field[0]._finalProgress;
  field.forEach(function(d,i){
    d.pos = i+1;
    d.pts = d.dnf ? 0 : (pointsTable[i]||0);
    d.gap = d.dnf ? 'ABANDONOU' : (d.pos===1 ? 'LÍDER' : '+'+((leaderProgress-d._finalProgress)*LR_LAP_SECONDS).toFixed(3)+'s');
  });

  state.results = field;
  state.highlights = lr.history.slice();
  lr.finished = true;

  if(state.season){
    applyStandings(field);
    state.season.history.push({track:getActiveTrack(), results:field.slice(), highlights:lr.history.slice()});
  }
  state.screen = 'results';
  render();
}

function skipLongRace(){
  var lr = state.longRace;
  if(lr.raceAnimFrame){ cancelAnimationFrame(lr.raceAnimFrame); lr.raceAnimFrame=null; }
  lr.pendingDecision = null;
  lr.mineField.forEach(function(d){ d._pitPhase = null; d._pitApproach = null; d._pitTimer = null; });
  // pular a corrida não simula pit stops (eles dependem de decisão do jogador) — cada carro do
  // jogador só avança normal no pneu que já estava usando, sem custo de tempo
  for(var l=lr.lap+1; l<=lr.totalLaps; l++){
    while(lr.eventIndex<lr.events.length && lr.events[lr.eventIndex].lap<=l){
      var ev = lr.events[lr.eventIndex]; lr.eventIndex++;
      if(ev.type==='wetness'){ lr.wetnessNow = ev.wetPct; lr.weatherCondNow = ev.cond; }
    }
    lr.mineField.forEach(function(d){
      var myPaceFactor = tirePaceFactor(d._tireCompound, lr.wetnessNow, d._tireLaps);
      d._progress += myPaceFactor * (d._driverMult||1);
      d._tireLaps++;
    });
    lr.rivalField.forEach(function(d){
      if(d.dnf && d._progress >= d._dnfLap-1e-9) return;
      var next = d._progress + rivalTirePace(d, lr.wetnessNow);
      if(d.dnf && next > d._dnfLap) next = d._dnfLap;
      d._progress = next;
    });
    advanceRivalTiresOneLap(lr, l);
  }
  lr.lap = lr.totalLaps;
  finalizeLongRace();
}

function shortName(fullName){
  // pega apenas o sobrenome (ignora bandeira/emoji e apelidos entre aspas)
  var cleaned = fullName.replace(/\p{Extended_Pictographic}/gu,'').replace(/"[^"]*"/g,'').trim();
  var parts = cleaned.split(' ').filter(Boolean);
  return parts.length ? parts[parts.length-1] : fullName;
}

// sobrenome + a temporada específica que o piloto está representando (a mesma pessoa pode
// aparecer com atributos diferentes em anos diferentes) — ajuda a diferenciar no tempo ao vivo
function timingLabel(d){
  return shortName(d.driverName) + (d.year ? ' '+d.year : '');
}

function initRaceSequence(){
  var carsGroup = document.getElementById('gpm-cars');
  var timingRowsEl = document.getElementById('gpm-timing-rows');
  if(!carsGroup || !timingRowsEl) return;

  var field = state.results;
  var finishers = field.filter(function(d){ return !d.dnf; });
  var scores = finishers.map(function(d){ return d.score; });
  var minS = Math.min.apply(null, scores), maxS = Math.max.apply(null, scores);
  var laneOffsets = [-8,-5,-2,2,5,8];
  var palette = ['#5aa9e6','#c792ea','#67d8b0','#f2a65a','#ef7a85','#8a94a6','#d4b483','#7fb3ff','#e8a0bf','#8fd694'];
  var colorIdx = 0;
  var gridGap = 13; // distância entre carros no grid de largada
  // companheiros de equipe reais (mesmo pairKey) compartilham a cor da bolinha
  var pairColors = {};

  field.forEach(function(d,i){
    d._lane = laneOffsets[i % laneOffsets.length];
    if(d.mine){ d._color = '#ff7a29'; }
    else {
      var key = d.pairKey || ('solo_'+i);
      if(!pairColors[key]){ pairColors[key] = palette[colorIdx % palette.length]; colorIdx++; }
      d._color = pairColors[key];
    }

    // quanto melhor a posição no grid, mais rápido tende a ser (mas o resultado final já está decidido em state.results)
    // clampado 0-1: sem isso, o score bem negativo de quem abandona (-9999) gerava um _paceFactor
    // gigantesco e negativo, fazendo o carro "andar pra trás" pro resto da corrida em vez de travar no abandono
    var norm = Math.max(0, Math.min(1, (d.score-minS)/((maxS-minS)||1)));
    d._paceFactor = 0.85 + norm*0.30; // 0.85x .. 1.15x — varia bastante, sorte pura
    d._gridOffset = -(i*gridGap);
    if(d.dnf) d._dnfStopLap = rand(1, Math.max(1,TOTAL_LAPS-2));

    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('id','gpm-car-'+i);
    var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r', d.mine ? 5.5 : 4.2);
    c.setAttribute('fill', d._color);
    c.setAttribute('stroke', d.mine ? '#fff' : 'rgba(0,0,0,.4)');
    c.setAttribute('stroke-width', d.mine ? 1.4 : 0.8);
    g.appendChild(c);
    carsGroup.appendChild(g);
    d._elId = 'gpm-car-'+i;

    var row = el(
      '<div class="timing-row'+(d.mine?' mine':'')+'" id="gpm-tr-'+i+'">'+
        '<div class="timing-pos">'+(i+1)+'</div>'+
        '<div class="timing-dot" style="background:'+d._color+';"></div>'+
        '<div class="timing-name">'+timingLabel(d)+'</div>'+
        '<div class="timing-gap" id="gpm-tg-'+i+'">'+(i===0?'GRID':'—')+'</div>'+
      '</div>'
    );
    timingRowsEl.appendChild(row);
    d._gapElId = 'gpm-tg-'+i;
    d._rowElId = 'gpm-tr-'+i;
  });

  // posiciona os carros no grid (parados, formação real)
  field.forEach(function(d){
    placeCarAt(d, d._gridOffset);
  });

  var statusEl = document.getElementById('gpm-grid-status');
  if(statusEl) statusEl.textContent = 'Grid formado — luzes acendendo...';
  var toastEl = document.getElementById('gpm-race-toast');
  if(toastEl) toastEl.textContent = 'Aguardando a largada...';

  state.raceTimers.push(setTimeout(function(){ runLights(field); }, 900));
}

function placeCarAt(d, distance){
  var trackData = state.raceTrack.trackData;
  var pt = trackPointAt(trackData, distance);
  var pt2 = trackPointAt(trackData, distance+1.2);
  var dx = pt2.x-pt.x, dy = pt2.y-pt.y;
  var mag = Math.sqrt(dx*dx+dy*dy) || 1;
  var nx = -dy/mag, ny = dx/mag;
  var x = pt.x + nx*d._lane;
  var y = pt.y + ny*d._lane;
  var g = document.getElementById(d._elId);
  if(g) g.setAttribute('transform','translate('+x.toFixed(2)+','+y.toFixed(2)+')');
}

function runLights(field){
  var lights = [0,1,2,3,4].map(function(i){ return document.getElementById('gpm-light-'+i); });
  var i = 0;
  function step(){
    if(i<5){
      if(lights[i]) lights[i].classList.add('on');
      i++;
      state.raceTimers.push(setTimeout(step, 620));
    } else {
      var holdMs = 700 + Math.random()*900;
      state.raceTimers.push(setTimeout(function(){
        lights.forEach(function(l){ if(l) l.classList.remove('on'); });
        var statusEl = document.getElementById('gpm-grid-status');
        if(statusEl) statusEl.textContent = 'LUZES APAGADAS — LARGADA!';
        var toastEl = document.getElementById('gpm-race-toast');
        if(toastEl) toastEl.textContent = 'Largada dada — a corrida está rolando...';
        field.forEach(function(d){
          var rowEl = document.getElementById(d._rowElId);
          if(rowEl) rowEl.style.background = '';
        });
        startRaceAnim(field);
      }, holdMs));
    }
  }
  step();
}

function startRaceAnim(field){
  var leader = field[0]; // sempre o primeiro do grid, pois posição no grid e ritmo seguem a mesma ordem
  var basePaceLapsPerMs = 1/(LAP_SECONDS*1000);
  var leaderPaceLapsPerMs = basePaceLapsPerMs*leader._paceFactor;
  var raceDuration = TOTAL_LAPS/leaderPaceLapsPerMs; // ms "de universo" (não de relógio real)

  var elapsed = 0, lastTs = null;
  var finished = false;

  function frame(ts){
    if(lastTs===null) lastTs = ts;
    var dtReal = ts-lastTs;
    lastTs = ts;
    var speed = state.raceSpeed||1;
    elapsed = Math.min(elapsed + dtReal*speed, raceDuration);
    if(elapsed>=raceDuration) finished = true;

    var leaderLapsNow = (leaderPaceLapsPerMs*elapsed);

    field.forEach(function(d){
      var ownLapsCompleted = basePaceLapsPerMs*d._paceFactor*elapsed;
      var lapsCompleted = d.dnf ? Math.min(ownLapsCompleted, d._dnfStopLap) : ownLapsCompleted;
      var distance = d._gridOffset + lapsCompleted*state.raceTrack.trackData.total;
      placeCarAt(d, distance);

      var gapEl = document.getElementById(d._gapElId);
      if(gapEl){
        var hasStopped = d.dnf && lapsCompleted >= d._dnfStopLap - 1e-6;
        if(hasStopped){
          gapEl.textContent = 'ABANDONOU';
          var rowEl = document.getElementById(d._rowElId);
          if(rowEl) rowEl.classList.add('dnf');
        } else if(d===leader){
          gapEl.textContent = 'LÍDER';
        } else {
          var gapLaps = leaderLapsNow - lapsCompleted;
          var gapSecs = gapLaps*LAP_SECONDS;
          gapEl.textContent = gapSecs<0.05 ? 'LÍDER' : '+'+gapSecs.toFixed(1)+'s';
        }
      }
    });

    var lapBadge = document.getElementById('gpm-lap-badge');
    if(lapBadge){
      var curLap = Math.min(TOTAL_LAPS, Math.floor((elapsed/raceDuration)*TOTAL_LAPS)+1);
      lapBadge.textContent = 'Volta '+curLap+'/'+TOTAL_LAPS;
    }

    var toastEl = document.getElementById('gpm-race-toast');
    if(toastEl && !finished){
      var frac = elapsed/raceDuration;
      if(frac>0.85) toastEl.textContent = 'Últimos metros até a linha de chegada...';
      else if(frac>0.4) toastEl.textContent = 'Corrida em andamento — briga acirrada!';
    }

    if(!finished){
      state.raceAnimFrame = requestAnimationFrame(frame);
    } else {
      var lapBadge2 = document.getElementById('gpm-lap-badge');
      if(lapBadge2) lapBadge2.textContent = 'Volta '+TOTAL_LAPS+'/'+TOTAL_LAPS;
      if(toastEl) toastEl.textContent = 'Bandeira quadriculada — o líder cruzou a linha!';
      var statusEl = document.getElementById('gpm-grid-status');
      if(statusEl) statusEl.textContent = 'CORRIDA ENCERRADA';
      state.raceTimers.push(setTimeout(function(){ state.screen='reveal'; render(); }, 1100));
    }
  }
  state.raceAnimFrame = requestAnimationFrame(frame);
}

function revealNext(){
  var board = document.getElementById('gpm-board');
  if(!board) return;
  if(state.revealIndex<=0){
    state.revealTimer = setTimeout(function(){ state.screen='results'; render(); }, 700);
    return;
  }
  var idx = state.revealIndex-1;
  var d = state.results[idx];
  var posClass = d.pos===1?'p1':d.pos===2?'p2':d.pos===3?'p3':'';
  var row = el(
    '<div class="row'+(d.mine?' mine':'')+(d.dnf?' dnf':'')+'">'+
      '<div class="pos '+posClass+'">'+d.pos+'</div>'+
      '<div class="row-main"><div class="row-driver">'+rivalNameHtml(d.nome, d.teamKey)+'</div><div class="row-team">'+d.team+'</div></div>'+
      '<div class="row-gap">'+d.gap+'</div>'+
      '<div class="row-pts">'+(d.pts>0?'+'+d.pts:'')+'</div>'+
    '</div>'
  );
  board.appendChild(row);
  state.revealIndex = idx;
  var delay = d.pos<=3 ? 1100 : 550;
  state.revealTimer = setTimeout(revealNext, delay);
}

function renderResults(){
  var wrap = el('<div></div>');
  var mine = state.results.filter(function(d){return d.mine;});
  var myPts = mine.reduce(function(s,d){return s+d.pts;},0);
  var bestPos = Math.min.apply(null, mine.map(function(d){return d.pos;}));
  var seasonActive = !!state.season;
  var track = seasonActive ? state.season.tracks[state.season.trackIndex] : null;

  wrap.appendChild(el(
    '<div class="header">'+
      '<div class="eyebrow">'+(seasonActive? 'Corrida '+(state.season.trackIndex+1)+' de '+state.season.tracks.length+' concluída' : 'Bandeirada final')+'</div>'+
      '<h1>'+(seasonActive? track.flag+' '+track.name : state.teamName)+'</h1>'+
    '</div>'
  ));

  wrap.appendChild(el(
    '<div class="panel hero-result">'+
      '<div class="num">'+myPts+' pts</div>'+
      '<div class="lbl">Melhor posição: P'+bestPos+' &nbsp;•&nbsp; '+mine.map(function(d){return d.nome+' (P'+d.pos+')';}).join(' · ')+'</div>'+
    '</div>'
  ));

  if(state.highlights && state.highlights.length){
    var recapPanel = el('<details class="panel"></details>');
    recapPanel.innerHTML = '<summary>Ver melhores momentos desta corrida</summary>'+
      '<div class="hl-board" style="margin-top:10px;">'+highlightsHtml(state.highlights)+'</div>';
    wrap.appendChild(recapPanel);
  }

  var board = el('<div class="board"></div>');
  state.results.slice().reverse().forEach(function(d){
    var posClass = d.pos===1?'p1':d.pos===2?'p2':d.pos===3?'p3':'';
    board.appendChild(el(
      '<div class="row'+(d.mine?' mine':'')+(d.dnf?' dnf':'')+'" style="animation:none;opacity:1;">'+
        '<div class="pos '+posClass+'">'+d.pos+'</div>'+
        '<div class="row-main"><div class="row-driver">'+rivalNameHtml(d.nome, d.teamKey)+'</div><div class="row-team">'+d.team+'</div></div>'+
        '<div class="row-gap">'+d.gap+'</div>'+
        '<div class="row-pts">'+(d.pts>0?'+'+d.pts:'')+'</div>'+
      '</div>'
    ));
  });
  wrap.appendChild(board);

  if(seasonActive){
    var standWrap = el('<div class="panel"></div>');
    standWrap.innerHTML = '<div class="timing-title" style="padding:0 0 8px;">Classificação do campeonato</div>'+titleRivalCalloutHtml()+standingsHtml(state.season.standings);
    wrap.appendChild(standWrap);
  }

  var actions = el('<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;"></div>');
  if(seasonActive){
    if(state.season.trackIndex < state.season.tracks.length-1){
      var next = el('<button class="btn">Próxima corrida</button>');
      next.addEventListener('click', function(){ state.season.trackIndex++; state.screen='prerace'; render(); });
      actions.appendChild(next);
    } else {
      var finish = el('<button class="btn">Ver resultado do campeonato</button>');
      finish.addEventListener('click', function(){ state.screen='champion'; render(); });
      actions.appendChild(finish);
    }
    var quit = el('<button class="btn ghost">Abandonar temporada</button>');
    quit.addEventListener('click', function(){ resetState(); render(); });
    actions.appendChild(quit);
  } else {
    var again = el('<button class="btn">Nova corrida (mesma equipe)</button>');
    again.addEventListener('click', function(){ startRace(); });
    var redraft = el('<button class="btn ghost">Recomeçar (nova equipe)</button>');
    redraft.addEventListener('click', function(){ resetState(); render(); });
    actions.appendChild(again);
    actions.appendChild(redraft);
  }
  wrap.appendChild(actions);

  return wrap;
}

// chuva de confete rápida (~3.5s) numa canvas fixa por cima da tela, só quando o jogador vence
// o campeonato — se remove sozinha no fim, não deixa nada preso no DOM
function launchConfetti(){
  var canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  var colors = ['#ff7a29','#ffd23f','#3ddc84','#5aa9e6','#e6435a'];
  var pieces = [];
  for(var i=0;i<120;i++){
    pieces.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.6,
      w: 6+Math.random()*6,
      h: 8+Math.random()*8,
      color: colors[Math.floor(Math.random()*colors.length)],
      speedY: 2+Math.random()*3,
      speedX: (Math.random()-0.5)*2,
      rot: Math.random()*360,
      rotSpeed: (Math.random()-0.5)*10
    });
  }
  var start = Date.now();
  function frame(){
    var elapsed = Date.now()-start;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(function(p){
      p.y += p.speedY; p.x += p.speedX; p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(elapsed < 3500) requestAnimationFrame(frame);
    else canvas.remove();
  }
  frame();
}

// quebra uma linha de texto em várias, centralizadas em (x,y), pra caber numa largura máxima
function wrapTextCentered(ctx, text, x, y, maxWidth, lineHeight){
  var words = text.split(' '), line = '', lines = [];
  words.forEach(function(w){
    var test = line + w + ' ';
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line.trim()); line = w + ' '; }
    else line = test;
  });
  lines.push(line.trim());
  var startY = y - (lines.length-1)*lineHeight/2;
  lines.forEach(function(l,i){ ctx.fillText(l, x, startY + i*lineHeight); });
}

// gera e baixa um card-resumo da temporada (canvas -> PNG), pra compartilhar com amigos sem
// precisar de print de tela feio — usa as mesmas cores do tema do jogo
function downloadSeasonCard(){
  var standings = state.season.standings;
  var myPos = standings.map(function(s){ return s.mine; }).indexOf(true)+1;
  var mine = standings.filter(function(s){ return s.mine; })[0];
  var isChamp = myPos===1;
  var rival = state.season.titleRivalKey ? standings.filter(function(s){ return s.key===state.season.titleRivalKey; })[0] : null;

  var W=900, H=1200;
  var canvas = document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  var ctx = canvas.getContext('2d');

  var grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#181b22');
  grad.addColorStop(1,'#12141a');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#ff7a29';
  ctx.fillRect(0,0,W,14);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#8f97a3';
  ctx.font = '600 28px Arial';
  ctx.fillText('GRAND PRIX MANAGER', W/2, 90);

  ctx.fillStyle = isChamp ? '#ffd23f' : '#eef0f3';
  ctx.font = '800 60px Arial';
  ctx.fillText(isChamp ? '🏆 CAMPEÃO!' : 'P'+myPos+' NA TEMPORADA', W/2, 172);

  ctx.fillStyle = '#eef0f3';
  ctx.font = '700 44px Arial';
  ctx.fillText(state.teamName, W/2, 248);

  ctx.fillStyle = '#3ddc84';
  ctx.font = '600 32px Arial';
  ctx.fillText(mine.points+' pontos', W/2, 302);

  if(rival){
    var diff = mine.points - rival.points;
    var line = diff>=0 ? ('Superou a rival '+rival.label+' por '+diff+' pts') : ('Rival '+rival.label+' terminou '+(-diff)+' pts à frente');
    ctx.fillStyle = '#8f97a3';
    ctx.font = '500 24px Arial';
    wrapTextCentered(ctx, line, W/2, 355, W-160, 30);
  }

  var y = 460;
  ctx.font = '600 22px Arial';
  standings.slice(0,6).forEach(function(s,i){
    var isRival = rival && s.key===rival.key;
    ctx.fillStyle = s.mine ? '#ffd23f' : (isRival ? '#e6435a' : '#eef0f3');
    ctx.textAlign = 'left';
    ctx.fillText((i+1)+'. '+s.label, 100, y);
    ctx.textAlign = 'right';
    ctx.fillText(s.points+' pts', W-100, y);
    y += 50;
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4a4f5c';
  ctx.font = '500 20px Arial';
  ctx.fillText('mateusfalkowski.github.io/gp-manager', W/2, H-50);

  canvas.toBlob(function(blob){
    var fileName = (state.teamName||'temporada').replace(/[^a-z0-9]+/gi,'_') + '_gp_manager.png';
    var shareText = (isChamp ? '🏆 Fui campeão' : 'Terminei em P'+myPos) + ' no GP Manager! mateusfalkowski.github.io/gp-manager';

    // no celular (a maioria de quem for ver isso), compartilhar direto pro WhatsApp/Instagram
    // com a folha de compartilhamento nativa é bem mais provável de rolar do que baixar o
    // arquivo e depois ter que anexar manualmente — mas nem todo navegador suporta compartilhar
    // arquivo (ex: desktop), então cai pro download de sempre nesse caso
    var file = (typeof File!=='undefined') ? new File([blob], fileName, {type:'image/png'}) : null;
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'GP Manager', text:shareText}).catch(function(){});
      return;
    }

    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  });
}

function renderChampion(){
  var wrap = el('<div></div>');
  var standings = state.season.standings;
  var myPos = standings.map(function(s){return s.mine;}).indexOf(true) + 1;
  var myPts = standings.filter(function(s){return s.mine;})[0].points;
  var isChamp = myPos===1;

  // checa as conquistas de fim de temporada — unlockBadge só retorna true na primeira vez de
  // verdade (persistido no navegador), então isso não repete o aviso em visitas futuras a esta tela
  var rival = state.season.titleRivalKey ? standings.filter(function(s){ return s.key===state.season.titleRivalKey; })[0] : null;
  var newBadges = [];
  if(isChamp && unlockBadge('champion')) newBadges.push('champion');
  if(rival && myPts>rival.points && unlockBadge('beat_rival')) newBadges.push('beat_rival');
  var wonAllRaces = state.season.history.length>0 && state.season.history.every(function(h){
    return h.results.some(function(d){ return d.mine && d.pos===1; });
  });
  if(wonAllRaces && unlockBadge('perfect_season')) newBadges.push('perfect_season');
  var noDnf = state.season.history.length>0 && state.season.history.every(function(h){
    return h.results.every(function(d){ return !d.mine || !d.dnf; });
  });
  if(noDnf && unlockBadge('no_dnf_season')) newBadges.push('no_dnf_season');
  if(isChamp && state.rivalDifficulty==='dificil' && unlockBadge('hard_mode_champion')) newBadges.push('hard_mode_champion');
  if(isChamp && state.almanac && unlockBadge('almanac_champion')) newBadges.push('almanac_champion');
  if(rival && myPts-rival.points>=100 && unlockBadge('crush_rival')) newBadges.push('crush_rival');
  if(getSeasonsCompleted()>=5 && unlockBadge('veteran')) newBadges.push('veteran');

  wrap.appendChild(el(
    '<div class="header">'+
      '<div class="eyebrow">Fim de temporada</div>'+
      '<h1>'+(isChamp? '🏆 Campeão da Temporada!' : 'Temporada encerrada')+'</h1>'+
      '<div class="subtitle">'+(isChamp
        ? state.teamName+' terminou em 1º lugar depois de '+state.season.tracks.length+' corridas!'
        : state.teamName+' terminou em '+myPos+'º lugar depois de '+state.season.tracks.length+' corridas.')+
      '</div>'+
    '</div>'
  ));

  var panel = el('<div class="panel hero-result"></div>');
  panel.innerHTML = '<div class="num">'+(isChamp?'🏆':'P'+myPos)+'</div><div class="lbl">'+myPts+' pontos na temporada</div>';
  wrap.appendChild(panel);

  var rivalOutcome = titleRivalOutcomeHtml();
  if(rivalOutcome) wrap.appendChild(el(rivalOutcome));

  if(newBadges.length){
    var badgesPanel = el('<div class="panel" style="text-align:center;"></div>');
    badgesPanel.innerHTML = newBadges.map(function(id){
      var a = ACHIEVEMENTS.filter(function(x){ return x.id===id; })[0];
      return '<div class="footer-info" style="margin:4px 0;"><b style="color:var(--accent-2);">🎖️ Conquista desbloqueada: '+a.icon+' '+a.nome+'</b></div>';
    }).join('');
    wrap.appendChild(badgesPanel);
  }

  var standWrap = el('<div class="panel"></div>');
  standWrap.innerHTML = '<div class="timing-title" style="padding:0 0 8px;">Classificação final</div>'+standingsHtml(standings);
  wrap.appendChild(standWrap);

  var actions = el('<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;"></div>');
  if(state.almanac){
    var revealBtn = el('<button class="btn ghost">🔓 Revelar atributos ocultos</button>');
    revealBtn.addEventListener('click', function(){ state.screen='almanacreveal'; render(); });
    actions.appendChild(revealBtn);
  }
  // navegadores com compartilhamento nativo de arquivo (celular, majoritariamente) mostram
  // "compartilhar" já que é isso que downloadSeasonCard() vai fazer; o resto cai pro download
  var canShareFiles = !!(navigator.canShare && typeof File!=='undefined');
  var cardBtn = el('<button class="btn ghost">'+(canShareFiles ? '📤 Compartilhar card da temporada' : '📸 Baixar card da temporada')+'</button>');
  cardBtn.addEventListener('click', function(){ downloadSeasonCard(); });
  actions.appendChild(cardBtn);
  var recapBtn = el('<button class="btn ghost">Ver retrospectiva da temporada</button>');
  recapBtn.addEventListener('click', function(){ state.screen='recap'; render(); });
  var restart = el('<button class="btn">Nova temporada</button>');
  restart.addEventListener('click', function(){ resetState(); render(); });
  actions.appendChild(recapBtn);
  actions.appendChild(restart);
  wrap.appendChild(actions);

  if(isChamp) setTimeout(launchConfetti, 150);

  return wrap;
}

  var a = state.aero;

      '<div class="stats">'+statBar('Retas',a.retas)+statBar('Curvas',a.curvas)+statBar('Velocidade Máxima',a.vmax)+'</div>'+

  var t = state.pneus;
