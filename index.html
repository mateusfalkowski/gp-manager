<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#12141a;
  --bg-alt:#181b22;
  --surface:#1e222b;
  --surface-hover:#262b36;
  --border:#2b303c;
  --text:#eef0f3;
  --text-dim:#8f97a3;
  --accent:#ff7a29;
  --accent-2:#ffd23f;
  --danger:#e6435a;
  --good:#3ddc84;
}
*{box-sizing:border-box;}
#gpm .card,#gpm .btn,#gpm .tab,#gpm .season-btn,#gpm .speed-btn{touch-action:manipulation;}
#gpm{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:0;
  margin:0;
  -webkit-font-smoothing:antialiased;
}
#gpm .wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px;}
#gpm h1,#gpm h2,#gpm h3,#gpm .num{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.02em;}
#gpm .flagstrip{
  height:8px;width:100%;
  background-image:repeating-conic-gradient(#20232b 0% 25%, #383e4a 0% 50%);
  background-size:16px 16px;
  opacity:.6;
}
#gpm .header{padding:20px 0 14px;}
#gpm .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:700;}
#gpm h1{font-size:30px;margin:4px 0 2px;line-height:1.05;}
#gpm .subtitle{color:var(--text-dim);font-size:13.5px;margin-bottom:14px;}
#gpm input.teamname{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-family:'Rajdhani',sans-serif;font-weight:600;font-size:17px;
  padding:9px 12px;border-radius:8px;width:100%;max-width:340px;outline:none;
}
#gpm input.teamname:focus{border-color:var(--accent);}

/* budget gauge */
#gpm .gauge-box{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin:16px 0 18px;
}
#gpm .gauge-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
#gpm .gauge-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-dim);}
#gpm .gauge-value{font-size:22px;}
#gpm .gauge-value .rem{color:var(--accent-2);}
#gpm .gauge-value .over{color:var(--danger);}
#gpm .gauge-track{
  height:10px;border-radius:6px;background:var(--bg-alt);overflow:hidden;position:relative;border:1px solid var(--border);
}
#gpm .gauge-fill{
  height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width .35s ease;
}
#gpm .gauge-fill.over{background:linear-gradient(90deg,var(--danger),#ff8a9c);}

/* tabs */
#gpm .tabs{display:flex;gap:6px;margin-bottom:14px;}
#gpm .tab{
  flex:1;text-align:center;padding:10px 6px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);cursor:pointer;
  font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14.5px;color:var(--text-dim);
  transition:all .15s ease;user-select:none;
}
#gpm .tab .count{display:block;font-size:11px;font-weight:500;margin-top:2px;color:var(--text-dim);}
#gpm .tab.active{background:var(--accent);border-color:var(--accent);color:#1a1200;}
#gpm .tab.active .count{color:#1a1200cc;}
#gpm .tab.done:not(.active){border-color:var(--good);color:var(--good);}
#gpm .tab.locked{opacity:.35;cursor:not-allowed;}
#gpm .tab-short{display:none;}
/* em telas estreitas o draft tem 6 abas numa linha só — "Aerodinâmica" por extenso quebra
   linha e aperta as vizinhas, então troca pro rótulo curto (ex: "Aero") abaixo desse ponto */
@media (max-width:480px){
  #gpm .tab-full{display:none;}
  #gpm .tab-short{display:inline;}
  #gpm .tab{padding:9px 3px;font-size:13px;}
}

/* cards */
#gpm .cardgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px;}
#gpm .card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:13px 14px;cursor:pointer;transition:all .15s ease;position:relative;
}
#gpm .card:hover:not(.disabled):not(.locked){border-color:var(--accent);background:var(--surface-hover);}
/* indicador de foco pra navegação por teclado — cards/abas/botões de dificuldade são <div>s
   sem esse contorno nativo que um <button> teria de graça (ver makeCardActivatable) */
#gpm [tabindex]:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
#gpm .card.locked{cursor:default;}
#gpm .card.selected{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,122,41,.12),var(--surface));box-shadow:0 0 0 1px var(--accent) inset;}
#gpm .card.disabled{opacity:.4;cursor:not-allowed;}
#gpm .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
#gpm .card-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;line-height:1.15;}
#gpm .card-role{font-size:12px;color:var(--accent-2);font-weight:600;}
#gpm .card-price{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;color:var(--accent-2);white-space:nowrap;}
#gpm .card-desc{font-size:12px;color:var(--text-dim);margin-bottom:8px;line-height:1.4;}
#gpm .stats{display:flex;gap:12px;flex-wrap:wrap;}
#gpm .stat{flex:1;min-width:60px;}
#gpm .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:3px;}
#gpm .stat-num{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;line-height:1;}
#gpm .stat-num.stat-elite{color:#1fa863;}
#gpm .stat-num.stat-hi{color:var(--good);}
#gpm .stat-num.stat-mid{color:var(--accent-2);}
#gpm .stat-num.stat-lo{color:var(--danger);}
#gpm .check{
  position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:#1a1200;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;
}
#gpm .trait-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
#gpm .trait-tag{
  font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:20px;white-space:nowrap;
}
#gpm .trait-pos{background:rgba(61,220,132,.14);color:var(--good);}
#gpm .trait-neg{background:rgba(230,67,90,.14);color:var(--danger);}

/* season selector */
#gpm .season-box{margin-bottom:14px;}
#gpm .season-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-dim);margin-bottom:6px;}
#gpm .season-btns{display:flex;gap:8px;}
#gpm .season-btn{
  flex:1;text-align:center;padding:9px 6px;border-radius:8px;background:var(--surface);
  border:1px solid var(--border);cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;
  font-size:15px;color:var(--text-dim);transition:all .15s ease;
}
#gpm .season-btn.active{background:var(--accent-2);border-color:var(--accent-2);color:#241a00;}

/* footer bar — só fica grudada no fundo da tela (.sticky) quando carrega um botão de ação; a
   versão puramente informativa fica no fluxo normal, senão "sticky" cobre o conteúdo de cima
   mesmo sem o usuário ter rolado (o rodapé gruda na base da viewport assim que a tela é mais
   alta que ela, não só depois de rolar até o fim) */
#gpm .footerbar{
  background:var(--bg-alt);border-top:1px solid var(--border);
  padding:12px 16px;margin:24px -16px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;
}
#gpm .footerbar.sticky{position:sticky;bottom:0;}
#gpm .footer-info{font-size:12px;color:var(--text-dim);line-height:1.4;}
#gpm .footer-info b{color:var(--text);}
#gpm .btn{
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:.03em;
  padding:11px 20px;border-radius:8px;border:none;cursor:pointer;text-transform:uppercase;
  background:var(--accent);color:#1a1200;transition:all .15s ease;white-space:nowrap;
}
#gpm .btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px);}
#gpm .btn:disabled{background:var(--border);color:var(--text-dim);cursor:not-allowed;}
#gpm .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
#gpm .btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
#gpm .back-btn{padding:7px 12px;font-size:12.5px;text-transform:none;letter-spacing:0;margin-top:14px;}

/* pre-race / results */
#gpm .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;}
#gpm .lineup-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
#gpm .lineup-row:last-child{border-bottom:none;}
#gpm .lineup-role{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.1em;}
#gpm .lineup-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;}
#gpm .center-cta{display:flex;justify-content:center;margin-top:10px;}

#gpm .board{display:flex;flex-direction:column-reverse;gap:6px;}
#gpm .row{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;opacity:0;transform:translateX(-14px);
  animation:slideIn .45s ease forwards;
}
@keyframes slideIn{to{opacity:1;transform:translateX(0);}}

/* transição de tela: toda troca de tela (render()) entra com um fade + leve deslize pra cima,
   em vez de trocar seco — dura pouco de propósito, pra não virar mais uma espera */
@keyframes gpmScreenIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
#gpm .screen-enter{animation:gpmScreenIn .22s ease-out;}

/* "roleta" do sorteio de pistas — pulso sutil na grade toda enquanto os cards ficam trocando de
   selecionado/travado a cada giro (ver spinTrackSortition) */
@keyframes gpmSortitionPulse{0%{transform:scale(1);}100%{transform:scale(.985);}}
#gpm .cardgrid.spinning{animation:gpmSortitionPulse .12s ease-in-out infinite alternate;}

/* "sortear novamente" do draft — cartas saem encolhendo e as novas entram em seguida, como um
   baralho sendo trocado (ver spinDraftReroll) */
@keyframes gpmCardFlipOut{to{opacity:0;transform:scale(.85);}}
@keyframes gpmCardFlipIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
#gpm .card.flip-out{animation:gpmCardFlipOut .18s ease-in forwards;}
#gpm .card.flip-in{animation:gpmCardFlipIn .22s ease-out both;}
#gpm .row.mine{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,122,41,.14),var(--surface));}
#gpm .row.dnf{opacity:.55!important;animation:none;}
#gpm .pos{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;width:30px;color:var(--text-dim);}
#gpm .row.mine .pos{color:var(--accent-2);}
#gpm .row .p1{color:#ffd23f;}
#gpm .row .p2{color:#cfd4dc;}
#gpm .row .p3{color:#d68a4c;}
#gpm .row-main{flex:1;min-width:0;}
#gpm .row-driver{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14.5px;}
#gpm .row-team{font-size:11px;color:var(--text-dim);}
#gpm .row-gap{font-family:'Rajdhani',sans-serif;font-size:12.5px;color:var(--text-dim);white-space:nowrap;}
#gpm .row-pts{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;color:var(--good);width:26px;text-align:right;}

#gpm .hero-result{text-align:center;padding:10px 0 4px;}
#gpm .hero-result .num{font-size:44px;color:var(--accent-2);}
#gpm .hero-result .lbl{color:var(--text-dim);font-size:13px;}

#gpm .skipbar{display:flex;justify-content:center;margin-top:14px;}
#gpm .toast{
  font-size:12px;color:var(--text-dim);text-align:center;margin-top:8px;min-height:16px;
}

/* race track */
#gpm .track-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:0 0 12px 12px;
  padding:10px;margin-bottom:8px;
}
#gpm .track-wrap svg{width:100%;height:auto;display:block;}
@media (max-width:600px){
  #gpm .track-wrap svg{max-height:34vh;width:auto;margin:0 auto;}
}
#gpm .legend{display:flex;gap:16px;justify-content:center;align-items:center;font-size:11.5px;color:var(--text-dim);margin:10px 0 4px;flex-wrap:wrap;}
#gpm .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}

/* starting lights */
#gpm .lights-gantry{
  display:flex;gap:8px;justify-content:center;align-items:center;
  background:#1a1d24;border:1px solid var(--border);border-bottom:none;
  border-radius:12px 12px 0 0;padding:12px 10px;
}
#gpm .light{
  width:24px;height:24px;border-radius:50%;background:#3a1216;border:2px solid #4a1a20;
  transition:background .12s ease, box-shadow .12s ease;
}
#gpm .light.on{background:#ff2d3a;border-color:#ff5c66;box-shadow:0 0 16px 5px rgba(255,45,58,.75);}
#gpm .grid-status{
  text-align:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;
  color:var(--accent-2);padding:2px 0 8px;min-height:20px;
}

/* layout: track + timing tower side by side */
#gpm .race-layout{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
#gpm .race-track-col{flex:1 1 300px;min-width:260px;}
#gpm .race-timing-col{flex:1 1 200px;min-width:190px;max-width:100%;}
#gpm .timing-tower{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:8px;display:flex;flex-direction:column;gap:4px;
}
#gpm .timing-title{
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-dim);padding:4px 6px 6px;
}
#gpm .timing-row{
  display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;
  background:var(--bg-alt);font-size:11.5px;
}
#gpm .timing-row.mine{border:1px solid var(--accent);background:linear-gradient(135deg,rgba(255,122,41,.18),var(--bg-alt));}
#gpm .timing-row.dnf{opacity:.4;}
#gpm .timing-pos{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;width:16px;color:var(--text-dim);flex-shrink:0;}
#gpm .timing-row.mine .timing-pos{color:var(--accent-2);}
#gpm .timing-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
#gpm .timing-name{flex:1;font-family:'Rajdhani',sans-serif;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#gpm .timing-pit-badge{margin-left:5px;font-size:10px;}
#gpm .timing-gap{font-family:'Rajdhani',sans-serif;font-size:10.5px;color:var(--text-dim);white-space:nowrap;flex-shrink:0;}
#gpm .timing-tire{display:flex;align-items:center;gap:3px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:10.5px;color:var(--text-dim);white-space:nowrap;flex-shrink:0;}
#gpm .timing-tire-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.3);}

/* highlights (temporada) */
#gpm .hl-board{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
#gpm .hl-card{
  display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;opacity:0;transform:translateY(8px);animation:hlIn .4s ease forwards;
}
@keyframes hlIn{to{opacity:1;transform:translateY(0);}}
#gpm .hl-icon{font-size:20px;line-height:1.2;flex-shrink:0;}
#gpm .hl-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;color:var(--accent-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
#gpm .hl-text{font-size:13px;color:var(--text);line-height:1.4;}
#gpm details.panel summary{
  cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;
  color:var(--accent-2);list-style:revert;user-select:none;
}
#gpm details.panel summary:hover{color:var(--accent);}
#gpm details.panel[open] summary{margin-bottom:4px;}

/* classificação do campeonato */
#gpm .stand-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
#gpm .stand-row:last-child{border-bottom:none;}
#gpm .stand-row.mine{color:var(--accent-2);}
#gpm .stand-row.mine .stand-label{font-weight:700;}
#gpm .stand-row.rival{color:var(--danger);}
#gpm .stand-row.rival .stand-label{font-weight:700;}
#gpm .stand-pos{width:22px;color:var(--text-dim);font-family:'Rajdhani',sans-serif;font-weight:700;flex-shrink:0;}
#gpm .stand-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#gpm .stand-pts{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--good);white-space:nowrap;}

/* corrida longa */
#gpm .wx-timeline{display:flex;gap:6px;flex-wrap:wrap;}
#gpm .wx-seg{flex:1;min-width:54px;text-align:center;background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;padding:8px 4px;}
#gpm .wx-seg-now{border-color:var(--accent-2);background:linear-gradient(135deg,rgba(255,210,63,.14),var(--bg-alt));}
#gpm .lr-sc-banner{
  text-align:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.03em;
  color:#1a1200;background:linear-gradient(90deg,var(--accent-2),#ffe27a);border-radius:8px;
  padding:9px 10px;margin-bottom:10px;
}
#gpm .lr-tire-alert{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:13.5px;color:var(--text);background:rgba(239,122,133,.14);border:1px solid rgba(239,122,133,.5);
  border-radius:8px;padding:10px 12px;margin-bottom:10px;
}
#gpm .lr-tire-alert button{flex-shrink:0;padding:6px 18px;}
#gpm .wx-seg-lap{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:4px;}
#gpm .wx-seg-icon{font-size:18px;}
#gpm .wx-seg-pct{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;color:var(--text-dim);margin-top:2px;}
#gpm .lr-status{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;}
#gpm .lr-stat{flex:1;min-width:90px;}
#gpm .lr-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:3px;}
#gpm .lr-stat-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;color:var(--text);}
#gpm .lr-standing{font-size:12.5px;color:var(--text-dim);background:var(--bg-alt);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.6;}
#gpm .lr-decision{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,122,41,.12),var(--surface));}
#gpm .lr-decision-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;color:var(--accent-2);}
#gpm .lr-decision-msg{font-size:13px;color:var(--text-dim);margin-top:4px;}
#gpm .lr-decision .cardgrid{margin-bottom:0;}
#gpm .lr-decision .card{cursor:pointer;}
#gpm .lr-pit{text-align:center;border-color:var(--accent-2);background:linear-gradient(135deg,rgba(255,210,63,.10),var(--surface));}
#gpm .lr-pit-timer{margin:12px 0 10px;}
#gpm .lr-pit-time{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:40px;color:var(--accent-2);line-height:1;}
#gpm .lr-pit-req{font-size:12px;color:var(--text-dim);margin-top:4px;}
#gpm .lr-pit-track{height:10px;border-radius:6px;background:var(--bg-alt);overflow:hidden;border:1px solid var(--border);}
#gpm .lr-pit-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
#gpm .lr-pit-problem{margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(239,122,133,.14);border:1px solid rgba(239,122,133,.4);color:var(--bad,#ef7a85);font-size:12.5px;text-align:left;}
#gpm .lr-pit-approach{color:var(--text-dim);font-size:12.5px;margin-top:4px;}

/* controle de velocidade da simulação */
#gpm .speed-ctrl{display:flex;gap:6px;}
#gpm .speed-btn{
  padding:6px 12px;border-radius:7px;background:var(--surface);border:1px solid var(--border);
  cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;color:var(--text-dim);
  transition:all .15s ease;user-select:none;
}
#gpm .speed-btn:hover{border-color:var(--accent);color:var(--text);}
#gpm .speed-btn.active{background:var(--accent);border-color:var(--accent);color:#1a1200;}

/* faixa de controles agrupados da corrida longa (velocidade + previsão + pit) — tudo junto no
   topo, principalmente pra não espalhar botões pela tela toda no celular */
#gpm .lr-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;}
#gpm .lr-ctrl-btn{
  padding:6px 12px;font-size:13px;text-transform:none;letter-spacing:0;white-space:nowrap;
}

function flagFor(nat){
  var map = {AUT:'🇦🇹',GBR:'🇬🇧',ITA:'🇮🇹',JPN:'🇯🇵',BRA:'🇧🇷',ARG:'🇦🇷',ESP:'🇪🇸',BGR:'🇧🇬',BUL:'🇧🇬',POL:'🇵🇱',PRT:'🇵🇹',FRA:'🇫🇷',DEU:'🇩🇪',USA:'🇺🇸',AUS:'🇦🇺',CAN:'🇨🇦',NLD:'🇳🇱',MEX:'🇲🇽',THA:'🇹🇭',FIN:'🇫🇮',MON:'🇲🇨',BEL:'🇧🇪'};
  return map[(nat||'').toUpperCase()] || '🏁';
}

// achata "personagem + cada temporada dele" em cartas individuais, prontas pro sorteio do draft
function buildAllCards(){
  ALL_CARDS.chefes = [];
  (RAW_DATA.chefes||[]).forEach(function(c){
    (c.seasons||[]).forEach(function(s){
      var devBase = (s.overall*0.6 + (s.development!=null?s.development:s.overall)*0.4);
      var scoreMult = 0.90 + (devBase/100)*0.20;
      var consBase = ((s.leadership!=null?s.leadership:s.overall) + (s.strategy!=null?s.strategy:s.overall))/2;
      var varMult = 1.30 - (consBase/100)*0.60;
      var traits = (s.positive_traits||[]).concat(s.negative_traits||[]);
      ALL_CARDS.chefes.push({
        id:c.id+'_'+s.year, personId:c.id, nome:c.name, pais:flagFor(c.nationality),
        apelido:(s.team||'—')+' • '+s.year,
        scoreMult:scoreMult, varMult:varMult,
        lideranca:s.leadership!=null?s.leadership:s.overall,
        estrategia:s.strategy!=null?s.strategy:s.overall,
        desenvolvimento:s.development!=null?s.development:s.overall,
        desc: traits.join(' · '),
        traitsPos:s.positive_traits||[], traitsNeg:s.negative_traits||[]
      });
    });
  });

  ALL_CARDS.pilotos = [];
  (RAW_DATA.pilotos||[]).forEach(function(p){
    (p.seasons||[]).forEach(function(s){
      ALL_CARDS.pilotos.push({
        id:p.id+'_'+s.year, personId:p.id, nome:p.name, pais:flagFor(p.nationality),
        apelido:(s.team||'—')+' • '+s.year, team:s.team||'—', year:s.year, teammate:s.teammate||null,
        vel:s.pace!=null?s.pace:s.overall, cons:s.consistency!=null?s.consistency:s.overall, agr:s.aggression!=null?s.aggression:s.overall,
        traitsPos:s.positive_traits||[], traitsNeg:s.negative_traits||[]
      });
    });
  });

  ALL_CARDS.motores = [];
  if(RAW_DATA.motores && RAW_DATA.motores.length){
    RAW_DATA.motores.forEach(function(m){
      (m.seasons||[]).forEach(function(s){
        ALL_CARDS.motores.push({
          id:m.id+'_'+s.year, personId:m.id, nome:m.name, fabricante:'Era '+s.year,
          pot:s.power, confiab:s.reliability,
          // sem texto narrativo próprio no data.json pra motor — não sintetiza um "desc" a partir
          // dos próprios traços, senão a mesma informação aparece duas vezes no card (uma como
          // frase corrida, outra como as tags ▲/▼ logo abaixo)
          desc: '',
          traitsPos:s.positive_traits||[], traitsNeg:s.negative_traits||[]
        });
      });
    });
  } else {
    ALL_CARDS.motores = MOTORES.slice(); // fallback: fabricantes reais de 2026
  }

  ALL_CARDS.aero = AERO_PACOTES.slice(); // não existe esse dado no data.json — sempre usa a lista fixa
  ALL_CARDS.pneus = PNEUS_FORNECEDORES.slice(); // idem — lista fixa de fornecedores por era
}

// linha de descrição opcional de um card de produto (motor/aero/pneus) — cai fora quando não
// existe (motor vindo do data.json não tem texto narrativo próprio) em vez de repetir os
// mesmos traços já mostrados como tags ▲/▼ logo abaixo. Selecionado sem desc ainda mostra o
// "CONTRATADO" sozinho, senão a confirmação da escolha desaparecia de vez
function cardDescHtml(desc, selected){
  if(desc) return '<div class="card-desc" style="margin-top:8px;">'+desc+(selected?' <b style="color:var(--good);">— CONTRATADO</b>':'')+'</div>';
  return selected ? '<div class="card-desc" style="margin-top:8px;"><b style="color:var(--good);">CONTRATADO</b></div>' : '';
}

function traitTags(pos, neg){
  var html = '';
  (pos||[]).forEach(function(t){ html += '<span class="trait-tag trait-pos">▲ '+t+'</span>'; });
  (neg||[]).forEach(function(t){ html += '<span class="trait-tag trait-neg">▼ '+t+'</span>'; });
  return html ? '<div class="trait-row">'+html+'</div>' : '';
}

function loadExternalData(){
  fetch('./data.json', {cache:'no-store'}).then(function(res){
    if(!res.ok) throw new Error('sem data.json');
    return res.json();
  }).then(function(json){
    if(json && Array.isArray(json.chefes) && Array.isArray(json.pilotos)){
      RAW_DATA = json;
      buildAllCards();
      // só reaplica automaticamente se o jogador ainda não começou a escolher nada
      if(state.screen==='draft' && !state.chefe && state.pilotos.length===0 && !state.motor){
        state.pools = generatePools();
        render(true);
      }
    }
  }).catch(function(){
    // sem data.json (ou erro de CORS ao abrir como arquivo local) — mantém o roster padrão embutido
  });
}

// diferença de ritmo puro entre os compostos: macio > médio > duro (o resto do desempenho vem do encaixe com a pista/desgaste)
function compoundGrip(compoundId){
  var t = tireById(compoundId);
  return t && t.grip!=null ? t.grip : 1.0;
}

// desempenho de cada composto conforme o % de umidade da pista (0-100) — fora da zona ideal a
// queda é forte de propósito: pneu errado pra condição tem que doer de verdade (ex: abaixo de
// 5% de umidade o seco tem que ser muito mais rápido que o intermediário/chuva, e vice-versa
// quando a pista está bem molhada)
function tireWetnessFit(compoundId, wetPct){
  if(compoundId==='inter'){
    if(wetPct<=5) return 0.22;
    if(wetPct<15) return 0.22 + (wetPct-5)/10*0.78;
    if(wetPct<=60) return 1;
    return Math.max(0.35, 1 - (wetPct-60)/40*0.65);
  }
  if(compoundId==='chuva'){
    if(wetPct>60) return 1;
    return Math.max(0.15, 1 - (60-wetPct)/60*0.85);
  }
  // slicks (macio/médio/duro)
  if(wetPct<=15) return 1;
  if(wetPct<=25) return 1 - (wetPct-15)/10*0.65;
  return Math.max(0.12, 0.35 - (wetPct-25)/75*0.23);
}

function wetnessZone(pct){
  return pct<15 ? 'seca' : (pct<=60 ? 'umida' : 'molhada');
}

function rollInitialCondition(){
  var r = Math.random();
  return r<0.5 ? 'seco' : (r<0.8 ? 'nublado' : 'chuva');
}

function initialWetnessFor(cond){
  if(cond==='chuva') return rand(25,55);
  if(cond==='nublado') return rand(5,25);
  return rand(0,12);
}

function nextWeatherCondition(c){
  if(c==='seco') return Math.random()<0.65 ? 'seco' : (Math.random()<0.5 ? 'nublado' : 'chuva');
  if(c==='chuva') return Math.random()<0.55 ? 'chuva' : (Math.random()<0.5 ? 'nublado' : 'seco');
  return Math.random()<0.4 ? 'nublado' : (Math.random()<0.5 ? 'seco' : 'chuva');
}

// a umidade da pista é consequência da condição: chuva molha, sol seca, nublado seca devagar
function wetnessDelta(cond){
  if(cond==='chuva') return rand(10,26);
  if(cond==='seco') return -rand(8,20);
  return -rand(1,8);
}

function clampWet(w){ return Math.max(0, Math.min(100, w)); }

// previsão em blocos de 2 voltas: a condição do tempo evolui aos poucos e a umidade decorre dela.
// o clima real segue a previsão na maioria das corridas — só uma parte delas tem uma "virada"
// de verdade, pra previsão não surpreender toda hora
function buildWeatherScript(laps){
  var segCount = Math.max(1, Math.ceil(laps/2));

  var forecastCond = [], forecastWet = [];
  var fc = rollInitialCondition();
  var fw = initialWetnessFor(fc);
  for(var i=0;i<segCount;i++){
    if(i>0){ fc = nextWeatherCondition(fc); fw = clampWet(fw + wetnessDelta(fc)); }
    forecastCond.push(fc);
    forecastWet.push(Math.round(fw));
  }

  // uma única rolagem por corrida decide se vai ter surpresa — e se tiver, acontece uma vez só,
  // num ponto do meio da corrida (não faz sentido "surpreender" faltando 1 volta)
  var willSurprise = segCount>2 && Math.random()<0.1;
  var surpriseSeg = willSurprise ? Math.floor(rand(1, Math.max(2,segCount-1))) : -1;

  var actualCond = [], actualWet = [];
  var ac = forecastCond[0], aw = forecastWet[0];
  var diverged = false;
  for(var j=0;j<segCount;j++){
    if(j>0){
      if(j===surpriseSeg) diverged = true;
      ac = diverged ? nextWeatherCondition(ac) : forecastCond[j];
      aw = clampWet(aw + wetnessDelta(ac));
    }
    actualCond.push(ac);
    actualWet.push(Math.round(aw));
  }

  return { segCount:segCount, forecastCond:forecastCond, forecastWet:forecastWet, actualCond:actualCond, actualWet:actualWet };
}

function trackConditionLabel(wetPct){
  return wetPct<15 ? 'seca' : 'molhada';
}

function segmentLapLabel(i, laps){
  var start = i*2+1, end = Math.min(laps, i*2+2);
  return start===end ? ('V'+start) : ('V'+start+'-'+end);
}

// o clima de verdade (não só a previsão) tem que mudar aos poucos, não pular de uma vez a cada 2
// voltas — interpola linear entre o valor "oficial" de um segmento (na volta em que ele começa)
// e o do próximo, usando a posição contínua na corrida (lr.liveLapFloat), não o contador de
// voltas que só avança quando o segmento termina
function liveWetnessNow(lr){
  var w = lr.weather;
  var lapFloat = lr.liveLapFloat!=null ? lr.liveLapFloat : Math.max(1, lr.lap||1);
  var segCount = w.segCount;
  var segPos = (lapFloat-1)/2; // 0 no início do segmento 0, 1 no início do segmento 1, ...
  segPos = Math.max(0, Math.min(segCount-1, segPos));
  var i0 = Math.floor(segPos), i1 = Math.min(segCount-1, i0+1);
  var frac = segPos - i0;
  var wetPct = w.actualWet[i0] + (w.actualWet[i1]-w.actualWet[i0])*frac;
  var cond = frac<0.5 ? w.actualCond[i0] : w.actualCond[i1];
  return {wetPct:wetPct, cond:cond};
}

// mesma previsão mostrada antes da largada, reaproveitada nos momentos de decisão (SC/VSC/clima/pit)
// pra dar ao jogador a mesma informação que ele tinha ao escolher o pneu inicial
// a previsão "atualiza em tempo real" conforme a corrida acontece: voltas já rodadas e o
// segmento logo à frente mostram o clima real (já é praticamente certo), só o resto do
// horizonte ainda usa a previsão original — quanto menos volta falta, menos incerteza sobra
function liveForecast(lr){
  var w = lr.weather;
  if(!lr.started) return {cond:w.forecastCond, wet:w.forecastWet};
  // usa a volta realmente exibida na tela (lr.liveLap), não lr.lap — esse só avança quando o
  // segmento atual termina de verdade, o que podia deixar a previsão até 2 voltas atrasada
  // em relação ao que o jogador via no resto da tela
  var displayedLap = lr.liveLap!=null ? lr.liveLap : lr.lap;
  var curSeg = Math.floor((displayedLap>0?displayedLap-1:0)/2);
  var reliableUntil = curSeg+1; // segmento atual + o próximo já são tratados como praticamente certos
  var cond = [], wet = [];
  for(var i=0;i<w.segCount;i++){
    if(i<=reliableUntil){ cond.push(w.actualCond[i]); wet.push(w.actualWet[i]); }
    else { cond.push(w.forecastCond[i]); wet.push(w.forecastWet[i]); }
  }
  return {cond:cond, wet:wet};
}

function weatherTimelineHtml(lr){
  var laps = lr.totalLaps;
  var live = liveForecast(lr);
  var displayedLap = lr.liveLap!=null ? lr.liveLap : lr.lap;
  var curSegIdx = Math.floor((displayedLap>0?displayedLap-1:0)/2);
  var segHtml = live.cond.map(function(c,i){
    return '<div class="wx-seg'+(i===curSegIdx?' wx-seg-now':'')+'"><div class="wx-seg-lap">'+segmentLapLabel(i,laps)+'</div><div class="wx-seg-icon">'+WEATHER_COND_ICON[c]+'</div><div class="wx-seg-pct">'+live.wet[i]+'%</div></div>';
  }).join('');
  return '<div class="timing-title" style="padding:0 0 8px;">Previsão a cada 2 voltas</div><div class="wx-timeline">'+segHtml+'</div>';
}

// mostra onde os carros do jogador estão na hora de uma decisão (posição e gap) — sem isso, o
// jogador escolhia pneu/pit sem noção nenhuma de contexto (líder? brigando por posição? já bem atrás?)
function myStandingHtml(lr){
  var all = lr.rivalField.concat(lr.mineField);
  var ordered = all.slice().sort(function(a,b){
    var pa = a._liveProgress!=null?a._liveProgress:(a._progress||0);
    var pb = b._liveProgress!=null?b._liveProgress:(b._progress||0);
    return pb-pa;
  });
  var leaderLive = ordered.length ? (ordered[0]._liveProgress!=null?ordered[0]._liveProgress:(ordered[0]._progress||0)) : 0;
  var parts = lr.mineField.map(function(d){
    var idx = ordered.indexOf(d);
    var myLive = d._liveProgress!=null?d._liveProgress:(d._progress||0);
    var isDnf = d.dnf && myLive >= d._dnfLap-1e-6;
    var gapText = isDnf ? 'ABANDONOU' : (idx===0 ? 'líder' : '+'+((leaderLive-myLive)*LR_LAP_SECONDS).toFixed(1)+'s');
    return '<b style="color:var(--accent-2);">'+shortName(d.driverName)+'</b> P'+(idx+1)+' ('+gapText+')';
  });
  return '<div class="lr-standing">📍 '+parts.join(' &nbsp;·&nbsp; ')+'</div>';
}

function getActiveTrack(){
  return state.season ? state.season.tracks[state.season.trackIndex] : state.raceTrack;
}

function catmullRom(p0,p1,p2,p3,t){
  var t2=t*t, t3=t2*t;
  return {
    x: 0.5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    y: 0.5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  };
}

function buildClosedSpline(anchors, samplesPerSeg){
  var n = anchors.length, pts = [];
  for(var i=0;i<n;i++){
    var p0 = anchors[(i-1+n)%n], p1 = anchors[i], p2 = anchors[(i+1)%n], p3 = anchors[(i+2)%n];
    for(var s=0;s<samplesPerSeg;s++){
      pts.push(catmullRom(p0,p1,p2,p3, s/samplesPerSeg));
    }
  }
  return pts;
}

function buildTrackData(anchors){
  var pts = buildClosedSpline(anchors, 14);
  var ptsExt = pts.concat([pts[0]]);
  var cum = [0];
  for(var i=1;i<ptsExt.length;i++){
    var a=ptsExt[i-1], b=ptsExt[i];
    var dx=b.x-a.x, dy=b.y-a.y;
    cum.push(cum[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  var total = cum[cum.length-1];
  var d = 'M'+pts.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' L')+' Z';
  return { pts:pts, ptsExt:ptsExt, cum:cum, total:total, d:d };
}

function trackPointAt(trackData, dist){
  var d = ((dist % trackData.total)+trackData.total) % trackData.total;
  var lo=0, hi=trackData.cum.length-1;
  while(lo<hi-1){
    var mid=(lo+hi)>>1;
    if(trackData.cum[mid]<=d) lo=mid; else hi=mid;
  }
  var segLen = (trackData.cum[hi]-trackData.cum[lo]) || 1;
  var frac = (d-trackData.cum[lo])/segLen;
  var a=trackData.ptsExt[lo], b=trackData.ptsExt[hi];
  return { x: a.x+(b.x-a.x)*frac, y: a.y+(b.y-a.y)*frac };
}

function startLineMarkup(trackData){
  var pt = trackData.pt0 || trackPointAt(trackData, 0);
  var pt2 = trackPointAt(trackData, 2);
  var dx=pt2.x-pt.x, dy=pt2.y-pt.y;
  var mag=Math.sqrt(dx*dx+dy*dy)||1;
  var nx=-dy/mag, ny=dx/mag;
  var half=11;
  var x1=pt.x+nx*half, y1=pt.y+ny*half;
  var x2=pt.x-nx*half, y2=pt.y-ny*half;
  return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="url(#gpm-chk)" stroke-width="7"/>';
}

/* ---------- pools aleatórias (opções mudam a cada rodada) ---------- */
function pickRandom(arr, n){
  var copy = arr.slice();
  for(var i=copy.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = copy[i]; copy[i]=copy[j]; copy[j]=tmp;
  }
  return copy.slice(0, Math.min(n, copy.length));
}

// sorteia cartas garantindo no máximo 1 carta por pessoa/fabricante (evita a mesma pessoa aparecer 2x no mesmo pool)
function pickRandomDistinctPersons(cards, n){
  var byPerson = {};
  cards.forEach(function(c){
    var key = c.personId || c.id;
    (byPerson[key] = byPerson[key] || []).push(c);
  });
  var groups = pickRandom(Object.keys(byPerson).map(function(k){ return byPerson[k]; }), n);
  return groups.map(function(g){ return g[Math.floor(Math.random()*g.length)]; });
}

function generatePools(){
  return {
    chefe: pickRandomDistinctPersons(ALL_CARDS.chefes, Math.min(3, ALL_CARDS.chefes.length)),
    piloto1: pickRandomDistinctPersons(ALL_CARDS.pilotos, Math.min(3, ALL_CARDS.pilotos.length)),
    piloto2: [], // só é sorteado depois que o piloto 1 é escolhido, pra excluir quem já foi contratado
    motor: pickRandomDistinctPersons(ALL_CARDS.motores, Math.min(3, ALL_CARDS.motores.length)),
    aero: pickRandomDistinctPersons(ALL_CARDS.aero, Math.min(3, ALL_CARDS.aero.length)),
    pneus: pickRandomDistinctPersons(ALL_CARDS.pneus, Math.min(3, ALL_CARDS.pneus.length))
  };
}

// sorteia de novo as opções da etapa atual do draft — só pode ser usado 1x em todo o draft
// (chefe, piloto 1, piloto 2, motor, aero ou pneus), qualquer que seja a etapa escolhida
function rerollCurrentDraftPool(){
  if(state.draftRefreshUsed) return;
  state.draftRefreshUsed = true;
  if(state.tab==='chefe'){
    state.pools.chefe = pickRandomDistinctPersons(ALL_CARDS.chefes, Math.min(3, ALL_CARDS.chefes.length));
  } else if(state.tab==='piloto1'){
    state.pools.piloto1 = pickRandomDistinctPersons(ALL_CARDS.pilotos, Math.min(3, ALL_CARDS.pilotos.length));
  } else if(state.tab==='piloto2'){
    var excludeIds = state.pilotos.map(function(p){ return p.personId; });
    var candidates = ALL_CARDS.pilotos.filter(function(c){ return excludeIds.indexOf(c.personId)===-1; });
    state.pools.piloto2 = pickRandomDistinctPersons(candidates, Math.min(3, candidates.length));
  } else if(state.tab==='motor'){
    state.pools.motor = pickRandomDistinctPersons(ALL_CARDS.motores, Math.min(3, ALL_CARDS.motores.length));
  } else if(state.tab==='aero'){
    state.pools.aero = pickRandomDistinctPersons(ALL_CARDS.aero, Math.min(3, ALL_CARDS.aero.length));
  } else if(state.tab==='pneus'){
    state.pools.pneus = pickRandomDistinctPersons(ALL_CARDS.pneus, Math.min(3, ALL_CARDS.pneus.length));
  }
  render();
}

var _draftRerollSpinning = false;

// mesma ideia do sorteio de pistas, adaptada pra "cara de baralho": as 3 cartas atuais saem
// (encolhem/somem) e as 3 novas entram em seguida (com um leve atraso entre elas, tipo sendo
// distribuídas uma a uma) — sem precisar duplicar os 6 templates de carta diferentes do draft,
// só anima a troca em volta do rerollCurrentDraftPool() que já existe
function spinDraftReroll(){
  if(state.draftRefreshUsed || _draftRerollSpinning) return;
  _draftRerollSpinning = true;

  var btn = document.getElementById('gpm-draft-reroll-btn');
  if(btn){ btn.disabled = true; btn.textContent = '🔄 Sorteando...'; }

  var grid = document.querySelector('#gpm .cardgrid');
  var cards = grid ? Array.from(grid.querySelectorAll('.card')) : [];
  cards.forEach(function(c, i){
    c.style.animationDelay = (i*50)+'ms';
    c.classList.add('flip-out');
  });

  var waitMs = cards.length ? (180 + (cards.length-1)*50 + 40) : 0;
  setTimeout(function(){
    rerollCurrentDraftPool(); // já chama render() por dentro
    var newGrid = document.querySelector('#gpm .cardgrid');
    var newCards = newGrid ? Array.from(newGrid.querySelectorAll('.card')) : [];
    newCards.forEach(function(c, i){
      c.style.animationDelay = (i*60)+'ms';
      c.classList.add('flip-in');
    });
    _draftRerollSpinning = false;
  }, waitMs);
}

var badgesCache = null;
function loadBadges(){
  if(badgesCache) return badgesCache;
  try { badgesCache = JSON.parse(localStorage.getItem('gpm_badges')||'{}'); } catch(e){ badgesCache = {}; }
  return badgesCache;
}
function saveBadgesLocal(b){
  badgesCache = b;
  try { localStorage.setItem('gpm_badges', JSON.stringify(b)); } catch(e){}
}
// espelha 1 conquista pro Firestore, sem travar a UI esperando a resposta — se falhar (sem
// internet no momento), a conquista já está salva local e sincroniza no próximo merge de login
function syncBadgeToCloud(id, dateIso){
  if(!fbDb || !state.user) return;
  var patch = {}; patch[id] = dateIso;
  fbDb.collection('badges').doc(state.user.uid).set(patch, {merge:true}).catch(function(){});
}
// desbloqueia 1 conquista se ainda não tinha sido conquistada — retorna true só quando é nova,
// pra dar pra avisar o jogador só na hora que ele realmente ganhou, não toda vez que já tinha
function unlockBadge(id){
  var badges = loadBadges();
  if(badges[id]) return false;
  var dateIso = new Date().toISOString();
  badges[id] = dateIso;
  saveBadgesLocal(badges);
  syncBadgeToCloud(id, dateIso);
  return true;
}

// contador simples de temporadas concluídas (só local — não precisa sincronizar entre
// aparelhos), usado pela conquista "Veterano". Incrementa 1x por temporada de verdade, no
// momento exato em que ela termina (finishQuickSeasonUI), não toda vez que a tela de campeão renderiza
function bumpSeasonsCompleted(){
  var n = 0;
  try { n = parseInt(localStorage.getItem('gpm_seasons_completed')||'0', 10) || 0; } catch(e){}
  n++;
  try { localStorage.setItem('gpm_seasons_completed', String(n)); } catch(e){}
  return n;
}

}

// une as conquistas da nuvem com as locais (a data mais antiga de cada uma vence) e sobe pra
// nuvem qualquer conquista que só existia local — cobre tanto "jogou em outro aparelho antes"
// quanto "jogou offline neste aparelho antes de logar"
function mergeCloudBadges(cloudData){
  var local = loadBadges();
  var merged = {}, changedLocal = false, toPush = {};
  var allIds = Object.keys(local).concat(Object.keys(cloudData||{}));
  allIds.forEach(function(id){
    var localDate = local[id], cloudDate = cloudData ? cloudData[id] : null;
    if(localDate && cloudDate) merged[id] = localDate < cloudDate ? localDate : cloudDate;
    else if(localDate) { merged[id] = localDate; toPush[id] = localDate; }
    else merged[id] = cloudDate;
    if(merged[id] !== local[id]) changedLocal = true;
  });
  if(changedLocal) saveBadgesLocal(merged);
  if(Object.keys(toPush).length && fbDb && state.user){
    fbDb.collection('badges').doc(state.user.uid).set(toPush, {merge:true}).catch(function(){});
  }
}

function loginWithGoogle(){
  if(!fbAuth) return;
  // aplica o usuário direto aqui, assim que o popup resolve — não depende só do listener
  // onAuthStateChanged (cuja timing com o debounce do render() já causou tela desatualizada até
  // navegar pra outra aba e voltar); ainda tem o listener e o poll de segurança como reforço
  fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(function(result){
    applyAuthUser(result.user);
  }).catch(function(e){
    alert('Não foi possível entrar: '+e.message);
  });
}
function logout(){
  if(!fbAuth) return;
  fbAuth.signOut().then(function(){
    state.user = null;
    render(true);
  });
}
// aplica o usuário do Firebase Auth no state, buscando/mesclando as conquistas da nuvem —
// compartilhado entre o listener onAuthStateChanged e a checagem de segurança abaixo, pra não
// duplicar essa lógica em dois lugares
function applyAuthUser(user){
  if(user){
    state.user = {uid:user.uid, name:user.displayName, photo:user.photoURL};
    fbDb.collection('badges').doc(user.uid).get().then(function(doc){
      mergeCloudBadges(doc.exists ? doc.data() : {});
      render(true);
    }).catch(function(){ render(true); });
  } else {
    state.user = null;
    render(true);
  }
}

function initAuth(){
  if(!fbAuth) return;
  fbAuth.onAuthStateChanged(applyAuthUser);
  // rede de segurança: confere a cada 1.5s se o usuário logado no SDK bate com o que a tela tá
  // mostrando — cobre qualquer caso em que o listener acima (ou o .then() do popup de login)
  // não dispare um re-render por algum motivo, sem depender só de um único caminho
  setInterval(function(){
    var cur = fbAuth.currentUser;
    var curUid = cur ? cur.uid : null;
    var shownUid = state.user ? state.user.uid : null;
    if(curUid !== shownUid) applyAuthUser(cur);
  }, 1500);
}

// deixa um elemento clicável (card, aba, botão de dificuldade — tudo <div> comum, sem suporte
// nativo de teclado) navegável por Tab e ativável com Enter/Espaço, igual um <button> de verdade
// teria de graça. Sem isso, o jogo inteiro só dava pra jogar com mouse/touch.
function makeCardActivatable(elm, handler){
  elm.tabIndex = 0;
  elm.setAttribute('role','button');
  elm.addEventListener('click', handler);
  elm.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===' ' || e.key==='Spacebar'){
      e.preventDefault();
      handler(e);
    }
  });
}

var _lastRenderAt = 0;
var _lastRenderedScreen = null; // pra só animar a entrada quando a TELA muda de verdade, não a
// cada re-render dentro da mesma tela (ex: selecionar um card no draft chama render() de novo
// pra mostrar "CONTRATADO" e outra vez pra trocar de aba — sem essa checagem, a tela inteira
// piscava de novo a cada clique em vez de só a troca de tela real)
// force=true ignora o debounce abaixo — usado por callbacks assíncronos (login, fetch de dados)
// que terminam bem depois de qualquer toque do jogador, então não têm relação com o "clique
// fantasma" que o debounce existe pra filtrar; sem o bypass, esses re-renders podiam ser
// silenciosamente descartados só por coincidirem em menos de 150ms com algum outro render
function render(force){
  // no celular, trocar o conteúdo da tela durante o próprio evento de toque às vezes dispara um
  // segundo "clique fantasma" no elemento que aparece embaixo do dedo — isso ignora esse eco e
  // evita pular direto de uma tela pra duas telas à frente com um único toque
  var now = Date.now();
  if(!force && now - _lastRenderAt < 150) return;
  _lastRenderAt = now;
  var root = document.getElementById('gpm-root');
  root.innerHTML='';
  var screenEl = null;
  if(state.screen==='mode') screenEl = renderModeSelect();
  else if(state.screen==='racestyle') screenEl = renderRaceStyle();
  else if(state.screen==='raceoptions') screenEl = renderRaceOptions();
  else if(state.screen==='draft') screenEl = renderDraft();
  else if(state.screen==='prerace') screenEl = renderPrerace();
  else if(state.screen==='strategy') screenEl = renderStrategy();
  else if(state.screen==='longrace') screenEl = renderLongRace();
  else if(state.screen==='race') screenEl = renderRace();
  else if(state.screen==='highlights') screenEl = renderHighlights();
  else if(state.screen==='reveal') screenEl = renderReveal();
  else if(state.screen==='results') screenEl = renderResults();
  else if(state.screen==='champion') screenEl = renderChampion();
  else if(state.screen==='recap') screenEl = renderRecap();
  else if(state.screen==='quickseason') screenEl = renderQuickSeason();
  else if(state.screen==='almanacreveal') screenEl = renderAlmanacReveal();
  else if(state.screen==='badges') screenEl = renderBadges();
  if(screenEl){
    // troca de tela entra com um fade/deslize suave em vez de aparecer seco — um só lugar,
    // vale pra toda troca de tela do jogo automaticamente. Só anima quando a TELA muda de
    // verdade — um re-render dentro da mesma tela (ex: selecionar um card no draft) não deve
    // fazer a tela inteira piscar de novo
    if(state.screen !== _lastRenderedScreen) screenEl.classList.add('screen-enter');
    root.appendChild(screenEl);
  }
  _lastRenderedScreen = state.screen;
}

// dificuldade + (pra modos de temporada) escolha de pistas — fica entre a escolha de modo/estilo
// e o draft, então toda entrada no draft passa por aqui
function needsTrackPick(){
  return state.mode==='season' || state.mode==='quickseason';
}

var _trackSortitionSpinning = false;

// "roleta" do sorteio de pistas: em vez de trocar o resultado na hora, gira por umas 1.5s
// mostrando conjuntos aleatórios de 5 pistas cada vez mais devagar (como uma roleta freando) até
// travar no resultado sorteado de verdade. Mexe direto no DOM em cada giro (não chama render())
// pra não recriar a grade inteira 11 vezes seguidas.
function spinTrackSortition(){
  if(_trackSortitionSpinning) return;
  _trackSortitionSpinning = true;

  var btn = document.getElementById('gpm-track-roll-btn');
  var msg = document.getElementById('gpm-track-roll-msg');
  var grid = document.getElementById('gpm-track-grid');
  if(btn){ btn.disabled = true; btn.textContent = '🎲 Sorteando...'; }
  if(msg) msg.textContent = 'Embaralhando as pistas...';
  if(grid) grid.classList.add('spinning');

  function applySelection(ids){
    if(!grid) return;
    grid.querySelectorAll('.card').forEach(function(cardEl){
      var sel = ids.indexOf(cardEl.getAttribute('data-track-id'))>=0;
      cardEl.classList.toggle('selected', sel);
      cardEl.classList.toggle('disabled', !sel);
      var check = cardEl.querySelector('.check');
      if(sel && !check) cardEl.insertAdjacentHTML('afterbegin', '<div class="check">&#10003;</div>');
      else if(!sel && check) check.remove();
    });
  }

  var finalIds = pickRandom(TRACKS, SEASON_LENGTH).map(function(t){ return t.id; });
  var tick = 0, totalTicks = 11, delay = 55;
  function step(){
    tick++;
    var last = tick>=totalTicks;
    applySelection(last ? finalIds : pickRandom(TRACKS, SEASON_LENGTH).map(function(t){ return t.id; }));
    if(!last){
      delay = Math.round(delay*1.18); // cada giro um pouco mais devagar que o anterior
      setTimeout(step, delay);
    } else {
      state.pickedTrackIds = finalIds;
      _trackSortitionSpinning = false;
      if(grid) grid.classList.remove('spinning');
      render();
    }
  }
  step();
}

        'Pistas sorteadas e travadas — clique em "Sortear '+SEASON_LENGTH+' pistas" de novo pra trocar.')+

    // a grade fica sempre visível (mesmo antes do primeiro sorteio, só com tudo "travado" à

    // a grade de 8 pistas costuma passar da altura da tela — reserva espaço em baixo do tamanho

          (state.almanac ? '' : ('<div class="stats">'+statBar('Retas',a.retas)+statBar('Curvas',a.curvas)+statBar('Velocidade Máxima',a.vmax)+'</div>'))+
          (state.almanac
            ? (selected?'<div class="card-desc" style="margin-top:8px;"><b style="color:var(--good);">CONTRATADO</b></div>':'')
            : ('<div class="card-desc" style="margin-top:8px;">'+a.desc+(selected?' <b style="color:var(--good);">— CONTRATADO</b>':'')+'</div>'))+
          (state.almanac ? '' : traitTags(a.traitsPos, a.traitsNeg))+
        '</div>'
      );
      if(!disabled && !selected){
        makeCardActivatable(card, function(){
          state.aero = a;
          render();
          setTimeout(function(){ state.tab='pneus'; render(); }, 260);
        });
      }
      grid.appendChild(card);
    });
  }

  if(state.tab==='pneus'){
    state.pools.pneus.forEach(function(t){
      var selected = state.pneus && state.pneus.id===t.id;
      var locked = !!state.pneus;
      var disabled = locked && !selected;
      var card = el(
        '<div class="card'+(selected?' selected':'')+(disabled?' disabled':'')+'">'+
          (selected?'<div class="check">&#10003;</div>':'')+
          '<div class="card-top">'+
            '<div><div class="card-name">'+t.nome+'</div><div class="card-role">'+t.fabricante+'</div></div>'+
          '</div>'+
          (state.almanac ? '' : ('<div class="stats">'+statBar('Aderência',t.aderencia)+statBar('Consistência',t.consistencia)+'</div>'))+
          (state.almanac
            ? (selected?'<div class="card-desc" style="margin-top:8px;"><b style="color:var(--good);">CONTRATADO</b></div>':'')
            : ('<div class="card-desc" style="margin-top:8px;">'+t.desc+(selected?' <b style="color:var(--good);">— CONTRATADO</b>':'')+'</div>'))+
          (state.almanac ? '' : traitTags(t.traitsPos, t.traitsNeg))+
        '</div>'
      );
      if(!disabled && !selected){
        makeCardActivatable(card, function(){
          state.pneus = t;
          render();
          setTimeout(function(){
            if(!state.teamName.trim()) state.teamName = 'Equipe Sem Nome';
            if(state.mode==='quickseason'){
              initSeason();
              state.screen='quickseason';
            } else {
              if(state.mode==='season') initSeason();
              state.screen='prerace';
            }
            render();
          }, 300);
        });
      }
      grid.appendChild(card);
    });
  }

  wrap.appendChild(grid);

  var footer = el(
    '<div class="footerbar">'+
      '<div class="footer-info">'+(state.almanac ? '📖 Os números existem e valem pra corrida — você só não vê.' : '🎲 Tudo na sorte — a qualidade de cada contratado varia por temporada.')+'</div>'+
    '</div>'
  );
  wrap.appendChild(footer);

  return wrap;
}

function initSeason(){
  var myPersonIds = state.pilotos.map(function(p){ return p.personId; });
  var rivals = buildRivalPool(10, myPersonIds);

  // agrupa por pairKey (as duplas de companheiro de equipe real que o buildRivalPool já formou),
  // em vez de parear por índice cego — parear por índice separava duplas reais quando um piloto
  // avulso (sem companheiro encontrado) ficava intercalado entre elas no array, e ainda juntava
  // esse avulso com o início de outra dupla como se fossem companheiros de equipe
  var groups = [], byKey = {};
  rivals.forEach(function(r){
    var key = r.pairKey || ('solo_'+r.personId);
    if(!byKey[key]){ byKey[key] = []; groups.push(byKey[key]); }
    byKey[key].push(r);
  });
  // a equipe do jogador tem 2 pilotos com pontos somados — pra ser justo, os 10 rivais também
  // formam 5 "equipes" de 2. As duplas reais já vêm prontas do agrupamento acima; só falta
  // combinar quem ficou sozinho (sem companheiro real), dois a dois
  var teams = [], solos = [];
  groups.forEach(function(g){ if(g.length>=2) teams.push(g); else solos.push(g[0]); });
  for(var s=0;s<solos.length;s+=2){
    teams.push(solos[s+1] ? [solos[s], solos[s+1]] : [solos[s]]);
  }

  var standings = [{key:'mine', label:state.teamName, mine:true, points:0}];
  teams.forEach(function(members, idx){
    var teamKey = 'rt_'+idx;
    var partner = members[1];
    var anchorLabel = members[0].team + (members[0].year ? ' '+members[0].year : '');
    var partnerLabel = partner ? partner.team + (partner.year ? ' '+partner.year : '') : null;
    var teamLabel = (partner && partner.team && partner.team!==members[0].team) ? anchorLabel+' / '+partnerLabel : anchorLabel;
    members.forEach(function(m){ m.teamKey = teamKey; });
    standings.push({key:teamKey, label:teamLabel, mine:false, points:0});
  });
  var tracks = (state.pickedTrackIds && state.pickedTrackIds.length===SEASON_LENGTH)
    ? state.pickedTrackIds.map(function(id){ return TRACKS.filter(function(t){ return t.id===id; })[0]; })
    : TRACKS.slice(0, SEASON_LENGTH);
  state.season = { trackIndex:0, rivals:rivals, standings:standings, history:[], tracks:tracks, titleRivalKey:pickTitleRival(rivals) };
}

// escolhe qual equipe rival vai ser a "rival de título" da temporada: a que tem a maior média de
// velocidade/consistência/agressividade dos pilotos reais (as únicas partes não-aleatórias do
// grid rival), pra ser uma ameaça de verdade e não uma equipe qualquer sorteada
function pickTitleRival(rivals){
  var sums = {}, counts = {};
  rivals.forEach(function(r){
    var key = r.teamKey;
    var q = (r.vel+r.cons+r.agr)/3;
    sums[key] = (sums[key]||0) + q;
    counts[key] = (counts[key]||0) + 1;
  });
  var bestKey = null, bestAvg = -1;
  Object.keys(sums).forEach(function(key){
    var avg = sums[key]/counts[key];
    if(avg>bestAvg){ bestAvg = avg; bestKey = key; }
  });
  return bestKey;
}

function standingsHtml(standings){
  var rivalKey = state.season ? state.season.titleRivalKey : null;
  return standings.map(function(s,i){
    var isRival = !s.mine && s.key===rivalKey;
    var cls = s.mine ? ' mine' : (isRival ? ' rival' : '');
    var marker = isRival ? '🎯 ' : '';
    return '<div class="stand-row'+cls+'"><div class="stand-pos">'+(i+1)+'</div><div class="stand-label">'+marker+s.label+'</div><div class="stand-pts">'+s.points+' pts</div></div>';
  }).join('');
}

// linha de destaque com a rival de título e a diferença de pontos atual — usada em toda tela que
// já mostra a classificação, pra dar um fio narrativo à temporada em vez de só uma tabela
function titleRivalCalloutHtml(final){
  var seas = state.season;
  if(!seas || !seas.titleRivalKey) return '';
  var mine = seas.standings.filter(function(s){ return s.mine; })[0];
  var rival = seas.standings.filter(function(s){ return s.key===seas.titleRivalKey; })[0];
  if(!mine || !rival) return '';
  var diff = mine.points - rival.points;
  var cmp = diff===0 ? 'empatada em pontos com' : diff>0 ? ('com <b style="color:var(--good);">'+diff+' pts</b> de vantagem sobre') : ('<b style="color:var(--danger);">'+(-diff)+' pts</b> atrás de');
  // temporada em andamento usa presente ("é"/"está"); temporada já encerrada usa passado
  // ("foi"/"ficou") — sem isso, a tela de classificação final soava como se a corrida ainda tivesse rolando
  var linkVerb = final ? 'foi' : 'é', stateVerb = final ? 'ficou' : 'está';
  return '<div class="footer-info" style="margin-bottom:10px;">🎯 Sua rival de título '+linkVerb+' a <b style="color:var(--text);">'+rival.label+'</b> — você '+stateVerb+' '+cmp+' ela.</div>';
}

// anúncio da rival de título logo no início da temporada, antes da 1ª corrida (quando ainda não
// tem classificação nenhuma pra comparar pontos, então é só a apresentação de quem é a ameaça)
function titleRivalIntroHtml(){
  var seas = state.season;

}

// nome do piloto em vermelho quando ele é da equipe rival de título, pra ficar visível de cara
// em qualquer lista de resultados (não só na tabela de classificação)

// mensagem de fechamento pra tela de campeão: como terminou a disputa com a rival de título

function rand(min,max){ return min + Math.random()*(max-min); }

function buildRival(name, team){
  var vel = rand(68,96), cons = rand(60,92), agr = rand(50,92);
  var pot = rand(68,97), confiab = rand(65,92);
  return {personId:'filler_'+name, nome:name, pais:null, team:team, vel:vel, cons:cons, agr:agr, pot:pot, confiab:confiab};
}

// sorteia os rivais da corrida a partir do MESMO pool de pilotos que o jogador pode escolher no draft
// (excluindo quem já está na sua equipe), com atributos de motor aleatórios já que eles não têm um motor escolhido.
// cada rival sorteado ("âncora") entra na corrida junto do companheiro de equipe REAL daquela temporada
// (campo "teammate" da base de dados): se esse companheiro também tiver carta própria no pool, os dois
// correm com estatísticas reais; senão ele entra como piloto avulso mas com o nome histórico certo.
// O resto do grid é preenchido com pilotos soltos como antes.
function buildRivalPool(n, excludePersonIds){
  var candidates = ALL_CARDS.pilotos.filter(function(c){ return excludePersonIds.indexOf(c.personId)===-1; });
  var rivals = [];
  var usedPersonIds = {};
  // rastreado por NOME (não só personId) porque um companheiro sem carta própria vira um piloto
  // avulso com personId sintético ('filler_'+nome) — sem isso a mesma pessoa podia ser criada de
  // novo como companheiro de outra âncora diferente e aparecer duas vezes na mesma corrida
  var usedNames = {};
  // uma equipe não pode aparecer 2x no grid mesmo com anos diferentes (ex: "Mercedes 2015" e
  // "Mercedes 2019" juntas confundiriam, ainda mais com a cor da bolinha marcando dupla real)
  var usedTeams = {};
  var pairSeq = 0;

  var byPerson = {};
  candidates.forEach(function(c){ (byPerson[c.personId]=byPerson[c.personId]||[]).push(c); });
  var personGroups = pickRandom(Object.keys(byPerson).map(function(k){ return byPerson[k]; }), Object.keys(byPerson).length);

  personGroups.forEach(function(group){
    if(rivals.length>=n) return;
    var anchorCard = group[Math.floor(Math.random()*group.length)];
    if(usedPersonIds[anchorCard.personId] || usedNames[anchorCard.nome] || usedTeams[anchorCard.team]) return;

    var pairKey = 'pair_'+(pairSeq++);
    rivals.push({
      personId:anchorCard.personId, nome:anchorCard.nome, pais:anchorCard.pais, team:anchorCard.team, year:anchorCard.year,
      vel:anchorCard.vel, cons:anchorCard.cons, agr:anchorCard.agr,
      pot:rand(68,97), confiab:rand(65,92), pairKey:pairKey
    });
    usedPersonIds[anchorCard.personId] = true;
    usedNames[anchorCard.nome] = true;
    usedTeams[anchorCard.team] = true;
    if(rivals.length>=n) return;

    var teammateName = anchorCard.teammate;
    if(!teammateName || teammateName.indexOf('None')===0 || usedNames[teammateName]) return;
    var realPartner = candidates.filter(function(c){ return c.nome===teammateName && c.personId!==anchorCard.personId && !usedPersonIds[c.personId]; })[0];
    if(realPartner){
      rivals.push({
        personId:realPartner.personId, nome:realPartner.nome, pais:realPartner.pais, team:anchorCard.team, year:anchorCard.year,
        vel:realPartner.vel, cons:realPartner.cons, agr:realPartner.agr,
        pot:rand(68,97), confiab:rand(65,92), realTeammate:true, pairKey:pairKey
      });
      usedPersonIds[realPartner.personId] = true;
      usedNames[realPartner.nome] = true;
    } else {
      var filler = buildRival(teammateName, anchorCard.team);
      filler.year = anchorCard.year;
      filler.realTeammate = true;
      filler.pairKey = pairKey;
      rivals.push(filler);
      usedNames[teammateName] = true;
    }
  });

  if(rivals.length < n){
    var remainingCandidates = candidates.filter(function(c){ return !usedPersonIds[c.personId] && !usedNames[c.nome] && !usedTeams[c.team]; });
    var picks = pickRandomDistinctPersons(remainingCandidates, n-rivals.length);
    picks.forEach(function(p){
      rivals.push({
        personId:p.personId, nome:p.nome, pais:p.pais, team:p.team, year:p.year,
        vel:p.vel, cons:p.cons, agr:p.agr,
        pot:rand(68,97), confiab:rand(65,92), pairKey:'pair_'+(pairSeq++)
      });
      usedNames[p.nome] = true;
      usedTeams[p.team] = true;
    });
  }
  if(rivals.length < n){
    FILLER_NOMES.slice().sort(function(){ return Math.random()-0.5; }).forEach(function(f){
      if(rivals.length>=n) return;
      if(usedNames[f[0]] || usedTeams[f[1]]) return;
      var filler = buildRival(f[0], f[1]);
      filler.pairKey = 'pair_'+(pairSeq++);
      rivals.push(filler);
      usedNames[f[0]] = true;
      usedTeams[f[1]] = true;
    });
  }
  return rivals.slice(0, n);
}

// quanto o pacote aerodinâmico escolhido combina com o perfil da pista atual — pistas com
// aeroBias alto favorecem reta/vmáx, aeroBias baixo favorece curva. Pacote equilibrado (todas
// as stats ~50) fica sempre neutro (1x); um pacote bem encaixado rende até +6%, mal encaixado até -6%
function aeroFitMult(aero, track){
  if(!aero || !track || track.aeroBias==null) return 1;
  var bias = track.aeroBias/100;
  var straightScore = (aero.retas*0.6 + aero.vmax*0.4)/100;
  var cornerScore = aero.curvas/100;
  var fit = straightScore*bias + cornerScore*(1-bias);
  return 0.94 + Math.max(0,Math.min(1,fit))*0.12;
}

// qualidade do fornecedor de pneus escolhido — diferente do encaixe aero, não depende da pista,
// é só o quanto o composto em si é bom (aderência + consistência), igual o motor. Fornecedor
// mediano (~75 nas duas stats) fica perto de neutro; um bom fornecedor rende até +6%, um fraco até -6%
function tireQualityMult(tires){
  if(!tires) return 1;
  var avg = (tires.aderencia + tires.consistencia)/200;
  return 0.94 + Math.max(0,Math.min(1,avg))*0.12;
}

function computeScore(driver){
  var base = driver.vel*0.35 + driver.agr*0.15 + driver.cons*0.15 + driver.pot*0.25 + driver.confiab*0.10;
  base = base * (driver.scoreMult||1) * (driver.aeroMult||1) * (driver.tireMult||1);
  var varianceRange = (100-driver.cons)*0.4 * (driver.varMult||1);
  var noisy = base + (Math.random()*2-1)*varianceRange*0.3;
  return noisy;
}

function buildFieldBase(rivals){
  var field = [];
  var track = getActiveTrack();
  var myAeroMult = aeroFitMult(state.aero, track);
  var myTireMult = tireQualityMult(state.pneus);
  state.pilotos.forEach(function(p){
    field.push({
      nome:p.pais+' '+p.nome+' '+p.apelido, driverName:p.nome, year:p.year, team:state.teamName, mine:true,
      vel:p.vel, cons:p.cons, agr:p.agr,
      pot:state.motor.pot, confiab:state.motor.confiab,
      scoreMult:state.chefe.scoreMult, varMult:state.chefe.varMult, aeroMult:myAeroMult, tireMult:myTireMult
    });
  });
  var rivalMult = (RIVAL_DIFFICULTY[state.rivalDifficulty] || RIVAL_DIFFICULTY.normal).mult;
  rivals.forEach(function(r){
    field.push({
      nome:(r.pais?r.pais+' ':'')+r.nome, driverName:r.nome, year:r.year, team:r.team, personId:r.personId, teamKey:r.teamKey, pairKey:r.pairKey, mine:false,
      vel:r.vel, cons:r.cons, agr:r.agr, pot:r.pot, confiab:r.confiab,
      scoreMult:rivalMult, varMult:1, aeroMult:1, tireMult:1
    });
  });
  return field;
}

function rollDriverOutcome(d, laps, varBoost){
  var dnfChance = (100-d.confiab)*0.004;
  d.dnf = Math.random() < dnfChance;
  if(varBoost) d.varMult = (d.varMult||1) * varBoost;
  d.score = d.dnf ? -9999 - Math.random()*10 : computeScore(d);
  if(d.dnf) d._dnfLap = Math.max(1, Math.round(rand(1, Math.max(1,laps-2))));
}

function resolveRivalsOnly(field, laps, varBoost){
  field.forEach(function(d){ rollDriverOutcome(d, laps, varBoost); });
  return field;
}

function finalizeField(field){
  field.sort(function(a,b){ return b.score - a.score; });

  var pointsTable = [25,18,15,12,10,8,6,4,2,1];
  field.forEach(function(d,i){
    d.pos = i+1;
    d.pts = d.dnf ? 0 : (pointsTable[i]||0);
  });

  var leaderScore = field[0].score;
  field.forEach(function(d){
    d.gap = d.dnf ? 'ABANDONOU' : (d.pos===1? 'LÍDER' : '+'+((leaderScore-d.score)*0.31).toFixed(3)+'s');
  });

  return field;
}

function resolveRace(field, laps){
  field.forEach(function(d){ rollDriverOutcome(d, laps); });
  return finalizeField(field);
}

function startRace(){
  clearRaceTimers();
  clearTimeout(state.revealTimer);
  TOTAL_LAPS = 7;
  state.highlights = [];
  state.raceTrack = TRACKS[Math.floor(Math.random()*TRACKS.length)];
  var myPersonIds = state.pilotos.map(function(p){ return p.personId; });
  var rivals = buildRivalPool(10, myPersonIds);
  var field = resolveRace(buildFieldBase(rivals), TOTAL_LAPS);

  state.results = field;
  state.revealIndex = field.length; // will count down
  state.raceTimers = [];
  state.screen='race';
  render();
}

function fastestLapTime(d){
  var base = 96 - (d.vel*0.28 + d.pot*0.16);
  var t = Math.max(56, base + rand(-1.2,1.2));
  var mins = Math.floor(t/60);
  var secs = t - mins*60;
  return mins+':'+(secs<10?'0':'')+secs.toFixed(3);
}

function buildHighlights(field, track){
  var events = [];
  var finishers = field.filter(function(d){ return !d.dnf; });
  var dnfs = field.filter(function(d){ return d.dnf; });

  if(finishers.length>1){
    var starter = finishers[Math.floor(Math.random()*Math.min(6,finishers.length))];
    events.push({icon:'🏁', title:'Largada', text: shortName(starter.driverName)+' ('+starter.team+') teve uma saída forte e já ganhou posições nas primeiras curvas.'});
  }

  var stratDriver = field[Math.floor(Math.random()*field.length)];
  events.push({icon:'🔧', title:'Estratégia', text: 'Em '+track.name+', a '+stratDriver.team+' apostou numa janela de pit stop diferente da maioria — pista conhecida por '+track.flavor+'.'});

  dnfs.forEach(function(d){
    events.push({icon:'💥', title:'Abandono', text: shortName(d.driverName)+' ('+d.team+') parou na volta '+d._dnfLap+' e não viu a bandeira quadriculada.'});
  });

  if(finishers.length){
    var candidates = finishers.slice().sort(function(a,b){ return (b.vel+b.pot) - (a.vel+a.pot); }).slice(0,4);
    var flDriver = candidates[Math.floor(Math.random()*candidates.length)];
    events.push({icon:'⏱️', title:'Volta mais rápida', text: shortName(flDriver.driverName)+' ('+flDriver.team+') cravou a volta mais rápida da corrida: '+fastestLapTime(flDriver)+'.'});
  }

  var podium = field.slice(0,3);
  events.push({icon:'🏆', title:'Pódio', text: podium.map(function(d,i){ return (i+1)+'º '+shortName(d.driverName)+' ('+d.team+')'; }).join(' · ')});

  return events;
}

function applyStandings(field){
  var mineEntry = state.season.standings.filter(function(s){ return s.key==='mine'; })[0];
  var minePts = field.filter(function(d){ return d.mine; }).reduce(function(s,d){ return s+d.pts; },0);
  mineEntry.points += minePts;
  field.filter(function(d){ return !d.mine; }).forEach(function(d){
    var entry = state.season.standings.filter(function(s){ return s.key===d.teamKey; })[0];
    if(entry) entry.points += d.pts;
  });
  state.season.standings.sort(function(a,b){ return b.points - a.points; });
}

function startSeasonRace(watchLive){
  var track = state.season.tracks[state.season.trackIndex];
  TOTAL_LAPS = track.laps;
  state.raceTrack = track;
  var field = resolveRace(buildFieldBase(state.season.rivals), track.laps);
  applyStandings(field);
  var highlights = buildHighlights(field, track);
  state.season.history.push({track:track, results:field.slice(), highlights:highlights});

  state.results = field;
  state.highlights = highlights;
  state.highlightIndex = 0;

  if(watchLive){
    clearRaceTimers();
    clearTimeout(state.revealTimer);
    state.revealIndex = field.length;
    state.raceTimers = [];
    state.screen = 'race';
  } else {
    state.screen = 'highlights';
  }
  render();
}

/* ---------- temporada expressa: mesma temporada de 5 corridas, sem simulação ao vivo. cada
   corrida é resolvida de uma vez (o RESULTADO já está decidido), mas a REVELAÇÃO na tela é
   manual via DOM: os pilotos do top 5 (+ a posição da sua equipe, se ficar fora dele) vão
   surgindo um de cada vez dentro de uma <details> aberta; quando termina, ela fecha sozinha
   (sobra só a setinha nativa do <summary> pra reabrir e rever) e a próxima corrida começa.
   Depois do primeiro render() que monta o esqueleto da tela, tudo daqui pra frente mexe direto
   no DOM (sem chamar render() de novo) — assim um <details> que o jogador reabriu manualmente
   não é derrubado por um re-render de uma corrida seguinte. ---------- */
function clearQuickSeasonTimer(){
  if(state.qsTimer){ clearTimeout(state.qsTimer); state.qsTimer = null; }
}

// manchete curta pro resultado da corrida, tipo capa de jornal esportivo — olha pro campo já
// ordenado e escolhe o fato mais chamativo (checados em ordem de prioridade: zebra grande antes
// de resultado morno), sempre citando pista/piloto/equipe reais daquela corrida específica
function generateHeadline(field, track, seas){
  var pais = track.country;
  var mine = field.filter(function(d){ return d.mine; });
  var mineFinished = mine.filter(function(d){ return !d.dnf; }).sort(function(a,b){ return a.pos-b.pos; });
  var winner = field.filter(function(d){ return d.pos===1; })[0];
  var rivalKey = seas ? seas.titleRivalKey : null;
  var dnfs = field.filter(function(d){ return d.dnf; });

  if(mineFinished.length>=2 && mineFinished[0].pos===1 && mineFinished[1].pos===2){
    return '🏆 Dobradinha da '+state.teamName+' em '+pais+'!';
  }
  var rivalDnf = dnfs.filter(function(d){ return d.teamKey===rivalKey; })[0];
  if(rivalDnf){
    return '🎯 Zebra pra rival! '+shortName(rivalDnf.driverName)+' ('+rivalDnf.team+') abandona em '+pais+'.';
  }
  var favoriteDnf = dnfs.filter(function(d){ return d.vel>=90; }).sort(function(a,b){ return b.vel-a.vel; })[0];
  if(favoriteDnf){
    return '😱 Zebra em '+pais+': favorito '+shortName(favoriteDnf.driverName)+' abandona de vez.';
  }
  if(dnfs.length>=3){
    return '💥 Caos em '+pais+': '+dnfs.length+' abandonos na corrida.';
  }
  if(winner && winner.vel<70){
    return '🐴 Zebra! '+shortName(winner.driverName)+' ('+winner.team+') surpreende e vence em '+pais+'.';
  }
  if(mineFinished.length && mineFinished[0].pos===1){
    var second = field.filter(function(d){ return d.pos===2; })[0];
    var gapNum = second ? parseFloat((second.gap||'').replace(/[^0-9.]/g,'')) : null;
    if(gapNum!=null && gapNum<1){
      return '📸 Vitória apertadíssima da '+state.teamName+' em '+pais+'!';
    }
    return '🚀 Domínio da '+state.teamName+' em '+pais+' — vitória tranquila.';
  }
  if(mine.length && mine.every(function(d){ return d.dnf; })){
    return '💀 Corrida pra esquecer: a '+state.teamName+' não termina em '+pais+'.';
  }
  if(rivalKey){
    var rivalFinished = field.filter(function(d){ return d.teamKey===rivalKey && !d.dnf; }).sort(function(a,b){ return a.pos-b.pos; })[0];
    if(rivalFinished && rivalFinished.pos===1){
      return '🎯 Rival na ponta: '+shortName(rivalFinished.driverName)+' vence em '+pais+'.';
    }
  }
  return '🏁 '+shortName(winner.driverName)+' vence em '+pais+' pela '+winner.team+'.';
}

function resolveOneQuickRace(){
  var seas = state.season;
  var track = seas.tracks[seas.trackIndex];
  var field = resolveRace(buildFieldBase(seas.rivals), track.laps);
  applyStandings(field);
  var headline = generateHeadline(field, track, seas);
  var newBadges = [];
  if(field.some(function(d){ return d.mine && d.pos===1; }) && unlockBadge('first_win')) newBadges.push('first_win');
  var mineFinishedForBadge = field.filter(function(d){ return d.mine && !d.dnf; }).sort(function(a,b){ return a.pos-b.pos; });
  if(mineFinishedForBadge.length>=2 && mineFinishedForBadge[0].pos===1 && mineFinishedForBadge[1].pos===2 && unlockBadge('podium_lockout')) newBadges.push('podium_lockout');
  seas.history.push({track:track, results:field.slice(), highlights:buildHighlights(field, track), headline:headline, newBadges:newBadges});
  seas.trackIndex++;
}

function quickRaceRowHtml(d){
  var posClass = d.pos===1?'p1':d.pos===2?'p2':d.pos===3?'p3':'';
  return '<div class="row'+(d.mine?' mine':'')+(d.dnf?' dnf':'')+'" style="animation:none;opacity:1;">'+
    '<div class="pos '+posClass+'">'+d.pos+'</div>'+
    '<div class="row-main"><div class="row-driver">'+rivalNameHtml(shortName(d.driverName), d.teamKey)+'</div><div class="row-team">'+d.team+'</div></div>'+
    '<div class="row-pts">'+(d.pts>0?'+'+d.pts:'')+'</div>'+
  '</div>';
}

// lista de "passos" de revelação de uma corrida: primeiro o top 5 (em ordem, 1º ao 5º), depois
// a posição de qualquer piloto seu que tenha ficado fora do top 5
function quickRaceRevealItems(entry){
  var top5 = entry.results.slice(0, 5);
  var mineOutside = entry.results.filter(function(d){ return d.mine && d.pos>5; });
  return top5.map(function(d){ return quickRaceRowHtml(d); }).concat(mineOutside.map(function(d){
    return '<div class="footer-info" style="margin-top:2px;">'+(d.dnf ? ('❌ '+shortName(d.driverName)+' abandonou') : ('📍 '+shortName(d.driverName)+': P'+d.pos))+'</div>';
  }));
}

var QS_REVEAL_STEP_MS = 550; // intervalo entre cada piloto revelado
var QS_COLLAPSE_PAUSE_MS = 900; // pausa depois do último piloto, antes de fechar a caixa

function startNextQuickRace(){
  var seas = state.season;
  if(!seas || state.screen!=='quickseason') return;
  var board = document.getElementById('gpm-qs-board');
  if(!board) return;

  if(seas.trackIndex >= seas.tracks.length){ finishQuickSeasonUI(); return; }

  resolveOneQuickRace();
  var idx = seas.history.length-1;
  var entry = seas.history[idx];

  var newBadgesHtml = (entry.newBadges||[]).map(function(id){
    var a = ACHIEVEMENTS.filter(function(x){ return x.id===id; })[0];
    return a ? '<div class="footer-info" style="margin:4px 0;"><b style="color:var(--accent-2);">🎖️ Conquista desbloqueada: '+a.icon+' '+a.nome+'</b></div>' : '';
  }).join('');
  var det = el(
    '<details class="panel" open id="gpm-qs-race-'+idx+'">'+
      '<summary>Corrida '+(idx+1)+' de '+seas.tracks.length+' — '+entry.track.flag+' '+entry.track.name+'</summary>'+
      '<div class="footer-info" style="margin:8px 0;font-style:italic;">📰 '+entry.headline+'</div>'+
      newBadgesHtml+
      '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;" id="gpm-qs-rows-'+idx+'"></div>'+
    '</details>'
  );
  board.appendChild(det);
  det.scrollIntoView({behavior:'smooth', block:'center'});

  revealQuickRaceStep(idx, quickRaceRevealItems(entry), 0);
}

function revealQuickRaceStep(idx, items, i){
  if(state.screen!=='quickseason') return;
  var rowsEl = document.getElementById('gpm-qs-rows-'+idx);
  if(!rowsEl) return;
  if(i < items.length){
    rowsEl.appendChild(el(items[i]));
    state.qsTimer = setTimeout(function(){ revealQuickRaceStep(idx, items, i+1); }, QS_REVEAL_STEP_MS);
  } else {
    // todos os pilotos já apareceram — espera um instante, fecha a caixa (só a setinha do
    // summary continua clicável pra reabrir) e emenda na próxima corrida
    state.qsTimer = setTimeout(function(){
      var det = document.getElementById('gpm-qs-race-'+idx);
      if(det) det.open = false;
      startNextQuickRace();
    }, QS_COLLAPSE_PAUSE_MS);
  }
}

// resolve e monta instantaneamente (já com tudo revelado) o que faltar da temporada — usado só
// pelo botão "pular tudo"
function skipQuickSeason(){
  clearQuickSeasonTimer();
  var seas = state.season;
  if(!seas) return;
  var curIdx = seas.history.length-1;
  if(curIdx>=0){
    var rowsEl = document.getElementById('gpm-qs-rows-'+curIdx);
    if(rowsEl) rowsEl.innerHTML = quickRaceRevealItems(seas.history[curIdx]).join('');
    var curDet = document.getElementById('gpm-qs-race-'+curIdx);
    if(curDet) curDet.open = false;
  }
  var board = document.getElementById('gpm-qs-board');
  while(seas.trackIndex < seas.tracks.length){
    resolveOneQuickRace();
    var idx = seas.history.length-1;
    var entry = seas.history[idx];
    if(board){
      board.appendChild(el(
        '<details class="panel" id="gpm-qs-race-'+idx+'">'+
          '<summary>Corrida '+(idx+1)+' de '+seas.tracks.length+' — '+entry.track.flag+' '+entry.track.name+'</summary>'+
          '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">'+quickRaceRevealItems(entry).join('')+'</div>'+
        '</details>'
      ));
    }
  }
  finishQuickSeasonUI();
}

function finishQuickSeasonUI(){
  var seas = state.season;
  bumpSeasonsCompleted();
  var skipbar = document.getElementById('gpm-qs-skipbar');
  if(skipbar) skipbar.style.display = 'none';
  var actionsSlot = document.getElementById('gpm-qs-actions');
  if(!actionsSlot) return;
  actionsSlot.innerHTML = '';

  var standWrap = el('<div class="panel"></div>');
  standWrap.innerHTML = '<div class="timing-title" style="padding:0 0 8px;">Classificação final</div>'+titleRivalCalloutHtml(true)+standingsHtml(seas.standings);
  actionsSlot.appendChild(standWrap);

  var actions = el('<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;"></div>');
  var finish = el('<button class="btn">Ver resultado do campeonato</button>');
  finish.addEventListener('click', function(){ clearQuickSeasonTimer(); state.screen='champion'; render(); });
  var quit = el('<button class="btn ghost">Abandonar temporada</button>');

function renderQuickSeason(){
  var wrap = el('<div></div>');

  wrap.appendChild(el(
    '<div class="header">'+
      '<div class="eyebrow">'+(state.almanac ? '📖 Temporada Almanaque' : '⚡ Temporada Expressa')+'</div>'+
      '<h1>'+state.teamName+'</h1>'+
      '<div class="subtitle">Os resultados vão aparecendo piloto por piloto. Cada corrida fecha sozinha ao terminar — clique nela pra reabrir e rever.</div>'+
    '</div>'
  ));

  var introHtml = titleRivalIntroHtml();
  if(introHtml) wrap.appendChild(el('<div class="panel">'+introHtml+'</div>'));

  wrap.appendChild(el('<div id="gpm-qs-board"></div>'));
  wrap.appendChild(el('<div id="gpm-qs-actions"></div>'));

  var skipbar = el('<div class="skipbar" id="gpm-qs-skipbar"><button class="btn ghost">Pular tudo</button></div>');
  skipbar.querySelector('button').addEventListener('click', skipQuickSeason);
  wrap.appendChild(skipbar);

  // a partir daqui, tudo é manipulação direta do DOM (startNextQuickRace/revealQuickRaceStep) —

  clearQuickSeasonTimer();
  setTimeout(function(){ startNextQuickRace(); }, 50);

  return wrap;

var TOTAL_LAPS = 7;
var LAP_SECONDS = 15; // segundos "de universo" por volta em 1x — 2x/4x aceleram a reprodução, não o resultado

function clearRaceTimers(){
  (state.raceTimers||[]).forEach(function(id){ clearTimeout(id); });
  state.raceTimers = [];
  if(state.raceAnimFrame){ cancelAnimationFrame(state.raceAnimFrame); state.raceAnimFrame=null; }
}

/* ---------- corrida longa: previsão + estratégia + eventos ao vivo ---------- */

  ));

  );
